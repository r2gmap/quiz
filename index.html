<style>
:root {
  --neon-cyan: #0adaf1;
  --neon-purple: #8c3cf0;
  --bg-dark: #03050a;
}

body { 
  -webkit-font-smoothing: antialiased; 
  -moz-osx-font-smoothing: grayscale; 
}

html {
  background-color: var(--bg-dark) !important;
  scroll-behavior: smooth;
  scrollbar-width: none;
}
::-webkit-scrollbar { display: none; }

* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', system-ui, sans-serif;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100dvh;
  background: var(--bg-dark);
  color: #f0f4ff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: -50px;
  background:
    radial-gradient(circle at 20% 30%, rgba(10,218,241,0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(140,60,240,0.18) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(6,8,15,0.9) 0%, var(--bg-dark) 100%);
  pointer-events: none;
  z-index: 0;
  animation: spaceGlow 12s ease-in-out infinite alternate;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 15%  20%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 72%  8%,  rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 88%  35%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 32%  78%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 65% 88%, rgba(10,218,241,0.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 28% 42%, rgba(150,80,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 80%  70%, rgba(255,255,255,0.4) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

@keyframes spaceGlow {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.08) translate(20px, 20px); }
}

.main-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 1200px;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(40px, 6vw, 60px);
}

header { text-align: center; }

h1 {
  font-size: clamp(3rem, 10vw, 5.5rem);
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.1;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #ffffff 10%, #a2c2fe 40%, #5ad2f7 70%, #b3f2ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: pulseNeon 4s ease-in-out infinite alternate;
  position: relative;
}

@keyframes pulseNeon {
  0% { filter: drop-shadow(0 0 12px rgba(10,218,241,0.4)) drop-shadow(0 0 35px rgba(140,60,240,0.2)); }
  100% { filter: drop-shadow(0 0 25px rgba(10,218,241,0.75)) drop-shadow(0 0 55px rgba(140,60,240,0.45)); }
}

.description {
  font-size: clamp(0.95rem, 2.5vw, 1.1rem);
  font-weight: 400;
  color: rgba(175, 195, 235, 0.8);
  line-height: 1.8;
  letter-spacing: 0.5px;
}

.cards-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 30px;
  width: 100%;
}

.card-wrapper {
  animation: cardFloat 6s ease-in-out infinite;
}

@keyframes cardFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.card {
  position: relative;
  cursor: pointer;
  width: clamp(280px, 65vw, 340px);
  padding: 50px 35px 40px;
  border-radius: 28px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 70%, rgba(140,60,240,0.05) 100%);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid transparent;
  background-clip: padding-box;
  box-shadow:
    0 0 0 1px rgba(10,218,241,0.2),
    0 15px 40px rgba(0,0,0,0.5),
    inset 0 1px 2px rgba(255,255,255,0.08);
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease, border-color 0.4s ease;
  will-change: transform, box-shadow;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 28px;
  padding: 1.5px;
  background: linear-gradient(135deg, rgba(10,218,241,0.4) 0%, rgba(10,218,241,0.05) 40%, rgba(140,60,240,0.05) 60%, rgba(140,60,240,0.5) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0.8;
  transition: opacity 0.4s ease;
}

.card::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 50%;
  transform: translateX(-50%);
  width: 220px; height: 110px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(10,218,241,0.15) 0%, transparent 70%);
  opacity: 0.3;
  transition: opacity 0.4s ease, bottom 0.4s ease;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-6px);
  border-color: rgba(10,218,241,0.35);
  box-shadow:
    0 0 0 1px rgba(10,218,241,0.4),
    0 20px 45px rgba(0,0,0,0.6),
    0 0 30px rgba(10,218,241,0.15);
}

.card:hover::before { opacity: 1; }
.card:hover::after  { opacity: 0.7; bottom: -25px; }
.card:active        { transform: translateY(-2px); transition-duration: 0.1s; }

.hex-wrap {
  position: relative;
  width: 85px; height: 85px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 26px;
}

.hex-bg {
  position: absolute;
  inset: 0;
  clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  background: linear-gradient(145deg, rgba(10,218,241,0.15), rgba(140,60,240,0.18));
  border: 1px solid rgba(10,218,241,0.25);
  transition: background 0.4s ease, transform 0.4s ease;
}

.hex-wrap i {
  position: relative;
  font-size: 2.2rem;
  color: var(--neon-cyan);
  filter: drop-shadow(0 0 8px rgba(10,218,241,0.5));
  transition: transform 0.4s ease, filter 0.4s ease, color 0.4s ease;
  z-index: 1;
}

.card:hover .hex-bg {
  background: linear-gradient(145deg, rgba(10,218,241,0.25), rgba(140,60,240,0.28));
  transform: rotate(5deg);
}
.card:hover .hex-wrap i {
  transform: scale(1.08);
  filter: drop-shadow(0 0 12px var(--neon-cyan));
}

.card h3 {
  font-size: 1.4rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  transition: color 0.3s ease;
}
.card:hover h3 {
  color: var(--neon-cyan);
}

.card-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 28px;
  border-radius: 50px;
  border: 1px solid rgba(10,218,241,0.35);
  background: rgba(10,218,241,0.06);
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  pointer-events: none;
}

.card:hover .card-btn {
  background: rgba(10,218,241,0.15);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 15px rgba(10,218,241,0.25);
}

.card-btn i {
  font-size: 0.8rem;
  transition: transform 0.3s ease;
}
.card:hover .card-btn i { 
  transform: translateX(4px); 
}

@media (max-width: 600px) {
  .card-wrapper {
    animation: none;
  }
  .card {
    width: clamp(260px, 85vw, 320px);
    padding: 40px 24px 35px;
  }
  .hex-wrap { width: 75px; height: 75px; }
  .hex-wrap i { font-size: 1.9rem; }
  .card:hover { transform: translateY(-4px); }
  .card:active { transform: translateY(-1px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="main-container">
  <header>
    <h1>Quizzes</h1>
    <p class="description">
      Quizzes Will Be Available Next Year<br>
      See You Soon
    </p>
  </header>

  <div class="cards-container">
    <div class="card-wrapper">
      <div class="card"
           onclick="location.href='test2.html?id=games'"
           role="button"
           tabindex="0"
           aria-label="Games — Start Playing">

        <div class="hex-wrap">
          <div class="hex-bg"></div>
          <i class="fas fa-gamepad"></i>
        </div>

        <h3>Games</h3>

        <div class="card-btn">
          Start Playing <i class="fas fa-arrow-right"></i>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.querySelector('.card').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    location.href = 'subject.html?id=sums';
  }
});
</script>

</body>
</html>
