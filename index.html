<meta charset="UTF-8">

<meta name="color-scheme" content="dark">
<meta name="description" content="Quizzes — Tap On Any Part To Make Small Pubbles">
<meta property="og:title" content="Quizzes — Out Of Service">
<meta property="og:description" content="Where memories linger in quiet silence.">
<title>Quizzes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23071018' stroke='%230adaf1' stroke-opacity='.55'/%3E%3Ccircle cx='11' cy='11' r='3' fill='%23bdeff9'/%3E%3C/svg%3E">

<style>
/* ==========================================================================
   QUIZZES — MEMORIAL / END-OF-SERVICE  (v2, "the quiet room")
   --------------------------------------------------------------------------
   Concept: you are standing at a frosted pane at night, looking into the
   dark room where Quizzes used to live. Everything on screen is glass,
   water, or light. A desk with a monitor that is still faintly warm. A wall
   clock stopped at 11:47. City lights beyond the far window. Rain on the
   pane, refracting all of it.

   Layer stack (back → front):
     0  canvas#rain     — room, frost, rain, droplets, bolts, glow
     1  #lightning      — DOM screen-blend flash wash
     2  .vignette       — pane edge
     3  .stage          — the engraved wordmark (glass plane, fixed)
     5  #grain          — whisper of film grain (compositor only)
     10+ UI chrome      — sound toggle, feedback card, fab, toast
     30 #veil           — cinematic blackout, fades once fonts are ready
   ========================================================================== */

:root {
  --ink:        #eaf4fa;
  --ink-dim:    rgba(226, 240, 248, .55);
  --accent:     #0adaf1;
  --glass-bg:   rgba(10, 16, 24, .55);
  --glass-line: #ffffff1a;
  --font-display: 'Outfit', 'Avenir Next', 'Segoe UI', sans-serif;
  --font-serif:   'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-arabic:  'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --flash: 0;                      /* lightning level, driven from JS */
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

body {
  background: #04060b;
  color: var(--ink);
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
}

::selection { background: rgba(10, 218, 241, .28); color: #f0fdff; }
:focus-visible { outline: 2px solid rgba(10, 218, 241, .55); outline-offset: 3px; }

/* --------------------------------------------------------------------------
   CANVAS + ATMOSPHERE OVERLAYS
   -------------------------------------------------------------------------- */
#rain {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%; display: block;
}

/* Lightning wash — soft blue/white bloom, opacity driven every frame by the
   Lightning controller so the DOM flash and the canvas flash breathe as one. */
#lightning {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: 0; will-change: opacity;
  background: radial-gradient(130% 100% at 50% 0%,
              rgba(225, 240, 255, .95) 0%, rgba(150, 195, 235, .40) 30%,
              rgba(80, 120, 170, .14) 55%, rgba(0, 0, 0, 0) 75%);
  mix-blend-mode: screen;
}

/* Physical pane edge — focuses the centre, sells the window */
.vignette {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(120% 120% at 50% 42%,
              rgba(0, 0, 0, 0) 55%, rgba(2, 4, 8, .46) 100%);
  box-shadow: inset 0 0 0 1px rgba(170, 205, 235, .05),
              inset 0 0 150px rgba(0, 0, 0, .52),
              inset 0 1px 0 rgba(255, 255, 255, .035);
}

/* Film grain: a JS-generated noise tile on a 200% oversized, transform-only
   layer. steps() jitter = shimmer with zero layout/paint cost. */
#grain {
  position: fixed; left: -50%; top: -50%; width: 200%; height: 200%;
  z-index: 5; pointer-events: none; opacity: .05;
  mix-blend-mode: overlay;
  background-repeat: repeat; background-size: 130px 130px;
  will-change: transform;
}
body.is-ready #grain { animation: grainShift 1.4s steps(5) infinite; }
@keyframes grainShift {
  0%   { transform: translate3d(0, 0, 0); }
  20%  { transform: translate3d(-1.4%, .9%, 0); }
  40%  { transform: translate3d(.8%, -1.2%, 0); }
  60%  { transform: translate3d(-.6%, -.7%, 0); }
  80%  { transform: translate3d(1.1%, .5%, 0); }
  100% { transform: translate3d(0, 0, 0); }
}

/* Cinematic blackout — fades out the moment the wordmark fonts are ready. */
#veil {
  position: fixed; inset: 0; z-index: 30; pointer-events: none;
  background: #02040a; opacity: 1;
  transition: opacity 1.8s ease .15s;
}
body.is-ready #veil { opacity: 0; }

/* --------------------------------------------------------------------------
   CENTERPIECE — the engraved-glass wordmark
   Three identical layers stacked in one grid cell:
     .logo-halo   → blurred frosted bloom behind (the pane's inner light)
     .logo-carve  → the chiselled face: gradient fill clipped to the glyphs
                    + layered text-shadows (recessed dark upper lip, lit
                    lower lip, inner occlusion) = the incuse illusion
     .logo-flash  → a white glint whose opacity follows --flash, so the
                    engraving catches the lightning
   -------------------------------------------------------------------------- */
.stage {
  position: fixed; inset: 0; z-index: 3;
  display: grid; place-items: center;
  padding: 24px; pointer-events: none;
}
.stage-inner {
  display: flex; flex-direction: column; align-items: center;
  transition: transform .9s cubic-bezier(.25, .8, .25, 1);
  will-change: transform;
}
/* On short viewports, when the message card is open, slide the memorial up
   so the two never fight for space. */
body.widget-open.compact .stage-inner { transform: translateY(-9vh); }

.kicker {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(10px, 2vw, 18px);
  font-weight: 300;
  font-size: clamp(.58rem, 1.3vw, .72rem);
  letter-spacing: .45em; text-indent: .45em;
  text-transform: uppercase;
  color: rgba(196, 220, 236, .42);
  opacity: 0;                                  /* revealed by is-ready */
}
.kicker::before, .kicker::after {
  content: ""; height: 1px; width: clamp(26px, 7vw, 84px);
  background: rgba(196, 220, 236, .2);
}

.logo {
  display: grid; margin-top: clamp(.9rem, 2.4vw, 1.5rem);
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(2.5rem, 7vw, 5.5rem);        /* fluid scaling, per spec */
  line-height: 1.05;
  letter-spacing: -.018em;
  user-select: none; cursor: default;
  opacity: 0;
}
.logo > span { grid-area: 1 / 1; }              /* stack all layers in one cell */

.logo-halo {
  filter: blur(16px);
  color: rgba(232, 240, 245, 0.5);
  animation: halo-breathe 9s ease-in-out infinite;
}
.logo-halo .z { color: rgba(30, 219, 233, 0.55); }

.logo-carve {
  background: linear-gradient(180deg,
    rgba(248, 250, 252, .95) 0%,               /* #f8fafc — frosted glass white */
    rgba(226, 238, 246, .66) 34%,
    rgba(243, 244, 245, 0.808) 58%,               /* shaded belly of the carve */
    rgba(210, 230, 242, .55) 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.logo-carve .z {                                /* "zes" — luminous cyan half */
  background: linear-gradient(180deg,
    #e6fcff 0%, #16636b 30%, var(--accent) 62%, #078a9ecc 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.logo-flash {                                   /* lightning glint on the etch */
  color: #fff;
  opacity: calc(var(--flash) * 0.62);
  filter: blur(1px);
  transition: opacity .12s linear;
}
@keyframes halo-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

/* Subtitle — quiet, italic, wide-tracked */
.tagline {
  margin-top: clamp(1.1rem, 2.8vw, 1.7rem);
  font-family: var(--font-serif);
  font-style: italic; font-weight: 300;
  font-size: clamp(.95rem, 2.3vw, 1.35rem);
  letter-spacing: .15em;
  text-wrap: balance;
  color: var(--ink-dim);
  text-shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 0 18px rgba(120, 175, 205, .14);
  opacity: 0;
}

/* Service dates — the memorial plaque line */
.dates {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(12px, 2.4vw, 18px);
  margin-top: clamp(1.5rem, 3.6vw, 2.3rem);
  font-weight: 300;
  font-size: clamp(.6rem, 1.4vw, .72rem);
  letter-spacing: .42em;
  color: rgba(178, 204, 222, .34);
  opacity: 0;
}
.dates::before, .dates::after {
  content: ""; height: 1px; width: clamp(30px, 8vw, 90px);
  background: rgba(178, 204, 222, .18);
}

/* Whisper invitation — teaches the wipe-the-glass interaction */
.hint {
  margin-top: clamp(2rem, 6vh, 3.4rem);
  font-family: var(--font-serif);
  font-style: italic;
  font-size: clamp(.8rem, 1.8vw, .95rem);
  letter-spacing: .12em;
  color: rgba(168, 196, 216, .42);
  opacity: 0; transform: translateY(6px);
  transition: opacity 1.6s ease, transform 1.6s ease;
}
.hint.is-visible { opacity: 1; transform: none; }

/* One-time entrance, gated on fonts (body.is-ready), staggered downward */
body.is-ready .kicker  { animation: rise 1.5s cubic-bezier(.22,.7,.25,1) .15s both; }
body.is-ready .logo    { animation: rise 1.7s cubic-bezier(.22,.7,.25,1) .30s both; }
body.is-ready .tagline { animation: rise 1.6s cubic-bezier(.22,.7,.25,1) .55s both,
                                  tagline-breathe 12s ease-in-out 3.5s infinite; }
body.is-ready .dates   { animation: rise 1.6s cubic-bezier(.22,.7,.25,1) .75s both; }
@keyframes rise {
  from { opacity: 0; transform: translate3d(0, 22px, 0); filter: blur(8px); }
  to   { opacity: 1; transform: translate3d(0, 0, 0);    filter: blur(0); }
}
@keyframes tagline-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }

/* --------------------------------------------------------------------------
   AMBIENT SOUND TOGGLE (top-right, 44px touch target)
   -------------------------------------------------------------------------- */
.sound-btn {
  position: fixed; z-index: 10;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  color: rgba(214, 234, 246, .75);
  background: rgba(10, 16, 24, .42);
  border: 1px solid var(--glass-line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
  cursor: pointer;
  transition: color .25s, background .25s, transform .15s;
}
.sound-btn:hover { color: #eaf6fc; background: rgba(14, 22, 32, .62); }
.sound-btn:active { transform: scale(.92); }
.sound-btn .ico-off { display: none; }
.sound-btn.is-muted { color: rgba(150, 170, 185, .5); }
.sound-btn.is-muted .ico-on { display: none; }
.sound-btn.is-muted .ico-off { display: block; }
/* gentle attention pulse while autoplay is still blocked */
.sound-btn.attn::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  border: 1px solid rgba(10, 218, 241, .5);
  animation: attn 2.2s ease-out infinite;
}
@keyframes attn { 0% { transform: scale(.8); opacity: .8; } 70%, 100% { transform: scale(1.55); opacity: 0; } }
/* one-shot ripple the moment the storm actually comes alive */
.sound-btn.live::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(10, 218, 241, .6);
  animation: livePing .9s ease-out 1;
}
@keyframes livePing { from { transform: scale(1); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }

/* --------------------------------------------------------------------------
   FEEDBACK WIDGET — frosted glassmorphism card (RTL Arabic)
   Collapsible state machine:  hidden → open ⇄ minimized  (driven from JS)
   -------------------------------------------------------------------------- */
.feedback {
  position: fixed; z-index: 12;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: 12px; right: 12px; max-width: 400px; margin-inline: auto;  /* bottom-centre on mobile */
  font-family: var(--font-arabic);
  background: var(--glass-bg);
  backdrop-filter: blur(16px) saturate(1.25);
  -webkit-backdrop-filter: blur(16px) saturate(1.25);
  border: 1px solid var(--glass-line);        /* translucent #ffffff1a edge */
  border-radius: 20px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 4px 14px rgba(0, 0, 0, .35),
              inset 0 1px 0 rgba(255, 255, 255, .07);
  visibility: hidden; opacity: 0;
  transform: translate3d(0, 150%, 0);           /* parked below the fold */
  will-change: transform, opacity;
}
.feedback::before {                             /* hairline of light along the top rim */
  content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .18), transparent);
}
@media (min-width: 640px) {
  .feedback { left: auto; right: 24px; bottom: 24px; width: 380px; margin-inline: 0; }
}

/* Entrance: soft spring — overshoot, settle, done (added by JS after 2.5s) */
.feedback.is-open { visibility: visible; animation: spring-in .95s cubic-bezier(.2, 1.28, .4, 1) both; }
@keyframes spring-in {
  0%   { opacity: 0; transform: translate3d(0, 150%, 0) scale(.92); }
  55%  { opacity: 1; transform: translate3d(0, -8px, 0)  scale(1.015); }
  75%  { transform: translate3d(0, 3px, 0) scale(.995); }
  100% { opacity: 1; transform: translate3d(0, 0, 0)   scale(1); }
}
/* Exit: fold away beneath the viewport */
.feedback.is-closing { visibility: visible; animation: fold-away .38s cubic-bezier(.5, 0, .75, .2) both; }
@keyframes fold-away {
  from { opacity: 1; transform: translate3d(0, 0, 0)    scale(1); }
  to   { opacity: 0; transform: translate3d(0, 118%, 0) scale(.94); }
}

.fb-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 8px 14px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, .07);
}
.fb-title { display: flex; align-items: center; gap: 10px; color: #e9f5fb; }
.fb-title svg { color: rgba(10, 218, 241, .6); flex: none; }
.fb-title h2 { font-size: 1.02rem; font-weight: 500; }

.fb-min {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  background: transparent; border: 0; border-radius: 12px;
  color: rgba(200, 222, 236, .55); cursor: pointer;
  transition: background .2s, color .2s;
}
.fb-min:hover { background: rgba(255, 255, 255, .06); color: #dcedf6; }

.fb-body { padding: 14px; display: grid; gap: 10px; }

/* Message textarea — dark translucent fill, auto-grows, custom scrollbar */
.fb-msg {
  width: 100%; min-height: 104px; max-height: 176px; resize: none;
  padding: 12px 14px; border-radius: 14px;
  background: rgba(4, 8, 14, .55);
  border: 1px solid rgba(255, 255, 255, .08);
  color: #e9f5fb; caret-color: var(--accent);
  font-family: inherit; font-size: 16px; font-weight: 300; line-height: 1.9;
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .16) transparent;
  transition: border-color .25s, background .25s;
}
.fb-msg:focus { outline: none; border-color: rgba(10, 218, 241, .35); background: rgba(5, 10, 17, .7); }
.fb-msg::placeholder { color: rgba(170, 196, 214, .38); }
.fb-msg::-webkit-scrollbar { width: 6px; }
.fb-msg::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .16); border-radius: 99px; }
.fb-msg::-webkit-scrollbar-track { background: transparent; }
.fb-msg.shake { animation: shake .4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); }
  50% { transform: translateX(4px); }    75% { transform: translateX(-2px); }
}

.fb-meta {
  display: flex; align-items: center; justify-content: space-between;
  font-size: .72rem; font-weight: 300; color: rgba(168, 194, 212, .42);
}
.count { transition: color .3s; }
.count.warn { color: rgba(255, 200, 130, .85); }
.count.max  { color: rgba(255, 140, 120, .9); }

/* Send button — active glow on hover, spinner while dispatching */
.btn-send {
  position: relative; width: 100%; min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border-radius: 14px; cursor: pointer;
  font-family: inherit; font-size: 1rem; font-weight: 500;
  color: #bdf3fb;
  background: rgba(10, 218, 241, .10);
  border: 1px solid rgba(10, 218, 241, .32);
  transition: background .25s, box-shadow .25s, transform .15s, color .25s;
  -webkit-user-select: none; user-select: none;
}
.btn-send svg { flex: none; }
.btn-send:hover:not(:disabled) {
  background: rgba(10, 218, 241, .2); color: #e4fbff;
  box-shadow: 0 0 22px rgba(10, 218, 241, .22), inset 0 0 12px rgba(10, 218, 241, .08);
}
.btn-send:active:not(:disabled) { transform: translateY(1px); }
.btn-send:disabled { cursor: default; opacity: .8; }
.btn-send .spinner { display: none; }
.btn-send.is-loading { pointer-events: none; }
.btn-send.is-loading .btn-label, .btn-send.is-loading svg:not(.spinner) { opacity: 0; }
.btn-send.is-loading .spinner {
  display: block; position: absolute; inset: 0; margin: auto;
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(155, 238, 251, .22); border-top-color: #9beefb;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Success confirmation — drawn-check overlay inside the card */
.fb-done {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 18px; border-radius: 20px; text-align: center;
  background: rgba(7, 12, 19, .86);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  opacity: 0; visibility: hidden;
  transition: opacity .45s ease, visibility 0s .45s;
}
.fb-done.show { opacity: 1; visibility: visible; transition: opacity .45s ease; }
.fb-done svg { width: 56px; height: 56px; }
.fb-done .ring {
  fill: none; stroke: rgba(10, 218, 241, .55); stroke-width: 2.5; stroke-linecap: round;
  stroke-dasharray: 170; stroke-dashoffset: 170;
  transition: stroke-dashoffset .7s cubic-bezier(.3, .8, .3, 1) .15s;
}
.fb-done .tick {
  fill: none; stroke: #9beefb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 42; stroke-dashoffset: 42;
  transition: stroke-dashoffset .45s ease .6s;
}
.fb-done.show .ring { stroke-dashoffset: 0; }
.fb-done.show .tick { stroke-dashoffset: 0; }
.done-title { font-size: 1.02rem; font-weight: 500; color: #e9f5fb; }
.done-sub   { font-size: .78rem; font-weight: 300; color: rgba(168, 194, 212, .55); }

/* --------------------------------------------------------------------------
   FLOATING TRIGGER — appears only while the card is minimized
   -------------------------------------------------------------------------- */
.fab {
  position: fixed; z-index: 11;
  right: max(18px, env(safe-area-inset-right, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  color: #9beefb; cursor: pointer;
  background: rgba(10, 17, 26, .55);
  border: 1px solid rgba(255, 255, 255, .14);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 12px 34px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .08);
  visibility: hidden; opacity: 0;
  transform: translate3d(0, 90px, 0) scale(0);
  transition: transform .45s cubic-bezier(.2, 1.2, .3, 1), opacity .3s, visibility 0s .45s;
  will-change: transform;
}
.fab.is-visible {
  visibility: visible; opacity: 1;
  transform: translate3d(0, 0, 0) scale(1);
  transition: transform .5s cubic-bezier(.2, 1.4, .35, 1), opacity .3s, visibility 0s;
}
.fab:hover { color: #d9fbff; border-color: rgba(10, 218, 241, .4); }
.fab.is-visible:active { transform: translate3d(0, 0, 0) scale(.9); }
.fab::after {                                   /* slow invitation pulse */
  content: ""; position: absolute; inset: -7px; border-radius: 50%;
  border: 1px solid rgba(10, 218, 241, .4); pointer-events: none;
  animation: fab-pulse 3.2s ease-out infinite;
}
@keyframes fab-pulse { 0% { transform: scale(.85); opacity: .6; } 70%, 100% { transform: scale(1.35); opacity: 0; } }

/* --------------------------------------------------------------------------
   TOAST — top-centre status pill with a draining progress hairline
   -------------------------------------------------------------------------- */
.toast {
  position: fixed; z-index: 20;
  top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%;
  transform: translate3d(-50%, -16px, 0); opacity: 0;
  display: flex; align-items: center; gap: 10px;
  max-width: min(92vw, 420px);
  padding: 12px 18px; border-radius: 14px;
  font-family: var(--font-arabic); font-size: .92rem;
  background: rgba(8, 14, 22, .72);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, .12);
  box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
  color: #e6f3f9; pointer-events: none;
  transition: transform .4s cubic-bezier(.2, 1.1, .3, 1), opacity .35s;
}
.toast.is-visible { transform: translate3d(-50%, 0, 0); opacity: 1; }
.toast .t-ok { color: #6fe8c4; display: none; }
.toast .t-err { color: #ff9d8f; display: none; }
.toast.success .t-ok { display: block; }
.toast.error   .t-err { display: block; }
.toast::after {
  content: ""; position: absolute; left: 16px; right: 16px; bottom: 6px; height: 1px;
  background: rgba(255, 255, 255, .22); border-radius: 2px;
  transform-origin: left center; transform: scaleX(0);
}
.toast.is-visible::after { animation: toastBar 3.2s linear forwards; }

<script>
'use strict';
/* ==========================================================================
   QUIZZES — MEMORIAL  ·  application script
   --------------------------------------------------------------------------
   Modules, in order:
     1. Telegram configuration            7. Lightning controller + bolts
     2. Utilities & environment            8. Audio synthesis engine
     3. Canvas surfaces & the room scene   9. Main loop (physics + render)
     4. Parallax (depth behind the glass) 10. Pointer condensation & halo
     5. Droplet physics + rendering       11. UI: widget, toast, sound
     6. Rain streaks & wind               12. Boot sequence

/* ========================================================= */
/* TELEGRAM BOT CONFIGURATION - REPLACE WITH YOUR CREDENTIALS */
/* ========================================================= */
const TELEGRAM_BOT_TOKEN = "8553775824:AAF3GClTP9ldHvdf5Pvx1ozRAdbOQXpir9w";
const TELEGRAM_CHAT_ID   = "8408968285";

/* ====================================================================== */
/* 2. UTILITIES & ENVIRONMENT                                             */
/* ====================================================================== */
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

var REDUCED_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* Deterministic PRNG (mulberry32). Both room renders (normal + lightning-lit)
   use the same seed so their geometry matches exactly — only brightness
   differs. That is what lets a droplet lens swap scenes mid-flash without
   the room "jumping". */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
