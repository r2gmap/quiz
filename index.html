/* ====================================================================== */
/* 3. CANVAS SURFACES & THE ROOM SCENE                                    */
/* ====================================================================== */
/* Rendering strategy, back to front:
   - `scene` / `litScene` : the room, pre-rendered TWICE (dark pass + a
     lightning-lit pass with identical geometry). Static per resize.
   - `frost`              : the room pushed through a chain of halvings —
     down- and up-scaling gives a gaussian-ish blur at zero per-frame cost.
     A light second pass at 1/4 resolution keeps a whisper of mid-frequency
     so the frost reads as real diffused glass rather than uniform mush.
   - main `ctx`           : frost → monitor glow → flash wash → bolt →
     far rain → near rain → wet-trail sheens → droplets → pointer halo.
   Everything the user sees sharply (the room) is only ever visible THROUGH
   a droplet lens — that is the core illusion of the page. */

var canvas = document.getElementById('rain');
var ctx    = canvas.getContext('2d', { alpha: false });      // opaque = faster

var scene    = document.createElement('canvas'), sceneCtx  = scene.getContext('2d');
var litScene = document.createElement('canvas'), litCtx    = litScene.getContext('2d');
var frost    = document.createElement('canvas'), frostCtx  = frost.getContext('2d');
var cHalf    = document.createElement('canvas'), halfCtx  = cHalf.getContext('2d');
var cQuart   = document.createElement('canvas'), quartCtx = cQuart.getContext('2d');
var cEighth  = document.createElement('canvas'), eighthCtx = cEighth.getContext('2d');
var farC     = document.createElement('canvas'), farCtx   = farC.getContext('2d');
var boltC    = document.createElement('canvas'), bctx      = boltC.getContext('2d');

var W = 0, H = 0, DPR = 1;          // CSS viewport size & capped device ratio
var P = 24;                          // parallax overscan margin (px)
var RW = 0, RH = 0;                 // ROOM dimensions = viewport + 2*P
var FARM = 26, FARMV = 18;          // far-rain layer overscan margins
var FAR_W = 0, FAR_H = 0;
var quality = 1;                    // adaptive quality scalar (0.45 … 1)
var flashGrad = null;               // cached in-canvas lightning wash gradient
var room = { glowX: 0, glowY: 0 };  // monitor position in room coordinates

/* Size every surface to the viewport. DPR is capped by a total pixel budget
   so 4K/5K screens never allocate gigabytes of backing store. */
function sizeAll() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2,
                            Math.sqrt(9000000 / Math.max(1, W * H))));
  P = Math.round(clamp(Math.min(W, H) * 0.03, 10, 26));
  RW = W + P * 2; RH = H + P * 2;

  canvas.width  = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);             // draw in CSS pixels

  var pw = Math.round(RW * DPR), ph = Math.round(RH * DPR);
  scene.width = litScene.width = frost.width = pw;
  scene.height = litScene.height = frost.height = ph;
  cHalf.width  = Math.max(1, pw >> 1);  cHalf.height  = Math.max(1, ph >> 1);
  cQuart.width = Math.max(1, pw >> 2); cQuart.height = Math.max(1, ph >> 2);
  cEighth.width= Math.max(1, pw >> 3); cEighth.height= Math.max(1, ph >> 3);

  FAR_W = W + FARM * 2; FAR_H = H + FARMV * 2;
  farC.width  = Math.max(1, Math.round(FAR_W * DPR / 4));
  farC.height = Math.max(1, Math.round(FAR_H * DPR / 4));

  /* bolt canvas at half resolution — the upscale doubles as its blur */
  boltC.width  = Math.max(1, Math.round(W / 2));
  boltC.height = Math.max(1, Math.round(H * 0.72 / 2));

  buildScenes();
  buildFrost();

  flashGrad = ctx.createLinearGradient(0, 0, 0, H * 0.85);
  flashGrad.addColorStop(0, 'rgba(190, 220, 255, 1)');
  flashGrad.addColorStop(1, 'rgba(190, 220, 255, 0)');

  initStreaks();
}

/* --- THE ROOM ------------------------------------------------------------
   Everything is drawn as large, soft silhouettes because it is only ever
   seen through heavy frost — but the DROPLETS refract it sharply, and the
   narrative details (a stopped clock at 11:47, a desk, a monitor that is
   still faintly glowing, city lights beyond the far window) reward anyone
   who looks closely. That is the story of the memorial. */
function drawRoom(g, lit) {
  var w = RW, h = RH, i, x, y, r, a, c, rg;
  var R = mulberry32(20191231);          // same seed for both passes
  var L = lit ? 2.3 : 1;                 // luminance multiplier for the lit pass
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* 1 — base gradient: night sky bleeding down into the dark room */
  var bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0,    lit ? '#152238' : '#0a111c');
  bg.addColorStop(0.45, lit ? '#0c1524' : '#070c16');
  bg.addColorStop(0.72, lit ? '#080f1a' : '#050a12');
  bg.addColorStop(1,    '#030509');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);

  /* 2 — moonlight, upper right */
  var mx = w * 0.68, my = h * 0.15;
  rg = g.createRadialGradient(mx, my, 0, mx, my, Math.min(w, h) * 0.55);
  rg.addColorStop(0,    'rgba(205,228,250,' + (lit ? 0.55 : 0.22) + ')');
  rg.addColorStop(0.35, 'rgba(150,185,225,' + (lit ? 0.20 : 0.09) + ')');
  rg.addColorStop(1,    'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);

  /* 3 — geometry of the room's far window */
  var wx0 = w * 0.18, wx1 = w * 0.82, wy0 = h * 0.10, wy1 = h * 0.665;

  /* 4 — distant city lights behind the far window (they become beautiful
     bokeh dots under the frost, and they flare inside the droplets) */
  var bandY = h * 0.555, bandH = h * 0.095;
  for (i = 0; i < 46; i++) {
    x = wx0 + R() * (wx1 - wx0);
    y = bandY + R() * bandH;
    r = 0.8 + R() * R() * 2.4;
    a = (0.10 + R() * 0.22) * L; if (a > 0.85) a = 0.85;
    c = R() < 0.3 ? '255,212,168' : '168,208,246';    // warm / cold windows
    rg = g.createRadialGradient(x, y, 0, x, y, r * 4.5);
    rg.addColorStop(0, 'rgba(' + c + ',' + a.toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(' + c + ',0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r * 4.5, 0, 6.2832); g.fill();
  }

  /* 5 — furniture silhouettes (drawn under the window frame) */
  var dk = 'rgba(2,5,10,';
  g.fillStyle = dk + '0.85)';
  /* desk: top slab + two legs */
  g.fillRect(w * 0.02,  h * 0.705, w * 0.30, Math.max(5, h * 0.014));
  g.fillRect(w * 0.045, h * 0.705, Math.max(3, w * 0.008), h * 0.20);
  g.fillRect(w * 0.275, h * 0.705, Math.max(3, w * 0.008), h * 0.20);
  /* monitor: bezel block + lighter face + stand. The face sits under the
     animated glow sprite (drawn per frame on the main canvas). */
  g.fillRect(w * 0.145, h * 0.555, w * 0.115, h * 0.115);
  g.fillStyle = dk + '0.55)';
  g.fillRect(w * 0.155, h * 0.565, w * 0.095, h * 0.095);
  g.fillStyle = dk + '0.85)';
  g.fillRect(w * 0.195, h * 0.670, w * 0.015, h * 0.035);
  /* an empty chair beside the desk */
  g.fillRect(w * 0.315, h * 0.585, w * 0.028, h * 0.14);
  g.fillRect(w * 0.30,  h * 0.72,  w * 0.10,  Math.max(5, h * 0.02));
  g.fillRect(w * 0.305, h * 0.735, Math.max(3, w * 0.007), h * 0.165);
  g.fillRect(w * 0.388, h * 0.735, Math.max(3, w * 0.007), h * 0.165);
  /* bookshelf against the right wall, with book spines */
  var bx0 = w * 0.775, bx1 = w * 0.975, by0 = h * 0.16, by1 = h * 0.64;
  g.fillStyle = dk + '0.8)';
  g.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
  g.fillStyle = 'rgba(120,150,185,' + (lit ? 0.20 : 0.08) + ')';
  for (i = 1; i <= 4; i++) {
    g.fillRect(bx0 + w * 0.008, by0 + (by1 - by0) * i / 5 - 1,
               (bx1 - bx0) - w * 0.016, Math.max(1.5, h * 0.004));
  }
  g.fillStyle = 'rgba(150,180,215,' + (lit ? 0.22 : 0.09) + ')';
  var nb = 10 + ((R() * 8) | 0);
  for (i = 0; i < nb; i++) {
    var shelf = 1 + ((R() * 4) | 0);
    var sy = by0 + (by1 - by0) * shelf / 5;
    var bw2 = 2 + R() * 5, bh2 = h * (0.02 + R() * 0.045);
    g.fillRect(bx0 + w * 0.02 + R() * ((bx1 - bx0) - w * 0.05), sy - bh2, bw2, bh2);
  }

  /* 6 — the wall clock, hands frozen at 11:47 — the moment it ended */
  var cx0 = w * 0.095, cy0 = h * 0.225, cr = Math.min(w, h) * 0.036;
  g.beginPath(); g.arc(cx0, cy0, cr, 0, 6.2832);
  g.fillStyle = 'rgba(180,208,235,' + (lit ? 0.10 : 0.045) + ')'; g.fill();
  g.lineWidth = Math.max(1.5, cr * 0.06);
  g.strokeStyle = 'rgba(190,215,240,' + (lit ? 0.5 : 0.20) + ')'; g.stroke();
  g.strokeStyle = 'rgba(200,225,248,' + (lit ? 0.5 : 0.22) + ')';
  g.lineWidth = Math.max(1, cr * 0.045);
  for (i = 0; i < 12; i++) {
    var ta = i / 12 * 6.2832;
    g.beginPath();
    g.moveTo(cx0 + Math.cos(ta) * cr * 0.82, cy0 + Math.sin(ta) * cr * 0.82);
    g.lineTo(cx0 + Math.cos(ta) * cr * 0.93, cy0 + Math.sin(ta) * cr * 0.93);
    g.stroke();
  }
  var hAng = (11 + 47 / 60) / 12 * 6.2832 - 1.5708;
  var mAng = 47 / 60 * 6.2832 - 1.5708;
  g.lineCap = 'round';
  g.lineWidth = Math.max(1.5, cr * 0.075);
  g.beginPath(); g.moveTo(cx0, cy0);
  g.lineTo(cx0 + Math.cos(hAng) * cr * 0.45, cy0 + Math.sin(hAng) * cr * 0.45); g.stroke();
  g.lineWidth = Math.max(1, cr * 0.05);
  g.beginPath(); g.moveTo(cx0, cy0);
  g.lineTo(cx0 + Math.cos(mAng) * cr * 0.68, cy0 + Math.sin(mAng) * cr * 0.68); g.stroke();

  /* 7 — window frame: jambs, two mullions, lintel and sill */
  g.fillStyle = 'rgba(3,6,11,0.9)';
  var mw2 = Math.max(4, Math.min(w, h) * 0.0075);
  g.fillRect(w * 0.40 - mw2 / 2, wy0, mw2, wy1 - wy0);
  g.fillRect(w * 0.62 - mw2 / 2, wy0, mw2, wy1 - wy0);
  g.fillRect(wx0 - mw2, wy0, mw2, wy1 - wy0);
  g.fillRect(wx1, wy0, mw2, wy1 - wy0);
  g.fillRect(wx0 - mw2, wy1, (wx1 - wx0) + mw2 * 2, mw2 * 1.5);
  g.fillRect(wx0 - mw2, wy0 - mw2 * 1.2, (wx1 - wx0) + mw2 * 2, mw2 * 1.2);

  /* 8 — floor sheen + extra top light in the lightning pass */
  var fl = g.createLinearGradient(0, h * 0.70, 0, h);
  fl.addColorStop(0, 'rgba(0,0,0,0)');
  fl.addColorStop(1, lit ? 'rgba(95,145,195,0.16)' : 'rgba(70,110,160,0.07)');
  g.fillStyle = fl; g.fillRect(0, h * 0.70, w, h * 0.30);
  if (lit) {
    var lg2 = g.createLinearGradient(0, 0, 0, h * 0.6);
    lg2.addColorStop(0, 'rgba(180,210,245,0.10)');
    lg2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lg2; g.fillRect(0, 0, w, h * 0.6);
  }

  /* export the monitor position for the animated glow sprite */
  room.glowX = w * 0.2025;
  room.glowY = h * 0.615;
}
function buildScenes() { drawRoom(sceneCtx, false); drawRoom(litCtx, true); }

/* Frost = the dark room pushed through the halving chain. No noise, no
   blotches — just clean diffused light, so the pane stays pristine. */
function buildFrost() {
  halfCtx.setTransform(1, 0, 0, 1, 0, 0);
  halfCtx.clearRect(0, 0, cHalf.width, cHalf.height);
  halfCtx.drawImage(scene, 0, 0, cHalf.width, cHalf.height);

  quartCtx.setTransform(1, 0, 0, 1, 0, 0);
  quartCtx.clearRect(0, 0, cQuart.width, cQuart.height);
  quartCtx.drawImage(cHalf, 0, 0, cQuart.width, cQuart.height);

  eighthCtx.setTransform(1, 0, 0, 1, 0, 0);
  eighthCtx.clearRect(0, 0, cEighth.width, cEighth.height);
  eighthCtx.drawImage(cQuart, 0, 0, cEighth.width, cEighth.height);

  frostCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  frostCtx.clearRect(0, 0, RW, RH);
  frostCtx.drawImage(cEighth, 0, 0, RW, RH);      // heavy blur = the frost body
  frostCtx.globalAlpha = 0.22;                     // light second frequency:
  frostCtx.drawImage(cQuart, 0, 0, RW, RH);        // keeps mid-tone structure
  frostCtx.globalAlpha = 1;

  /* a whisper of sheen at the top of the pane */
  var sheen = frostCtx.createLinearGradient(0, 0, 0, RH * 0.45);
  sheen.addColorStop(0, 'rgba(185,215,240,.05)');
  sheen.addColorStop(1, 'rgba(185,215,240,0)');
  frostCtx.fillStyle = sheen; frostCtx.fillRect(0, 0, RW, RH * 0.45);
}

/* --- PRE-BAKED SPRITES (built once, drawn thousands of times) ------------- */

/* Droplet highlight: directional rim light, dark lower bend, primary +
   counter speculars. Baked once → one drawImage per droplet per frame. */
var dropSprite = document.createElement('canvas');
(function buildDropSprite() {
  dropSprite.width = dropSprite.height = 64;
  var c = dropSprite.getContext('2d'), cx = 32, cy = 32, r = 29, g;
  g = c.createRadialGradient(cx, cy - 3, 2, cx, cy, r);          // body tint
  g.addColorStop(0, 'rgba(160,205,230,.10)');
  g.addColorStop(1, 'rgba(120,160,195,.02)');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, 6.2832); c.fill();
  c.strokeStyle = 'rgba(4,12,22,.35)'; c.lineWidth = 2.4;         // dark lower rim
  c.beginPath(); c.arc(cx, cy, r - 1.4, Math.PI * 0.12, Math.PI * 0.88); c.stroke();
  c.strokeStyle = 'rgba(225,244,255,.55)'; c.lineWidth = 1.6;     // catch light
  c.beginPath(); c.arc(cx, cy, r - 1.2, Math.PI * 1.08, Math.PI * 1.72); c.stroke();
  g = c.createRadialGradient(cx - 9, cy - 11, 0, cx - 9, cy - 11, 7.5);   // primary spec
  g.addColorStop(0, 'rgba(255,255,255,.92)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(cx - 9, cy - 11, 7.5, 0, 6.2832); c.fill();
  g = c.createRadialGradient(cx + 10, cy + 12, 0, cx + 10, cy + 12, 5);   // counter spec
  g.addColorStop(0, 'rgba(190,225,250,.28)');
  g.addColorStop(1, 'rgba(190,225,250,0)');
  c.fillStyle = g; c.beginPath(); c.arc(cx + 10, cy + 12, 5, 0, 6.2832); c.fill();
})();

/* Hard glint — appears on droplets only while lightning flashes. */
var glintSprite = document.createElement('canvas');
(function buildGlint() {
  glintSprite.width = glintSprite.height = 32;
  var c = glintSprite.getContext('2d');
  var g = c.createRadialGradient(16, 16, 0, 16, 16, 15);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(235,248,255,.55)');
  g.addColorStop(1, 'rgba(235,248,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(16, 16, 15, 0, 6.2832); c.fill();
})();

/* Soft radial glow — reused by the monitor light and the pointer presence. */
var glowSprite = document.createElement('canvas');
(function buildGlow() {
  glowSprite.width = glowSprite.height = 256;
  var c = glowSprite.getContext('2d');
  var g = c.createRadialGradient(128, 128, 0, 128, 128, 127);
  g.addColorStop(0, 'rgba(150,200,240,.7)');
  g.addColorStop(0.4, 'rgba(130,180,230,.22)');
  g.addColorStop(1, 'rgba(120,170,220,0)');
  c.fillStyle = g; c.beginPath(); c.arc(128, 128, 127, 0, 6.2832); c.fill();
})();

/* Wet-trail sheen — the path a runner leaves behind, catching the light. */
var sheenC = document.createElement('canvas');
(function buildSheen() {
  sheenC.width = 48; sheenC.height = 160;
  var c = sheenC.getContext('2d');
  var h = c.createLinearGradient(0, 0, 48, 0);           // horizontal profile
  h.addColorStop(0, 'rgba(255,255,255,0)');
  h.addColorStop(0.5, 'rgba(230,244,255,.4)');
  h.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = h; c.fillRect(0, 0, 48, 160);
  c.globalCompositeOperation = 'destination-in';          // vertical falloff:
  var v = c.createLinearGradient(0, 0, 0, 160);           // bright at the drop,
  v.addColorStop(0, 'rgba(0,0,0,0)');                     // fading up the trail
  v.addColorStop(0.55, 'rgba(0,0,0,.45)');
  v.addColorStop(1, 'rgba(0,0,0,1)');
  c.fillStyle = v; c.fillRect(0, 0, 48, 160);
})();

/* ====================================================================== */
/* 4. PARALLAX — depth behind the glass                                    */
/* ====================================================================== */
/* The droplets live ON the pane, so they never move. The room behind the
   pane shifts subtly with the pointer (and drifts on its own when idle),
   with the far rain shifting at half rate — a clean front-to-back motion
   gradient (drops 0 → near rain 0.15× → far rain 0.5× → room 1×) that makes
   the whole scene read as a physical diorama. */
var Parallax = {
  tx: 0, ty: 0, x: 0, y: 0, hasPointer: false,
  set: function (cx, cy) {
    this.hasPointer = true;
    this.tx = clamp((cx / W) * 2 - 1, -1, 1);
    this.ty = clamp((cy / H) * 2 - 1, -1, 1);
  },
  update: function (dt, t) {
    /* when nobody is touching the page, a slow autonomous drift keeps it alive */
    var gx = this.hasPointer ? this.tx : Math.sin(t * 0.00019) * 0.35;
    var gy = this.hasPointer ? this.ty : Math.cos(t * 0.00015) * 0.25;
    var k = 1 - Math.exp(-2.6 * dt);
    var m = REDUCED_MOTION ? 0.3 : 1;
    this.x += (-gx * P * m - this.x) * k;
    this.y += (-gy * P * 0.65 * m - this.y) * k;
  }
};

/* ====================================================================== */
/* 5. DROPLET PHYSICS — condensation, runners, trails, merging             */
/* ====================================================================== */
var drops = [];               // every droplet on the pane (static + running)
var grid = new Map();         // spatial hash, rebuilt each frame
var CELL = 26;                // grid cell size (px)
var MAX_DROPS = 140;          // population ceiling, scaled to screen area
var condenseAcc = 0;          // fractional accumulator for condensation

var DROPLET = {
  GRAVITY: 42,      // acceleration grows with mass past the slide threshold
  DRAG: 1.15,       // viscous brake (1/s)
  MAX_R: 5.6,       // radius cap before a runner sheds instead of growing
  RUN_BASE: 2.35,   // base radius needed to break surface tension
  EVAPORATE: 0.016  // static droplets slowly shrink (px/s)
};

function makeDrop(x, y, r, run) {
  return {
    x: x, y: y, r: r, vy: 0,
    run: !!run,
    th: DROPLET.RUN_BASE + Math.random() * 0.85, // personal slide threshold
    grip: rand(0.55, 1.3),                        // per-drop "stiction"
    wander: Math.random() * 6.283,                // lateral meander phase
    trailGap: rand(3.2, 7.5),                     // px of travel per trail drop
    lastTrailY: y,
    dead: false
  };
}

/* Seed the pane so it feels lived-in the instant the page opens. */
function seedDroplets() {
  drops.length = 0;
  var n = Math.round(clamp((W * H) / 4200, 130, 420));
  var i;
  for (i = 0; i < n; i++) {
    drops.push(makeDrop(Math.random() * W, Math.random() * H, rand(0.45, 2.2), false));
  }
  /* a few runners already mid-journey, with speed and mass */
  var runners = Math.round(clamp(W / 320, 3, 8));
  for (i = 0; i < runners; i++) {
    var d = makeDrop(rand(W * 0.1, W * 0.9), rand(H * 0.15, H * 0.7), rand(2.6, 3.6), true);
    d.vy = rand(6, 30);
    drops.push(d);
  }
  MAX_DROPS = n;
}

/* Spatial hash rebuild — O(n), trivially cheap for a few hundred droplets. */
function buildGrid() {
  grid.clear();
  for (var i = 0; i < drops.length; i++) {
    var d = drops[i];
    if (d.dead) continue;
    var k = ((d.x / CELL) | 0) * 100000 + ((d.y / CELL) | 0);
    var cell = grid.get(k);
    if (cell) cell.push(d); else grid.set(k, [d]);
  }
}

/* A runner sweeps up everything it touches. Area is conserved on merge
   (r = √(r₁² + r₂²)) — which is why growth looks physically believable. */
function absorbNeighbors(d) {
  var reach = d.r + 8;
  var x0 = ((d.x - reach) / CELL) | 0, x1 = ((d.x + reach) / CELL) | 0;
  var y0 = ((d.y - reach) / CELL) | 0, y1 = ((d.y + reach) / CELL) | 0;
  for (var gx = x0; gx <= x1; gx++) {
    for (var gy = y0; gy <= y1; gy++) {
      var cell = grid.get(gx * 100000 + gy);
      if (!cell) continue;
      for (var i = 0; i < cell.length; i++) {
        var o = cell[i];
        if (!o || o === d || o.dead) continue;
        var dx = o.x - d.x, dy = o.y - d.y;
        var rr = (d.r + o.r) * 0.72;
        if (dx * dx + dy * dy < rr * rr) {
          d.r = Math.min(DROPLET.MAX_R, Math.sqrt(d.r * d.r + o.r * o.r));
          if (o.run) d.vy = d.vy * 0.6 + o.vy * 0.4;      // momentum blend
          o.dead = true;
        }
      }
    }
  }
}

/* Find an existing droplet near (x, y) that a fresh condensate would join. */
function findHost(x, y, r) {
  var x0 = ((x - 14) / CELL) | 0, x1 = ((x + 14) / CELL) | 0;
  var y0 = ((y - 14) / CELL) | 0, y1 = ((y + 14) / CELL) | 0;
  for (var gx = x0; gx <= x1; gx++) {
    for (var gy = y0; gy <= y1; gy++) {
      var cell = grid.get(gx * 100000 + gy);
      if (!cell) continue;
      for (var i = 0; i < cell.length; i++) {
        var o = cell[i];
        if (!o || o.dead) continue;
        var dx = o.x - x, dy = o.y - y, rr = (o.r + r) * 0.95;
        if (dx * dx + dy * dy < rr * rr) return o;
      }
    }
  }
  return null;
}

/* One condensation event. Moisture favours bigger droplets (tournament
   selection — bigger catch area), which drives statics across their tension
   threshold and down the pane. Wind slightly raises the rate. */
function condenseOne() {
  var best = null;
  for (var t = 0; t < 3; t++) {
    var cand = drops[(Math.random() * drops.length) | 0];
    if (cand && !cand.dead && !cand.run && cand.r < DROPLET.MAX_R && (!best || cand.r > best.r)) best = cand;
  }
  if (best && Math.random() < 0.72) {
    best.r += rand(0.05, 0.1);
    if (best.r >= best.th) { best.run = true; best.vy = 1.5; best.lastTrailY = best.y; }
  } else if (drops.length < MAX_DROPS) {
    var x = Math.random() * W, y = Math.random() * H, r = rand(0.4, 1.5);
    var host = findHost(x, y, r);
    if (host) {
      host.r = Math.min(DROPLET.MAX_R, Math.sqrt(host.r * host.r + r * r));
      if (!host.run && host.r >= host.th) { host.run = true; host.vy = 1.5; host.lastTrailY = host.y; }
    } else {
      drops.push(makeDrop(x, y, r, false));
    }
  }
}

function updateDroplets(dt) {
  buildGrid();

  condenseAcc += dt * (16 + wind01 * 10) * quality;
  while (condenseAcc >= 1 && drops.length) { condenseAcc -= 1; condenseOne(); }

  var evap = DROPLET.EVAPORATE * dt;

  for (var i = 0; i < drops.length; i++) {
    var d = drops[i];
    if (d.dead) continue;

    if (d.run) {
      /* --- runner: gravity grows with mass, drag brakes it --- */
      d.vy += Math.max(0, d.r - 2.0) * DROPLET.GRAVITY * d.grip * dt;
      d.vy -= d.vy * DROPLET.DRAG * dt;
      var vmax = 46 + d.r * 26;                     // terminal velocity
      if (d.vy > vmax) d.vy = vmax;
      d.y += d.vy * dt;
      d.wander += dt * 2.2;                         // rivulets never run straight
      d.x += Math.sin(d.wander) * 7 * dt + wind01 * 5 * dt;   // wind leans them

      /* shed mass into a trail bead every few px — the visible rivulet */
      while (d.y - d.lastTrailY >= d.trailGap) {
        d.lastTrailY += d.trailGap;
        if (drops.length < MAX_DROPS * (0.7 + 0.65 * quality)) {
          var tr = rand(0.45, 1.15);
          drops.push(makeDrop(clamp(d.x + rand(-1.1, 1.1), 1, W - 1), d.lastTrailY, tr, false));
          d.r = Math.max(1.7, Math.sqrt(Math.max(0.01, d.r * d.r - tr * tr)));
        }
        d.trailGap = rand(3.2, 7.5);
      }

      absorbNeighbors(d);                           // sweep & merge on the way
      if (d.r < 2.05) { d.run = false; d.vy = 0; }  // shed too much → settle
      if (d.y - d.r > H + 8) d.dead = true;         // slid off the pane
    } else if ((d.r -= evap) < 0.28) {
      d.dead = true;                                // fully evaporated
    }
  }

  /* compact the array (swap-pop keeps it O(n)) */
  for (var j = drops.length - 1; j >= 0; j--) {
    if (drops[j].dead) { drops[j] = drops[drops.length - 1]; drops.pop(); }
  }
}

/* Droplet rendering — the heart of the illusion.
   Tiny drops (condensate + trail beads) get the cheap glint sprite.
   Real drops get: clip → inverted magnified sample of the room (a true
   lens, with parallax and the lit-scene swap during flashes) → baked
   directional highlight → optional lightning glint. Runners stretch
   with speed. */
function renderDroplets(flash) {
  var src = flash > 0.35 ? litScene : scene;
  var tinyAlpha = 0.35 + flash * 0.25;
  var bigAlpha = 0.8 + flash * 0.5;
  var px = Parallax.x, py = Parallax.y;
  var i, d, s;

  for (i = 0; i < drops.length; i++) {
    d = drops[i];
    if (d.dead) continue;
    var stretch = d.run ? 1 + Math.min(d.vy * 0.0016, 0.42) : 1;

    if (d.r < 1.35) {
      s = d.r * 2.6;
      ctx.globalAlpha = tinyAlpha;
      ctx.drawImage(dropSprite, d.x - s * 0.5, d.y - s * 0.5, s, s);
    } else {
      var rr = d.r * 1.06;                          // surface-tension bulge
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.scale(1, stretch);
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, 6.2832);
      ctx.clip();
      var mag = 1 + d.r * 0.05;                      // lens magnification
      ctx.scale(mag, -mag);                          // vertical flip = refraction
      ctx.drawImage(src, px - d.x - P, py - d.y - P, RW, RH);
      ctx.restore();

      s = rr * 2.35;                                 // crisp optical highlight
      ctx.globalAlpha = Math.min(1, bigAlpha);
      ctx.drawImage(dropSprite, d.x - s / 2, d.y - (s * stretch) / 2, s, s * stretch);

      /* lightning glint — only a deterministic subset, so it sparkles */
      if (flash > 0.12 && d.r > 2 && ((i * 7919) % 97) < 34) {
        ctx.globalAlpha = Math.min(1, flash) * 0.85;
        var gs = d.r * 1.5;
        ctx.drawImage(glintSprite, d.x - gs / 2, d.y - gs / 2, gs, gs);
      }
    }
  }
  ctx.globalAlpha = 1;
}

/* Wet-trail sheens — the polished path each runner has travelled. */
function renderSheens(flash) {
  ctx.globalCompositeOperation = 'screen';
  for (var i = 0; i < drops.length; i++) {
    var d = drops[i];
    if (d.dead || !d.run || d.vy < 9) continue;
    var hgt = Math.min(96, 14 + d.r * 15);
    var w = Math.max(2, d.r * 1.05);
    ctx.globalAlpha = 0.05 + flash * 0.06;
    ctx.drawImage(sheenC, d.x - w / 2, d.y - hgt, w, hgt);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ====================================================================== */
/* 6. RAIN STREAKS + WIND — two parallax depths, wind-coupled             */
/* ====================================================================== */
var farStreaks = [], nearStreaks = [];
var WIND = 0.16;               // current streak slope (dx/dy) — wind-driven
var wind01 = 0.5;              // smoothed wind, 0..1
var windT = 0;                 // wind clock

function resetFar(s, anywhere) {
  s.x = rand(-FARM, W + FARM);
  s.y = anywhere ? rand(-40, H) : -rand(20, H * 0.4);
  s.sp = rand(480, 880);
  s.len = rand(12, 30);
  s.a = rand(0.035, 0.09);
  return s;
}
function resetNear(s, anywhere) {
  s.x = rand(-12, W + 12);
  s.y = anywhere ? rand(-30, H) : -rand(10, H * 0.35);
  s.sp = rand(950, 1550);
  s.len = rand(26, 54);
  s.a = rand(0.09, 0.19);
  return s;
}
function initStreaks() {
  var area = W * H;
  var nf = Math.round(clamp(area / 26000, 34, 96) * quality);
  var nn = Math.round(clamp(area / 36000, 18, 56) * quality);
  farStreaks = []; for (var i = 0; i < nf; i++) farStreaks.push(resetFar({}, true));
  nearStreaks = []; for (var j = 0; j < nn; j++) nearStreaks.push(resetNear({}, true));
}

function updateStreaks(dt) {
  var i, s;
  for (i = 0; i < farStreaks.length; i++) {
    s = farStreaks[i];
    s.y += s.sp * (0.85 + wind01 * 0.3) * dt;
    s.x -= s.sp * WIND * dt;
    if (s.y > H + FARMV || s.x < -FARM * 3) resetFar(s, false);
  }
  for (i = 0; i < nearStreaks.length; i++) {
    s = nearStreaks[i];
    s.y += s.sp * dt;
    s.x -= s.sp * WIND * dt;
    if (s.y > H + 30 || s.x < -60) resetNear(s, false);
  }
}

function renderStreaks(flash) {
  var i, s;
  /* FAR layer is rendered on a quarter-res canvas and upscaled — the
     bilinear upscale is a free optical blur, so distant rain reads soft. */
  farCtx.setTransform(DPR / 4, 0, 0, DPR / 4, 0, 0);
  farCtx.clearRect(0, 0, FAR_W, FAR_H);
  farCtx.lineWidth = 1.5; farCtx.lineCap = 'round';
  farCtx.strokeStyle = 'rgb(160,192,226)';
  for (i = 0; i < farStreaks.length; i++) {
    s = farStreaks[i];
    farCtx.globalAlpha = Math.min(0.35, s.a + flash * 0.05);
    farCtx.beginPath();
    farCtx.moveTo(s.x, s.y);
    farCtx.lineTo(s.x + s.len * WIND, s.y - s.len);
    farCtx.stroke();
  }
  farCtx.globalAlpha = 1;
  ctx.drawImage(farC, Parallax.x * 0.5 - FARM, Parallax.y * 0.5 - FARMV, FAR_W, FAR_H);

  /* NEAR layer: crisper streaks, drifting at ~15% of room parallax */
  ctx.save();
  ctx.translate(Parallax.x * 0.15, Parallax.y * 0.15);
  ctx.lineWidth = 1.1; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgb(198,222,248)';
  for (i = 0; i < nearStreaks.length; i++) {
    s = nearStreaks[i];
    ctx.globalAlpha = Math.min(0.4, s.a + flash * 0.06);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.len * WIND, s.y - s.len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ====================================================================== */
/* 7. LIGHTNING CONTROLLER — flash envelope + fractal bolts + thunder sync */
/* ====================================================================== */
var lightningEl = document.getElementById('lightning');
var Lightning = {
  level: 0, pulses: [], activeUntil: 0, nextAt: 0, lastWritten: -1, hasBolt: false,

  prime: function (now) { this.nextAt = now + rand(3500, 7000); },

  trigger: function (now) {
    /* 2–4 rapid flickers with descending peaks — the double-strike look */
    this.pulses = [];
    var t = now, peak = rand(0.55, 1);
    var n = 2 + ((Math.random() * 3) | 0);
    for (var i = 0; i < n; i++) {
      this.pulses.push({ at: t, v: peak * rand(0.7, 1) });
      t += rand(60, 190);
      peak *= rand(0.55, 0.85);
    }
    this.activeUntil = t + 280;
    this.nextAt = now + rand(9000, 22000);
    this.hasBolt = Math.random() < 0.4 && !REDUCED_MOTION;
    if (this.hasBolt) renderBolt();
    /* thunder lands WITH the flash — near strikes crack, distant ones roll */
    AudioFX.thunder(this.hasBolt ? rand(0.75, 1) : rand(0.35, 0.7), this.hasBolt);
  },

  update: function (now, dt) {
    if (now >= this.nextAt) this.trigger(now);
    if (now > this.activeUntil) this.pulses.length = 0;

    var target = 0;
    for (var i = 0; i < this.pulses.length; i++) {
      var p = this.pulses[i];
      if (now >= p.at && now < p.at + 140) target = Math.max(target, p.v);
    }
    var rate = target > this.level ? 26 : 9;        // fast attack, slow release
    this.level += (target - this.level) * (1 - Math.exp(-rate * dt));
    if (this.level < 0.004 && target === 0) this.level = 0;

    /* write to the DOM only when meaningfully changed */
    var shown = this.level * (REDUCED_MOTION ? 0.45 : 0.9);
    if (Math.abs(shown - this.lastWritten) > 0.003 || (shown === 0 && this.lastWritten !== 0)) {
      lightningEl.style.opacity = shown.toFixed(3);
      this.lastWritten = shown;
    }
    return this.level;
  }
};

/* Fractal bolt: midpoint-displaced main channel + thrown branches, drawn
   in three width passes onto the half-res bolt canvas (its upscale doubles
   as the through-the-frost blur). Rendered once per strike. */
function renderBolt() {
  var bw = W, bh = H * 0.72;
  bctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  bctx.clearRect(0, 0, bw, bh);
  bctx.lineCap = 'round'; bctx.lineJoin = 'round';

  /* main channel via recursive midpoint displacement */
  var pts = [
    { x: rand(bw * 0.18, bw * 0.82), y: -bh * 0.03 },
    { x: rand(bw * 0.18, bw * 0.82), y: rand(bh * 0.5, bh * 0.85) }
  ];
  var disp = bh * 0.10, it, i;
  for (it = 0; it < 6; it++) {
    var ns = [pts[0]];
    for (i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i];
      ns.push({
        x: (a.x + b.x) / 2 + rand(-1, 1) * disp,
        y: (a.y + b.y) / 2 + rand(-0.25, 0.25) * disp * 0.3
      }, b);
    }
    pts = ns; disp *= 0.52;
  }

  /* branches, thrown off the upper portion of the channel */
  var branches = [];
  var nBr = 2 + ((Math.random() * 3) | 0);
  for (var k = 0; k < nBr; k++) {
    var p = pts[4 + ((Math.random() * (pts.length - 8)) | 0)];
    var ang = Math.PI / 2 + rand(-1.1, 1.1);
    var len = rand(bh * 0.12, bh * 0.3);
    var bp = [{ x: p.x, y: p.y }, { x: p.x + Math.cos(ang) * len, y: p.y + Math.sin(ang) * len }];
    var bd = disp * 1.4;
    for (it = 0; it < 4; it++) {
      var bs = [bp[0]];
      for (i = 1; i < bp.length; i++) {
        var a2 = bp[i - 1], b2 = bp[i];
        bs.push({ x: (a2.x + b2.x) / 2 + rand(-1, 1) * bd, y: (a2.y + b2.y) / 2 }, b2);
      }
      bp = bs; bd *= 0.55;
    }
    branches.push(bp);
  }

  /* three width passes = cheap volumetric glow */
  var passes = [{ w: 7, a: 0.06 }, { w: 3, a: 0.16 }, { w: 1.3, a: 0.85 }];
  for (var pi = 0; pi < passes.length; pi++) {
    var pass = passes[pi];
    bctx.strokeStyle = 'rgba(215,236,255,' + pass.a + ')';
    bctx.lineWidth = pass.w;
    bctx.beginPath();
    bctx.moveTo(pts[0].x, pts[0].y);
    for (i = 1; i < pts.length; i++) bctx.lineTo(pts[i].x, pts[i].y);
    bctx.stroke();
    bctx.lineWidth = pass.w * 0.4;
    for (var bi = 0; bi < branches.length; bi++) {
      var br = branches[bi];
      bctx.beginPath();
      bctx.moveTo(br[0].x, br[0].y);
      for (i = 1; i < br.length; i++) bctx.lineTo(br[i].x, br[i].y);
      bctx.stroke();
    }
  }
}

/* ====================================================================== */
/* 8. AUDIO SYNTHESIS ENGINE (pure Web Audio — zero external files)        */
/* ====================================================================== */
/* Signal graph:
     pink noise ─ lowpass(LFO) ─ rain body ─┐
     pink noise ─ highpass ─ droplet hiss ─┤
     pink noise ─ bandpass ─ wind bed ──────┤        ┌ convolver (generated
     triangle pads ─ lowpass ─ chord env ───┼ master └ reverb) → master
     FM glass notes / plucks / drips ───────┤   → compressor → destination
     brown noise + sub osc = thunder ───────┘
   The wind bed's gain and filter follow the SAME wind value that leans the
   visual rain — the storm you hear and the storm you see are one system. */
var AudioFX = (function () {
  var ac = null, master = null, convolver = null;
  var bodyGain = null, windFilter = null, windGain = null;
  var muted = false, started = false, running = false;
  var nextChordAt = 0, chordIdx = 0, nextMotifAt = 0;
  var pinkBuf = null, brownBuf = null;

  /* Slow, wistful progression: Am(add9) → Fmaj7 → Cmaj7 → Em(add9) */
  var CHORDS = [
    [110.00, 164.81, 246.94, 261.63],
    [87.31, 130.81, 164.81, 220.00],
    [130.81, 196.00, 246.94, 329.63],
    [82.41, 123.47, 185.00, 196.00]
  ];
  var PENTA = [440, 523.25, 587.33, 659.25, 783.99, 880];  // A-minor colour
  var CHORD_DUR = 13, CHORD_STEP = 8;                      // 4s crossfades

  /* --- noise buffers --------------------------------------------------- */
  function makeNoise(kind, seconds) {
    var n = Math.floor(ac.sampleRate * seconds);
    var buf = ac.createBuffer(2, n, ac.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var out = buf.getChannelData(ch);
      if (kind === 'pink') {
        /* Paul Kellet pink noise — the body of the rain */
        var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (var i = 0; i < n; i++) {
          var w = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
          b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
          b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
          out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
          b6 = w * 0.115926;
        }
      } else {
        /* brown noise — integrated white, normalised (thunder fuel) */
        var last = 0, mx = 0;
        for (var j = 0; j < n; j++) {
          last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
          out[j] = last * 3.5;
          if (Math.abs(out[j]) > mx) mx = Math.abs(out[j]);
        }
        if (mx > 0) { var g = 0.9 / mx; for (var k = 0; k < n; k++) out[k] *= g; }
      }
    }
    return buf;
  }

  /* Decaying-noise impulse → a real ConvolverNode reverb, generated on the fly */
  function impulse(seconds, pow) {
    var n = Math.floor(ac.sampleRate * seconds);
    var buf = ac.createBuffer(2, n, ac.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, pow);
    }
    return buf;
  }

  /* route a voice: dry to master (+ optional stereo placement + wet send) */
  function routeOut(node, wetAmt, pan) {
    var out = node;
    if (ac.createStereoPanner) {
      var p = ac.createStereoPanner();
      p.pan.value = (pan === undefined) ? rand(-0.6, 0.6) : pan;
      node.connect(p); out = p;
    }
    out.connect(master);
    var send = ac.createGain(); send.gain.value = wetAmt;
    out.connect(send); send.connect(convolver);
  }

  /* --- continuous beds --------------------------------------------------- */
  function startRain() {
    pinkBuf = makeNoise('pink', 3);

    /* Layer 1: pink noise through an LFO-breathing lowpass — rain body */
    var body = ac.createBufferSource(); body.buffer = pinkBuf; body.loop = true;
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 1100; lp.Q.value = 0.3;
    bodyGain = ac.createGain(); bodyGain.gain.value = 0.13;
    body.connect(lp); lp.connect(bodyGain); bodyGain.connect(master);
    var send = ac.createGain(); send.gain.value = 0.3;
    bodyGain.connect(send); send.connect(convolver);
    var lfo = ac.createOscillator(); lfo.frequency.value = 0.05;   // storm breathes
    var lfoAmt = ac.createGain(); lfoAmt.gain.value = 260;
    lfo.connect(lfoAmt); lfoAmt.connect(lp.frequency);
    body.start(); lfo.start();

    /* Layer 2: quiet high hiss — texture of individual droplets */
    var hiss = ac.createBufferSource(); hiss.buffer = pinkBuf; hiss.loop = true;
    var hp = ac.createBiquadFilter(); hp.type = 'highpass';
    hp.frequency.value = 4300; hp.Q.value = 0.4;
    var hg = ac.createGain(); hg.gain.value = 0.02;
    hiss.connect(hp); hp.connect(hg); hg.connect(master);
    hiss.start();

    /* Layer 3: the WIND — bandpassed noise whose gain and frequency are
       driven from the main loop by setWind(), in lockstep with the visual
       rain lean. This is the audio↔visual glue of the whole storm. */
    var wind = ac.createBufferSource(); wind.buffer = pinkBuf; wind.loop = true;
    windFilter = ac.createBiquadFilter(); windFilter.type = 'bandpass';
    windFilter.frequency.value = 320; windFilter.Q.value = 0.9;
    windGain = ac.createGain(); windGain.gain.value = 0;
    wind.connect(windFilter); windFilter.connect(windGain); windGain.connect(master);
    var wSend = ac.createGain(); wSend.gain.value = 0.4;
    windGain.connect(wSend); wSend.connect(convolver);
    wind.start();
  }

  /* --- one ambient pad chord: detuned triangles → LP → long envelope ----- */
  function playChord(freqs, t, dur) {
    var env = ac.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(1, t + 4);              // slow swell
    env.gain.setValueAtTime(1, t + dur - 4.4);
    env.gain.linearRampToValueAtTime(0.0001, t + dur);        // long release
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 780; lp.Q.value = 0.35;
    env.connect(lp);
    var send = ac.createGain(); send.gain.value = 0.55;
    lp.connect(send); send.connect(convolver);
    lp.connect(master);
    for (var i = 0; i < freqs.length; i++) {
      var dets = [-4.5, 4];
      for (var j = 0; j < dets.length; j++) {
        var o = ac.createOscillator();
        o.type = 'triangle'; o.frequency.value = freqs[i];
        o.detune.value = dets[j] + rand(-1.5, 1.5);
        var og = ac.createGain(); og.gain.value = 0.045;
        o.connect(og); og.connect(env);
        o.start(t); o.stop(t + dur + 0.1);
      }
    }
  }

  /* --- FM "glass" note: the melody of memory, sparse and distant --------- */
  function glassNote(f, t, vel) {
    var car = ac.createOscillator(); car.type = 'sine'; car.frequency.value = f;
    var mod = ac.createOscillator(); mod.type = 'sine'; mod.frequency.value = f * 2.004;
    var mg = ac.createGain();
    mg.gain.setValueAtTime(f * 1.6, t);                       // bright attack…
    mg.gain.exponentialRampToValueAtTime(f * 0.05, t + 0.5); // …mellowing out
    mod.connect(mg); mg.connect(car.frequency);
    var env = ac.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vel, t + 0.015);
    env.gain.exponentialRampToValueAtTime(0.0004, t + 3.2);
    car.connect(env);
    routeOut(env, 0.85);
    car.start(t); mod.start(t);
    car.stop(t + 3.3); mod.stop(t + 3.3);
  }

  /* A 3–6 note motif from the A-minor pentatonic, drifting through the
     reverb every ~30 seconds — never the same phrase twice. */
  function motif() {
    var t = ac.currentTime + 0.05;
    var n = 3 + ((Math.random() * 3) | 0);
    var idx = 1 + ((Math.random() * 2) | 0);
    for (var i = 0; i < n; i++) {
      glassNote(PENTA[idx], t + i * 0.01, 0.05);   // real times accumulated below
      t += rand(0.9, 1.8);
      idx += Math.random() < 0.5 ? -1 : 1;
      idx = clamp(idx, 0, PENTA.length - 1);
    }
  }

  /* --- music-box pluck: quick falling-pitch sine ------------------------- */
  function pluck() {
    var t = ac.currentTime + 0.02;
    var f = PENTA[(Math.random() * PENTA.length) | 0] * (Math.random() < 0.25 ? 0.5 : 1);
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f * 1.017, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.11);
    var g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0004, t + 2.9);
    o.connect(g); routeOut(g, 0.85);
    o.start(t); o.stop(t + 3.1);
  }

  /* --- single water drip ------------------------------------------------- */
  function drip() {
    var t = ac.currentTime + 0.02;
    var f = rand(750, 2100);
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f * 1.45, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    var g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(rand(0.008, 0.02), t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0003, t + rand(0.1, 0.22));
    o.connect(g); routeOut(g, 0.5);
    o.start(t); o.stop(t + 0.35);
  }

  /* --- THUNDER: crack (near strikes) + rolling rumble + sub floor --------
     The envelope is a setValueCurveAtTime shape with internal undulation,
     so the thunder genuinely rolls. Called in lockstep with the flash. */
  function thunder(intensity, near) {
    if (!ac || !running) return;
    if (!brownBuf) brownBuf = makeNoise('brown', 4);
    var t = ac.currentTime + 0.02;
    var dur = rand(2.6, 4.4);

    /* 1) rumble: brown noise swept down through a lowpass */
    var src = ac.createBufferSource(); src.buffer = brownBuf; src.loop = true;
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(260 + 260 * intensity, t);
    lp.frequency.exponentialRampToValueAtTime(46, t + dur * 0.8);
    var g = ac.createGain();
    var N = 256, curve = new Float32Array(N), ph = Math.random() * 6.283;
    for (var i = 0; i < N; i++) {
      var p = i / (N - 1);
      var v = Math.pow(1 - p, 1.55) *
              (0.62 + 0.38 * Math.sin(p * 23 + ph) * Math.sin(p * 7.1 + ph * 2));
      v = Math.max(0, v) * (p < 0.035 ? p / 0.035 : 1);      // ~100ms attack
      curve[i] = v * 0.65 * intensity;
    }
    g.gain.setValueCurveAtTime(curve, t, dur);
    src.connect(lp); lp.connect(g);
    routeOut(g, 0.15, rand(-0.3, 0.3));
    src.start(t, rand(0, 2)); src.stop(t + dur + 0.1);

    /* 2) sub-bass floor under the rumble */
    var sub = ac.createOscillator(); sub.type = 'sine';
    sub.frequency.setValueAtTime(rand(46, 60), t);
    sub.frequency.exponentialRampToValueAtTime(28, t + dur * 0.7);
    var sg = ac.createGain();
    sg.gain.setValueAtTime(0, t);
    sg.gain.linearRampToValueAtTime(0.22 * intensity, t + 0.1);
    sg.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    sub.connect(sg); sg.connect(master);
    sub.start(t); sub.stop(t + dur + 0.1);

    /* 3) the crack — only for near (bolt) strikes */
    if (near) {
      var cs = ac.createBufferSource(); cs.buffer = pinkBuf;
      var hp2 = ac.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 700;
      var cg = ac.createGain();
      cg.gain.setValueAtTime(0, t);
      cg.gain.linearRampToValueAtTime(0.5 * intensity, t + 0.012);
      cg.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      cs.connect(hp2); hp2.connect(cg);
      routeOut(cg, 0.5, rand(-0.4, 0.4));
      cs.start(t, rand(0, 2)); cs.stop(t + 0.35);
    }
  }

  /* --- soft two-note confirmation chime when a message is sent ----------- */
  function sendChime() {
    if (!ac || !running) return;
    var t = ac.currentTime + 0.02, notes = [659.25, 880];
    for (var i = 0; i < notes.length; i++) {
      var t0 = t + i * 0.09;
      var o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = notes[i];
      var g = ac.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.04, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0004, t0 + 0.9);
      o.connect(g); routeOut(g, 0.7);
      o.start(t0); o.stop(t0 + 1.1);
    }
  }

  /* --- lookahead scheduler: keeps chords, motifs & chance events flowing - */
  function tick() {
    if (!ac || ac.state !== 'running') return;
    if (nextChordAt < ac.currentTime) nextChordAt = ac.currentTime + 0.15; // self-heal
    while (nextChordAt < ac.currentTime + 6) {
      playChord(CHORDS[chordIdx % CHORDS.length], nextChordAt, CHORD_DUR);
      chordIdx++;
      nextChordAt += CHORD_STEP;
    }
    if (ac.currentTime > nextMotifAt) {
      motif();
      nextMotifAt = ac.currentTime + rand(24, 44);
    }
    if (Math.random() < 0.11) pluck();
    if (Math.random() < 0.5) drip();
  }

  /* Fires exactly once, the moment the context reaches 'running' */
  function onRunning() {
    if (started) return;
    started = true; running = true;
    nextChordAt = ac.currentTime + 0.25;
    nextMotifAt = ac.currentTime + 14;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(0, ac.currentTime);
    master.gain.linearRampToValueAtTime(muted ? 0 : 0.85, ac.currentTime + 2.2);
  }

  /* Unrestricted-autoplay architecture: create the context immediately on
     load, try to resume at once, and silently intercept the user's very
     first gesture (pointer / touch / click / key / wheel) as a fallback. */
  function attachUnlock() {
    var events = ['pointerdown', 'touchstart', 'touchend', 'mousedown',
                  'click', 'keydown', 'wheel'];
    var resume = function () {
      if (!ac) return;
      if (ac.state === 'running') { onRunning(); return; }
      var p = ac.resume();
      if (p && p.then) p.then(function () { if (ac.state === 'running') onRunning(); })
                        .catch(function () {});
    };
    for (var i = 0; i < events.length; i++) {
      window.addEventListener(events[i], resume, { passive: true });
    }
    ac.onstatechange = function () { if (ac && ac.state === 'running') onRunning(); };
  }

  function init() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); } catch (e) { return false; }

    /* master → compressor → destination: glues rain, pads and thunder */
    master = ac.createGain(); master.gain.value = 0;
    var comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 22; comp.ratio.value = 6;
    comp.attack.value = 0.004; comp.release.value = 0.28;
    master.connect(comp); comp.connect(ac.destination);

    convolver = ac.createConvolver();
    convolver.buffer = impulse(3.2, 3.1);
    var wet = ac.createGain(); wet.gain.value = 0.55;
    convolver.connect(wet); wet.connect(master);

    startRain();
    nextChordAt = ac.currentTime + 0.2;
    setInterval(tick, 700);
    attachUnlock();

    /* immediate resume attempt — succeeds wherever autoplay is permitted */
    var p = ac.resume();
    if (p && p.then) p.then(function () { if (ac.state === 'running') onRunning(); })
                      .catch(function () {});
    if (ac.state === 'running') onRunning();
    return true;
  }

  /* called from the main loop ~4×/s — audio follows the visual wind */
  function setWind(w01) {
    if (!ac || !running) return;
    var t = ac.currentTime;
    windGain.gain.setTargetAtTime(0.006 + w01 * 0.055, t, 0.7);
    windFilter.frequency.setTargetAtTime(240 + w01 * 380, t, 0.7);
    bodyGain.gain.setTargetAtTime(0.115 + w01 * 0.05, t, 0.9);
  }

  function toggleMute() {
    muted = !muted;
    if (ac && master && running) {
      var t = ac.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(muted ? 0 : 0.85, t, 0.12);
    }
    return muted;
  }

  return {
    init: init, thunder: thunder, sendChime: sendChime,
    setWind: setWind, toggleMute: toggleMute,
    isRunning: function () { return running; }
  };
})();

/* ====================================================================== */
/* 9. MAIN LOOP — wind, parallax, physics, render, adaptive quality        */
/* ====================================================================== */
var rafId = 0, lastT = performance.now();
var fpsEMA = 60, lastQCheck = performance.now();
var lastWindPush = 0, lastLiveCheck = 0, wasAudioLive = false;
var readyAt = 0;                               // set when fonts are ready
var lastFlashVar = -1;

/* Feed the flash level into CSS as --flash so the engraved wordmark
   catches the lightning (see .logo-flash). Throttled to real changes. */
function setFlashVar(v) {
  if (Math.abs(v - lastFlashVar) > 0.02 || (v === 0 && lastFlashVar !== 0)) {
    lastFlashVar = v;
    document.documentElement.style.setProperty('--flash', v.toFixed(3));
  }
}

/* The monitor is still faintly warm — a slow breathing glow, flaring with
 * each lightning strike. Drawn over the frost, under the rain. */
function drawMonitorGlow(now, flash) {
  var gx = room.glowX - P + Parallax.x;
  var gy = room.glowY - P + Parallax.y;
  var breathe = 0.5 + 0.5 * Math.sin(now * 0.00042);
  var s = Math.min(W, H) * 0.36;
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = Math.min(0.35, 0.055 + 0.05 * breathe + flash * 0.10);
  ctx.drawImage(glowSprite, gx - s / 2, gy - s / 2, s, s);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* Opening fog: the pane starts slightly misted and clears over ~4 seconds —
 * a cinematic reveal that ends with the glass crystal clear. */
function drawIntroFog(now) {
  if (!readyAt) return;
  var t = (now - readyAt) / 4200;
  if (t >= 1) return;
  var a = (1 - t) * (1 - t) * 0.16;
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(200,222,240,' + (a * 0.45).toFixed(4) + ')');
  g.addColorStop(1, 'rgba(200,222,240,' + (a * 1.15).toFixed(4) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function frame(now) {
  rafId = requestAnimationFrame(frame);
  var dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;                    // clamp stalls / tab switches
  if (dt <= 0) dt = 0.0001;

  /* adaptive quality: sample an EMA of the frame rate and rebalance */
  fpsEMA += (1 / dt - fpsEMA) * 0.05;
  if (now - lastQCheck > 2500) {
    lastQCheck = now;
    if (fpsEMA < 47 && quality > 0.45) { quality = Math.max(0.45, quality - 0.15); initStreaks(); }
    else if (fpsEMA > 57 && quality < 1) { quality = Math.min(1, quality + 0.08); initStreaks(); }
  }

  /* the wind: a slow compound of sines. It leans the streaks, biases the
     runners, raises condensation — and drives the audio wind bed. */
  windT += dt;
  wind01 = 0.5 + 0.5 * (Math.sin(windT * 0.10) * 0.55 + Math.sin(windT * 0.037 + 1.7) * 0.45);
  WIND = 0.10 + wind01 * 0.16;

  Parallax.update(dt, now);
  var flash = Lightning.update(now, dt);
  setFlashVar(flash);

  if (now - lastWindPush > 280) { lastWindPush = now; AudioFX.setWind(wind01); }

  /* one-shot ripple on the sound button the moment audio goes live */
  if (now - lastLiveCheck > 1200) {
    lastLiveCheck = now;
    if (AudioFX.isRunning() && !wasAudioLive) {
      wasAudioLive = true;
      soundBtn.classList.remove('attn');
      soundBtn.classList.add('live');
      setTimeout(function () { soundBtn.classList.remove('live'); }, 1000);
    }
  }

  /* ---- render pipeline (the frost covers the frame — no clearRect) ---- */
  ctx.drawImage(frost, -P + Parallax.x, -P + Parallax.y, RW, RH);
  drawMonitorGlow(now, flash);
  if (flash > 0.004) {                          // in-room light wash,
    ctx.globalAlpha = Math.min(0.32, flash * 0.22); // painted UNDER the drops
    ctx.fillStyle = flashGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (Lightning.hasBolt && flash > 0.02) {      // the bolt, glowing through
    var fl = 0.7 + 0.3 * Math.sin(now * 0.061);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(1, flash * 1.5) * fl * 0.9;
    ctx.drawImage(boltC, 0, 0, W, H * 0.72);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  updateStreaks(dt);
  renderStreaks(flash);
  renderSheens(flash);
  updateDroplets(dt);
  renderDroplets(flash);
  drawPointerHalo(dt);
  drawIntroFog(now);
}

/* Pause everything when the tab is hidden — no phantom frame debt. */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { lastT = performance.now(); rafId = requestAnimationFrame(frame); }
});

/* Debounced resize: rebuild surfaces, rescale the living droplet field. */
var resizeTimer = 0;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    var ow = W, oh = H;
    sizeAll();
    var kx = W / ow, ky = H / oh;
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      d.x = clamp(d.x * kx, -4, W + 4);
      d.y = clamp(d.y * ky, -4, H + 4);
      d.lastTrailY *= ky;
    }
    updateCompact();
  }, 200);
});

/* ====================================================================== */
/* 10. POINTER CONDENSATION & PRESENCE HALO                                */
/* ====================================================================== */
/* Your hand mists the cold glass: moving across the pane lays down live
   droplets (fast smears occasionally spawn runners that trickle away), and
   a faint halo of presence follows the pointer. This is what makes the
   page feel alive, continuously responding. */
var lastPX = -1e9, lastPY = 0, accDist = 0;
var haloX = 0, haloY = 0, haloTX = 0, haloTY = 0, hasPointer = false;
var hintDismissed = false;

function spawnPointerDrops(x, y, n, smear) {
  if (drops.length > MAX_DROPS * 1.6) return;
  for (var i = 0; i < n; i++) {
    var d = makeDrop(clamp(x + rand(-7, 7), 2, W - 2),
                     clamp(y + rand(-7, 7), 2, H - 2), rand(0.5, 1.4), false);
    if (smear && Math.random() < 0.22) {        // a hard wipe leaves a streak
      d.r = rand(2.5, 3.2);
      d.run = true; d.vy = rand(4, 18); d.lastTrailY = d.y;
    }
    drops.push(d);
  }
}

window.addEventListener('pointermove', function (e) {
  Parallax.set(e.clientX, e.clientY);
  haloTX = e.clientX; haloTY = e.clientY; hasPointer = true;

  var overUI = e.target && e.target.closest &&
               e.target.closest('.feedback, .fab, .sound-btn, .toast');
  if (overUI) { lastPX = -1e9; return; }

  if (lastPX > -1e8) accDist += Math.hypot(e.clientX - lastPX, e.clientY - lastPY);
  lastPX = e.clientX; lastPY = e.clientY;
  var spawned = 0;
  while (accDist > 16 && spawned < 3) { accDist -= 16; spawned++; }
  if (spawned) { spawnPointerDrops(lastPX, lastPY, spawned, true); dismissHint(); }
}, { passive: true });

window.addEventListener('pointerdown', function (e) {
  Parallax.set(e.clientX, e.clientY);
  var overUI = e.target && e.target.closest &&
               e.target.closest('.feedback, .fab, .sound-btn, .toast');
  if (overUI) return;
  spawnPointerDrops(e.clientX, e.clientY, 4, true);   // pressing the glass
  dismissHint();
}, { passive: true });

/* A soft light that lags behind the pointer — the viewer's presence. */
function drawPointerHalo(dt) {
  if (!hasPointer) return;
  var k = 1 - Math.exp(-7 * dt);
  haloX += (haloTX - haloX) * k;
  haloY += (haloTY - haloY) * k;
  var s = Math.min(W, H) * 0.22;
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.05;
  ctx.drawImage(glowSprite, haloX - s / 2, haloY - s / 2, s, s);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function dismissHint() {
  if (hintDismissed) return;
  hintDismissed = true;
  hintEl.classList.remove('is-visible');
}

/* ====================================================================== */
/* 11. UI — toast, widget state machine, Telegram dispatch, sound toggle   */
/* ====================================================================== */
var feedbackEl = document.getElementById('feedback');
var fabEl      = document.getElementById('fab');
var msgInput   = document.getElementById('msgInput');
var sendBtn    = document.getElementById('sendBtn');
var minBtn     = document.getElementById('minBtn');
var counterEl  = document.getElementById('charCounter');
var toastEl    = document.getElementById('toast');
var toastMsg   = document.getElementById('toastMsg');
var soundBtn   = document.getElementById('soundBtn');
var hintEl     = document.getElementById('hint');
var fbDone     = document.getElementById('fbDone');

/* --- toast: one element, class-driven, auto-dismiss, timer reset ------- */
var toastTimer = 0;
function showToast(message, type) {
  toastMsg.textContent = message;
  toastEl.classList.remove('success', 'error', 'is-visible');
  void toastEl.offsetWidth;                     // restart the transition
  toastEl.classList.add(type === 'error' ? 'error' : 'success', 'is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('is-visible'); }, 3200);
}

/* --- collapsible state machine:  hidden → open ⇄ minimized ------------ */
var widgetState = 'hidden';

/* On short viewports the open card would collide with the memorial, so the
   stage slides up while the card is open (see CSS body.widget-open.compact). */
function updateCompact() {
  document.body.classList.toggle('compact', H < 720);
}

function openWidget(fromUser) {
  if (widgetState === 'open') return;
  widgetState = 'open';
  updateCompact();
  document.body.classList.add('widget-open');
  feedbackEl.classList.remove('is-closing');
  feedbackEl.classList.add('is-open');           // spring entrance
  fabEl.classList.remove('is-visible');          // hide the trigger
  fabEl.setAttribute('aria-expanded', 'true');
  /* Don't yank focus (and the mobile keyboard) on the automatic entrance —
     only when the user deliberately reopens from the floating trigger. */
  if (fromUser && window.matchMedia && matchMedia('(hover:hover)').matches) {
    msgInput.focus({ preventScroll: true });
  }
}

function minimizeWidget() {
  if (widgetState !== 'open') return;
  widgetState = 'closing';
  document.body.classList.remove('widget-open'); // stage glides back down
  feedbackEl.classList.remove('is-open');
  feedbackEl.classList.add('is-closing');        // fold away
  var done = false;
  var finish = function () {
    if (done) return;
    done = true;
    feedbackEl.classList.remove('is-closing');
    widgetState = 'minimized';
    fabEl.classList.add('is-visible');          // trigger reappears
    fabEl.setAttribute('aria-expanded', 'false');
  };
  feedbackEl.addEventListener('animationend', function onEnd(e) {
    if (e.target === feedbackEl && e.animationName === 'fold-away') {
      feedbackEl.removeEventListener('animationend', onEnd);
      finish();
    }
  });
  setTimeout(finish, 480);                      // belt & braces fallback
}

minBtn.addEventListener('click', minimizeWidget);
fabEl.addEventListener('click', function () { openWidget(true); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && widgetState === 'open') minimizeWidget();
});

/* live counter (amber near the cap, red at it) + auto-grow */
msgInput.addEventListener('input', function () {
  var len = msgInput.value.length;
  counterEl.textContent = len + ' / 500';
  counterEl.classList.toggle('warn', len > 440 && len < 500);
  counterEl.classList.toggle('max', len >= 500);
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 176) + 'px';
});
/* Ctrl/⌘ + Enter sends — a desktop nicety */
msgInput.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') sendBtn.click();
});

/* --- Telegram dispatch --------------------------------------------------
   Posts the message straight to the Bot API via fetch — no reload, no
   external service. Falls back to a simulated round-trip while the
   credentials above are still placeholders, so the flow is fully testable.
   Success → chime + toast + drawn-check overlay → auto-minimize. */
var sendLockUntil = 0;

function setLoading(on) {
  sendBtn.classList.toggle('is-loading', on);
  sendBtn.disabled = on;
}

sendBtn.addEventListener('click', function () {
  if (Date.now() < sendLockUntil) return;        // anti double-tap / spam

  var text = msgInput.value.trim();
  if (!text) {
    showToast('اكتب رسالتك أولًا', 'error');
    msgInput.classList.remove('shake'); void msgInput.offsetWidth;
    msgInput.classList.add('shake');
    msgInput.focus({ preventScroll: true });
    return;
  }

  setLoading(true);

  var configured =
    TELEGRAM_BOT_TOKEN.indexOf('YOUR_') === -1 &&
    TELEGRAM_CHAT_ID.indexOf('YOUR_') === -1;

  var job;
  if (configured) {
    job = fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: '📩 جديد من موقع Quizzes:\n\n' + text
      })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok || !data.ok) throw new Error(data.description || ('HTTP ' + res.status));
      });
    });
  } else {
    /* DEMO MODE — plug your token & chat id into the constants above. */
    console.info('[Quizzes] Telegram credentials not set — simulating the send.');
    job = new Promise(function (r) { setTimeout(r, 1100); });
  }

  job.then(function () {
    /* success: clear, chime, confirm, then fold into the floating trigger */
    msgInput.value = '';
    counterEl.textContent = '0 / 500';
    counterEl.classList.remove('warn', 'max');
    msgInput.style.height = '';
    setLoading(false);
    sendLockUntil = Date.now() + 2600;
    AudioFX.sendChime();
    showToast('تم إرسال رسالتك بنجاح', 'success');
    fbDone.classList.add('show');
    setTimeout(minimizeWidget, 1700);
    setTimeout(function () { fbDone.classList.remove('show'); }, 2700);
  }).catch(function (err) {
    console.error('[Quizzes] Telegram send failed:', err);
    setLoading(false);
    showToast('تعذّر الإرسال، حالبًا حاول مرة أخرى'.replace('حالبًا', 'حاول'), 'error');
  });
});

/* --- ambient sound toggle ---------------------------------------------- */
soundBtn.addEventListener('click', function () {
  var muted = AudioFX.toggleMute();
  soundBtn.classList.toggle('is-muted', muted);
  soundBtn.classList.remove('attn');
  soundBtn.setAttribute('aria-pressed', String(muted));
});

/* ====================================================================== */
/* 12. BOOT                                                                */
/* ====================================================================== */
/* Whisper of film grain: a JS-generated noise tile on the transform-only
   #grain layer (see CSS). Generated once, costs nothing afterwards. */
(function makeGrain() {
  var n = 128, c = document.createElement('canvas');
  c.width = c.height = n;
  var g = c.getContext('2d');
  var id = g.createImageData(n, n);
  for (var i = 0; i < id.data.length; i += 4) {
    var v = (Math.random() * 255) | 0;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  document.getElementById('grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
})();

haloX = haloTX = window.innerWidth / 2;
haloY = haloTY = window.innerHeight / 2;

sizeAll();                       // surfaces, scenes, frost, streaks
seedDroplets();                 // a pane that already has history
Lightning.prime(performance.now());
AudioFX.init();                  // AudioContext created immediately on load
rafId = requestAnimationFrame(frame);

/* Cinematic open: wait for the wordmark fonts, then lift the blackout and
   start the fog-clearing reveal. A hard timeout guarantees it always runs. */
var isReadyFired = false;
function setReady() {
  if (isReadyFired) return;
  isReadyFired = true;
  document.body.classList.add('is-ready');
  readyAt = performance.now();
}
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(setReady);
  setTimeout(setReady, 2200);
} else {
  setTimeout(setReady, 300);
}

/* spec: the card slides in 2500ms after load */
setTimeout(function () { openWidget(false); }, 2500);

/* teach the wipe-the-glass interaction, then let it fade */
setTimeout(function () { if (!hintDismissed) hintEl.classList.add('is-visible'); }, 6800);
setTimeout(dismissHint, 17000);

/* if autoplay is blocked, gently draw attention to the sound toggle */
setTimeout(function () {
  if (!AudioFX.isRunning()) soundBtn.classList.add('attn');
}, 5500);
</script>
