<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzes</title>
<script defer src="/_vercel/insights/script.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Hidden scrollbar ── */
html { scrollbar-width: none; }
::-webkit-scrollbar { display: none; }

html {
    background-color: #0f101b !important; 
    scroll-behavior: smooth; 
}

/* ── CSS Variables ── */
:root {
--bg-gradient-1: #050505; 
--bg-gradient-2: #17181a; 
--bg-gradient-3: #070818; 
--card-border: rgba(255, 255, 255, 0.05);
--text-main: #f8fafc; 
--text-muted: #e0e4eb; 
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Poppins', system-ui, -apple-system, sans-serif;
}

body {
background: linear-gradient(180deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
background-size: 200% 200%;
background-attachment: fixed;
animation: gradientMove 20s ease infinite;
color: var(--text-main);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
overflow: hidden;
}

@keyframes gradientMove {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

.maintenance-container {
text-align: center;
max-width: 600px;
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
gap: 30px;
z-index: 1;
}

header h1 {
font-size: 3.5rem;
font-weight: 700;
margin-bottom: 15px;
color: var(--text-muted); 
letter-spacing: 1px;
}

.description {
font-size: 1.1rem;
line-height: 1.6;
color: var(--text-muted);
max-width: 520px;
margin: 0 auto;
font-weight: 400;
}

/* ── تظبيط الفيديو ليكون متجاوب في المنتصف ── */
.video-wrapper {
width: 100%;
max-width: 380px; 
border-radius: 20px;
overflow: hidden;
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
border: 1px solid var(--card-border);
display: flex;
}

.video-wrapper video {
width: 100%;
height: auto;
display: block;
object-fit: cover;
}

/* للموبايل وشاشات الطول */
@media (max-width: 480px) {
header h1 { font-size: 2.5rem; }
.description { font-size: 0.95rem; padding: 0 10px; }
.video-wrapper { max-width: 85%; }
}
</style>
</head>
<body>

<div class="maintenance-container">
<header>
  <h1>Quizzes</h1>
  
  <p class="description">
    The Website Is Currently Having Some Errors 🚨, Come Back Tomorrow At 3 PM 🕒, It'll Have New English Quizzes And Summaries ✅
  </p>
</header>

<main class="video-wrapper">
  <video autoplay loop muted playsinline preload="auto">
    <source src="https://media.tenor.com/XKwzkocGdvYAAAPo/cat-cat-meme.webm" type="video/webm">
    <source src="https://media.tenor.com/XKwzkocGdvYAAAPo/cat-cat-meme.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</main>
</div>

</body>
</html>
