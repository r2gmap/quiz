<style>
     html {
            background-color: #0f101b !important; 
            scroll-behavior: smooth; 
        }

/* ── Hidden scrollbar everywhere ── */
html { scrollbar-width: none; }
::-webkit-scrollbar { display: none; }

/* ── CSS Variables ── */
:root {
  --bg-gradient-1: #050505;
  --bg-gradient-2: #17181a;
  --bg-gradient-3: #070818;
  --card-bg: rgba(255, 255, 255, 0.02);
  --card-border: rgba(255, 255, 255, 0.05);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent-color: #0adaf1c7;
  --accent-solid: #0adaf1;
  --hover-bg: rgba(255, 255, 255, 0.04);
  --hover-border: rgba(0, 229, 255, 0.35);
  --hover-shadow: rgba(1, 135, 150, 0.12);
  --paper-color: #ffffff3f;
}

.light-mode {
  --bg-gradient-1: #f4f6f9;
  --bg-gradient-2: #e9ecef;
  --bg-gradient-3: #f1f3f5;
  --card-bg: rgba(255, 255, 255, 0.7);
  --card-border: rgba(0, 0, 0, 0.05);
  --text-main: #2d3748;
  --text-muted: #718096;
  --accent-color: #4299e1;
  --accent-solid: #4299e1;
  --hover-bg: rgba(255, 255, 255, 1);
  --hover-border: rgba(66, 153, 225, 0.4);
  --hover-shadow: rgba(66, 153, 225, 0.1);
  --paper-color: rgba(54, 52, 52, 0.452);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', system-ui, -apple-system, sans-serif;
  /* Eliminate tap delay on all clickable things */
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

html {
  background-color: #0f101b !important;
  scroll-behavior: smooth;
}

body {
  background: linear-gradient(180deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
  background-size: 200% 200%;
  background-attachment: fixed;
  animation: gradientMove 20s ease infinite;
  color: var(--text-main);
  transition: background 0.5s ease, color 0.5s ease;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

@keyframes gradientMove {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── Falling paper particles ── */
.falling-paper {
  position: fixed;
  width: 10px;
  height: 14px;
  background: var(--paper-color);
  z-index: 0;
  pointer-events: none;
  border-radius: 2px;
  animation: fall linear infinite;
  will-change: transform;
}

@keyframes fall {
  0%   { transform: translateY(-10vh) rotate(0deg) translateX(0);    opacity: 0; }
  15%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translateY(105vh) rotate(360deg) translateX(50px); opacity: 0; }
}

/* ── Layout ── */
.main-container {
  width: 100%;
  max-width: 1250px;
  padding: 20px;
  z-index: 1;
  display: flex;
  flex-direction: column;
  flex: 1;
}

/* ── Nav ── */
.top-nav {
  display: flex;
  justify-content: flex-end;
  padding: 15px 0;
}

#theme-toggle {
  background: transparent;
  color: white;
  border: 1px solid var(--card-border);
  width: 45px;
  height: 45px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.2rem;
  transition: color 0.25s ease, border-color 0.25s ease,
              background 0.25s ease, box-shadow 0.25s ease;
}

#theme-toggle:hover {
  color: var(--accent-color);
  border-color: var(--accent-color);
  background: var(--card-bg);
  box-shadow: 0 0 12px var(--hover-shadow);
}

/* ── Header ── */
header {
  text-align: center;
  margin: 30px 0 50px 0;
  min-height: 130px;
}

h1 {
  font-size: 3.5rem;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text-main);
  letter-spacing: 1px;
}

h1 span { color: var(--accent-color); }

.description {
  font-family: "Consolas", "monospace";
  font-size: 1.1rem;
  line-height: 1.7;
  color: var(--text-muted);
  max-width: 550px;
  margin: 0 auto;
  font-weight: 400;
}

.description::after {
  content: '|';
  animation: blink 0.7s infinite;
  color: var(--accent-color);
  margin-left: 3px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

/* ── Cards ── */
.card-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
  width: 100%;
  margin-bottom: 80px;
}

.card {
  position: relative;
  background: var(--card-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--card-border);
  width: 270px;
  padding: 36px 24px 28px;
  border-radius: 20px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.3s ease,
              border-color 0.3s ease,
              background 0.3s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  /* GPU layer for smooth animation */
  will-change: transform;
}

/* Top accent line — hidden by default */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%) scaleX(0);
  width: 60%;
  height: 2px;
  border-radius: 0 0 4px 4px;
  background: linear-gradient(90deg, transparent, var(--accent-solid), transparent);
  transition: transform 0.35s ease, opacity 0.35s ease;
  opacity: 0;
}

/* Bottom glow blob — hidden by default */
.card::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 50%;
  transform: translateX(-50%);
  width: 100px; height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--hover-shadow) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.35s ease, bottom 0.35s ease;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-6px) scale(1.015);
  background: var(--hover-bg);
  border-color: var(--hover-border);
  box-shadow: 0 16px 40px var(--hover-shadow),
              0 0 0 1px var(--hover-border);
}

.card:hover::before {
  transform: translateX(-50%) scaleX(1);
  opacity: 1;
}

.card:hover::after {
  opacity: 1;
  bottom: -20px;
}

/* Active tap feedback */
.card:active {
  transform: translateY(-2px) scale(0.98);
  transition-duration: 0.1s;
}

.card i {
  font-size: 2.6rem;
  margin-bottom: 16px;
  color: var(--text-muted);
  transition: color 0.3s ease, transform 0.3s ease;
}

.card:hover i {
  color: var(--accent-color);
  transform: scale(1.15) translateY(-2px);
}

.card h3 {
  font-size: 1.1rem;
  font-weight: 500;
  color: var(--text-main);
  transition: color 0.3s ease;
  letter-spacing: 0.4px;
  line-height: 1.4;
}

.card:hover h3 {
  color: var(--text-main);
}

/* ── Footer ── */
footer {
  margin-top: auto;
  text-align: center;
  padding: 28px 20px 24px;
  width: 100%;
  border-top: 1px solid var(--card-border);
}

.footer-inner {
  display: flex;
  flex-direction: row;
  justify-content: center;
  gap: 14px;
}

.footer-row {
  display: flex;
  align-items: center;
  gap: 18px;
}

.footer-label {
  color: var(--text-muted);
  font-size: 0.85rem;
  font-weight: 300;
  letter-spacing: 0.3px;
}

.footer-link {
  text-decoration: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  transition: color 0.25s ease, transform 0.25s ease, text-shadow 0.25s ease;
  display: flex;
  align-items: center;
}

.footer-link:hover {
  color: var(--accent-color);
  transform: scale(1.1) translateY(-1px);
  text-shadow: 0 0 14px var(--hover-shadow);
}

.footer-version {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 50px;
  padding: 5px 14px;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

.footer-version i {
  font-size: 0.7rem;
  color: var(--accent-color);
}

/* ── Toast Notification ── */
#toast-container {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
  pointer-events: none;
  width: max-content;
  max-width: 90vw;
}

.toast-message {
  background: rgba(15, 20, 35, 0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #f8fafc;
  font-family: 'Poppins', sans-serif;
  padding: 13px 20px 13px 16px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(10, 218, 241, 0.08);
  position: relative;
  overflow: hidden;
  min-width: 260px;
  max-width: 380px;
  font-weight: 500;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: all;
  opacity: 0;
  transform: translateY(16px) scale(0.96);
  transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  will-change: transform, opacity;
}

.toast-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, rgba(10, 218, 241, 0.2), rgba(58, 123, 213, 0.2));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 0.85rem;
  color: var(--accent-solid);
}

.toast-body { flex: 1; line-height: 1.4; }

.toast-message.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* Progress bar */
.toast-progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, #0adaf1, #3a7bd5);
  width: 100%;
  border-radius: 0 0 14px 14px;
}

@keyframes progress-shrink {
  from { width: 100%; }
  to   { width: 0%; }
}

/* ── Rating Popup ── */
#rating-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  padding: 16px;
}

#rating-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

#rating-popup {
  background: #0e0f1c;
  border: 1px solid rgba(10, 218, 241, 0.18);
  border-radius: 24px;
  padding: 36px 32px 28px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 60px rgba(10, 218, 241, 0.07),
              0 24px 64px rgba(0, 0, 0, 0.6);
  transform: translateY(24px) scale(0.96);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  will-change: transform;
}

#rating-overlay.visible #rating-popup {
  transform: translateY(0) scale(1);
}

.rating-emoji {
  font-size: 2.4rem;
  margin-bottom: 8px;
  display: block;
}

#rating-popup h2 {
  font-size: 1.25rem;
  font-weight: 600;
  color: #f8fafc;
  margin-bottom: 5px;
  letter-spacing: 0.2px;
}

#rating-popup > div > p {
  font-size: 0.85rem;
  color: #94a3b8;
  margin-bottom: 22px;
  font-weight: 300;
}

/* Section labels */
.rating-section-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #0adaf1;
  margin-bottom: 10px;
  text-align: left;
}

/* Stars */
.star-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 6px;
}

.star-row i {
  font-size: 1.9rem;
  color: rgba(255,255,255,0.1);
  cursor: pointer;
  transition: color 0.18s ease, transform 0.18s ease;
  will-change: transform;
}

.star-row i.hovered,
.star-row i.selected {
  color: #f6c90e;
  transform: scale(1.2);
}

/* Divider */
.rating-divider {
  width: 100%;
  height: 1px;
  background: rgba(255, 255, 255, 0.06);
  margin: 18px 0 16px;
}

/* Suggestion textarea */
#rating-suggestion {
  width: 100%;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 12px;
  padding: 11px 14px;
  font-family: 'Poppins', sans-serif;
  font-size: 0.87rem;
  color: #f8fafc;
  resize: none;
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
  margin-bottom: 18px;
  line-height: 1.6;
}

#rating-suggestion::placeholder { color: #3a4a5a; }

#rating-suggestion:focus {
  border-color: rgba(10, 218, 241, 0.3);
  box-shadow: 0 0 0 3px rgba(10, 218, 241, 0.06);
}

/* Submit button */
#rating-submit-btn {
  background: linear-gradient(135deg, #0adaf1cc, #3a7bd5);
  color: #fff;
  border: none;
  padding: 12px 32px;
  border-radius: 50px;
  font-family: 'Poppins', sans-serif;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
  width: 100%;
  letter-spacing: 0.3px;
}

#rating-submit-btn:hover:not(:disabled) {
  opacity: 0.9;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(10, 218, 241, 0.25);
}

#rating-submit-btn:active:not(:disabled) {
  transform: translateY(0);
}

#rating-submit-btn:disabled {
  opacity: 0.28;
  cursor: not-allowed;
}

/* Close button */
#rating-close-btn {
  position: absolute;
  top: 14px; right: 16px;
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 1rem;
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease;
  line-height: 1;
  padding: 6px;
  border-radius: 6px;
}

#rating-close-btn:hover {
  color: #f8fafc;
  background: rgba(255,255,255,0.06);
}

/* Thank-you state */
#rating-thankyou {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
}

#rating-thankyou .ty-emoji { font-size: 2.6rem; }

#rating-thankyou .ty-title {
  font-size: 1.1rem;
  color: #f8fafc;
  font-weight: 600;
  margin: 0;
}

#rating-thankyou .ty-sub {
  font-size: 0.82rem;
  color: #94a3b8;
  line-height: 1.5;
}

/* Light-mode overrides */
.light-mode #rating-popup {
  background: #ffffff;
  border-color: rgba(66, 153, 225, 0.2);
  box-shadow: 0 0 40px rgba(66, 153, 225, 0.07), 0 20px 60px rgba(0,0,0,0.1);
}

.light-mode #rating-popup h2 { color: #2d3748; }
.light-mode #rating-popup > div > p { color: #718096; }
.light-mode .rating-section-label { color: #4299e1; }
.light-mode .rating-divider { background: rgba(0,0,0,0.07); }
.light-mode .star-row i { color: rgba(0,0,0,0.12); }
.light-mode #rating-suggestion {
  background: rgba(0,0,0,0.03);
  border-color: rgba(0,0,0,0.09);
  color: #2d3748;
}
.light-mode #rating-suggestion::placeholder { color: #a0aec0; }
.light-mode #rating-suggestion:focus {
  border-color: rgba(66,153,225,0.35);
  box-shadow: 0 0 0 3px rgba(66,153,225,0.07);
}
.light-mode #rating-close-btn { color: #718096; }
.light-mode #rating-close-btn:hover { color: #2d3748; background: rgba(0,0,0,0.05); }
.light-mode #rating-thankyou .ty-title { color: #2d3748; }

/* ── Mobile ── */
@media (max-width: 650px) {
  html { background-color: #0f101b !important; }

  h1 { font-size: 2.8rem; }

  header { margin: 20px 0 30px 0; }

  .card-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 4px;
  }

  .card {
    width: 100%;
    padding: 24px 14px 20px;
    border-radius: 18px;
    /* Disable blur on mobile — biggest perf win */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  /* Disable heavy ::before / ::after on mobile */
  .card::before, .card::after { display: none; }

  .card i  { font-size: 2rem; margin-bottom: 10px; }
  .card h3 { font-size: 0.9rem; }

  /* Simpler hover on touch (becomes active state) */
  .card:hover {
    transform: none;
    box-shadow: none;
  }

  .card:active {
    transform: scale(0.97);
    background: var(--hover-bg);
    border-color: var(--hover-border);
  }

  #rating-popup {
    padding: 28px 20px 22px;
  }

  footer { padding: 22px 16px 18px; }
}

/* Respect reduced-motion preference */
@media (prefers-reduced-motion: reduce) {
  .falling-paper{
  @keyframes gradientMove,
  @keyframes fall { animation: none; }
  * { transition-duration: 0.01ms !important; }}
}

</style>

    </div>

    <!-- Thank-you state -->
    <div id="rating-thankyou">
      <span class="ty-emoji">📩</span>
      <p class="ty-title">Thanks For Your Feedback!</p>
      <p class="ty-sub">============</p>
    </div>
  </div>
</div>
<!-- ===== END RATING POPUP ===== -->

<script>
// =====================================================
// ▼▼▼  PASTE YOUR GOOGLE FORM LINK HERE  ▼▼▼
const RATING_FORM_LINK = 'https://formspree.io/f/maqljdkg';
// ▲▲▲  PASTE YOUR GOOGLE FORM LINK HERE  ▲▲▲
// =====================================================

// ── Theme toggle ──
const themeToggle = document.getElementById('theme-toggle');
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('light-mode');
  themeToggle.querySelector('i').className =
    document.body.classList.contains('light-mode') ? 'fas fa-moon' : 'fas fa-sun';
});

// ── Falling papers (throttled — one every 600 ms, max 18 alive) ──
let paperCount = 0;
function createPaper() {
  if (paperCount >= 18) return;
  paperCount++;
  const paper = document.createElement('div');
  paper.className = 'falling-paper';
  paper.style.left = Math.random() * 100 + 'vw';
  const duration = Math.random() * 8 + 8;
  paper.style.animationDuration = duration + 's';
  document.body.appendChild(paper);
  setTimeout(() => { paper.remove(); paperCount--; }, duration * 1000);
}
// Pause papers on mobile to save battery/perf
// if (window.innerWidth > 650) setInterval(createPaper, 600);

// ── Typewriter ──
const phrases = [
  "All In One Place ✅",
  "Interactive, Never Boring 🚀",
  "Expected For Exams 🎯",
  "From Recordings & PDFs 📖",
  "Save Time | Study Smart 💡"
];
let phraseIdx = 0, charIdx = 0, deleting = false;
const typeEl = document.getElementById('typewriter-text');

function typeEffect() {
  const phrase = phrases[phraseIdx];
  typeEl.textContent = deleting
    ? phrase.substring(0, charIdx - 1)
    : phrase.substring(0, charIdx + 1);
  deleting ? charIdx-- : charIdx++;

  let speed = deleting ? 20 : 50;
  if (!deleting && charIdx === phrase.length) { speed = 1200; deleting = true; }
  else if (deleting && charIdx === 0) {
    deleting = false;
    phraseIdx = (phraseIdx + 1) % phrases.length;
    speed = 500;
  }
  setTimeout(typeEffect, speed);
}
window.addEventListener('load', () => setTimeout(typeEffect, 200));

// ── Toast Notification ──
function showNotification(message, durationInSeconds = 5) {
  const container = document.getElementById('toast-container');

  const toast = document.createElement('div');
  toast.className = 'toast-message';

  const icon = document.createElement('div');
  icon.className = 'toast-icon';
  icon.innerHTML = '<i class="fas fa-bell"></i>';

  const body = document.createElement('div');
  body.className = 'toast-body';
  body.textContent = message;

  const bar = document.createElement('div');
  bar.className = 'toast-progress';
  bar.style.animation = `progress-shrink ${durationInSeconds}s linear forwards`;

  toast.appendChild(icon);
  toast.appendChild(body);
  toast.appendChild(bar);
  container.appendChild(toast);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => toast.classList.add('show'));
  });

  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 350);
  }, durationInSeconds * 1000);
}

// showNotification("New Cogno Quizzes Were Added", 7);

// ── Rating Popup ──
(function () {
  const STORAGE_KEY = 'quizzes_user_rated_v2';

  // Don't show if already rated
  if (localStorage.getItem(STORAGE_KEY)) return;

  const overlay     = document.getElementById('rating-overlay');
  const closeBtn    = document.getElementById('rating-close-btn');
  const stars       = document.querySelectorAll('#star-row i');
  const submitBtn   = document.getElementById('rating-submit-btn');
  const suggestion  = document.getElementById('rating-suggestion');
  const formContent = document.getElementById('rating-form-content');
  const thankYou    = document.getElementById('rating-thankyou');

  let selectedRating = 0;

  // Show after 1 seconds
  setTimeout(() => overlay.classList.add('visible'), 1000);

  function closePopup() {
    overlay.classList.remove('visible');
  }

  // Check if submit should be enabled (stars required; suggestion optional)
  function refreshSubmit() {
    submitBtn.disabled = selectedRating === 0;
  }

  closeBtn.addEventListener('click', closePopup);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePopup(); });

  // Star interaction — works on both mouse and touch
  stars.forEach(star => {
    const val = parseInt(star.dataset.value);

    star.addEventListener('mouseenter', () => {
      stars.forEach(s => s.classList.toggle('hovered', parseInt(s.dataset.value) <= val));
    });
    star.addEventListener('mouseleave', () => {
      stars.forEach(s => {
        s.classList.remove('hovered');
        s.classList.toggle('selected', parseInt(s.dataset.value) <= selectedRating);
      });
    });
    star.addEventListener('click', () => {
      selectedRating = val;
      stars.forEach(s => {
        s.classList.remove('hovered');
        s.classList.toggle('selected', parseInt(s.dataset.value) <= selectedRating);
      });
      refreshSubmit();
    });
  });

  // Submit: POST to Formspree, save to localStorage, show thank-you
  submitBtn.addEventListener('click', () => {
    if (selectedRating === 0) return;

    // Disable button while sending
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const payload = {
      rating: selectedRating + ' / 5',
      suggestion: suggestion.value.trim() || '(no suggestion)'
    };

    fetch('https://formspree.io/f/maqljdkg', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(() => {
      // Mark as rated so it never shows again
      localStorage.setItem(STORAGE_KEY, selectedRating);
      // Show thank-you
      formContent.style.display = 'none';
      thankYou.style.display    = 'flex';
      // Auto-close after 15 s
      setTimeout(closePopup, 15000);
    })
    .catch(() => {
      // On network error still save locally and show thank-you
      localStorage.setItem(STORAGE_KEY, selectedRating);
      formContent.style.display = 'none';
      thankYou.style.display    = 'flex';
      setTimeout(closePopup, 15000);
    });
  });
})();
</script>
</body>
</html>
