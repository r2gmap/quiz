    <style>
        /* ── Font Smoothing (To Fix Blurry Text) ── */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            background-color: #03050a !important; /* Cyber Space Dark */
            scroll-behavior: smooth; 
            scrollbar-width: none;
        }
        ::-webkit-scrollbar { display: none; }

        /* ── Variables ── */
        :root {
            --bg-dark: #03050a; /* Cyber Space Base */
            --bg-gradient-1: #050505;
            --bg-gradient-2: #17181a;
            --bg-gradient-3: #070818;
            --card-bg: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 70%, rgba(140,60,240,0.05) 100%);
            --card-border: transparent;
            --text-main: #f8fafc;
            --text-muted: #b9bfc7;
            --accent-color: #0adaf1c7;
            --accent-solid: #0adaf1;
            --hover-bg: rgba(255, 255, 255, 0.06);
            --hover-border: rgba(10, 218, 241, 0.35);
            --hover-shadow: rgba(10, 218, 241, 0.15);
            --paper-color: rgba(255, 255, 255, 0.18);
        }

        /* ── Reset ── */
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Background ── */
        /* Animated Cyber-Space Gradient */
        body::before {
            content: '';
            position: fixed;
            inset: -50px;
            background:
                radial-gradient(circle at 20% 30%, rgba(10,218,241,0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(140,60,240,0.18) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(6,8,15,0.9) 0%, var(--bg-dark) 100%);
            pointer-events: none;
            z-index: -2;
            animation: spaceGlow 12s ease-in-out infinite alternate;
            transition: background 0.5s ease;
        }

        /* Starfield effect */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 15%  20%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 72%  8%,  rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 88%  35%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 32%  78%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 65% 88%, rgba(10,218,241,0.5) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 28% 42%, rgba(150,80,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 80%  70%, rgba(255,255,255,0.4) 0%, transparent 100%);
            pointer-events: none;
            z-index: -1;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        body {
            color: var(--text-main);
            transition: color 0.4s ease;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 60px;
        }

        @keyframes spaceGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(20px, 20px); }
        }

        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── Falling paper ── */
        .falling-paper {
            position: fixed;
            width: 10px; height: 14px;
            background: var(--paper-color);
            z-index: 0;
            pointer-events: none;
            border-radius: 2px;
            animation: fall linear infinite;
            will-change: transform;
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(50px); opacity: 0; }
        }

        /* ── Layout ── */
        .main-container {
            width: 100%;
            max-width: 860px;
            padding: 0 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* ── Top Nav ── */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 16px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            padding: 9px 18px;
            border-radius: 50px;
            border: 1px solid rgba(10, 218, 241, 0.15);
            transition: all 0.25s ease;
            letter-spacing: 0.2px;
        }

        .back-btn i { font-size: 0.82rem; }

        .back-btn:hover {
            color: var(--accent-solid);
            border-color: var(--hover-border);
            background: rgba(10, 218, 241, 0.08);
            box-shadow: 0 0 14px var(--hover-shadow);
            transform: translateX(-3px);
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin: 28px 0 44px;
        }

        /* Icon ring glow */
        .icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px; height: 90px;
            margin-bottom: 20px;
        }

        .icon-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(10, 218, 241, 0.18) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            border: 1px solid rgba(10, 218, 241, 0.3);
            animation: rotateBorder 8s linear infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1);   opacity: 0.8; }
            50%       { transform: scale(1.15); opacity: 1;   }
        }

        @keyframes rotateBorder {
            to { transform: rotate(360deg); }
        }

        .subject-icon {
            font-size: 2.8rem;
            color: var(--accent-solid);
            filter: drop-shadow(0 0 15px rgba(10, 218, 241, 0.6));
            z-index: 1;
            position: relative;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 10%, #a2c2fe 40%, #5ad2f7 70%, #b3f2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulseNeonText 4s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes pulseNeonText {
            0% { filter: drop-shadow(0 0 10px rgba(10,218,241,0.3)); }
            100% { filter: drop-shadow(0 0 20px rgba(10,218,241,0.6)) drop-shadow(0 0 30px rgba(140,60,240,0.3)); }
        }

        .subject-subtitle {
            font-size: 0.95rem;
            color: rgba(175, 195, 235, 0.8);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* ── Section label ── */
        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* ── Quiz / Item list ── */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 60px;
        }

        /* ── Base card ── */
        .item-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid transparent;
            padding: 18px 22px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-shadow: 
                0 0 0 1px rgba(10,218,241,0.15), 
                0 10px 30px rgba(0,0,0,0.3), 
                inset 0 1px 2px rgba(255,255,255,0.05);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                        box-shadow 0.3s ease, background 0.3s ease;
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        /* Left accent stripe */
        .item-card::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 4px;
            height: 60%;
            border-radius: 0 4px 4px 0;
            background: linear-gradient(180deg, var(--accent-solid), rgba(140,60,240,0.8));
            transition: transform 0.3s ease;
            box-shadow: 0 0 10px var(--accent-solid);
        }

        .item-card:hover::before,
        .item-card:focus-within::before {
            transform: translateY(-50%) scaleY(1);
        }

        .quiz-item { cursor: pointer; }

        .item-card:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.07);
            box-shadow: 
                0 0 0 1px rgba(10,218,241,0.35), 
                0 15px 40px rgba(0,0,0,0.5), 
                0 0 25px rgba(10,218,241,0.15);
        }

        .quiz-item:active { transform: translateY(-1px); transition-duration: 0.1s; }

        /* ── Item info (left side) ── */
        .item-info { flex: 1; min-width: 0; z-index: 1; }

        .item-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.25s ease;
        }

        .item-card:hover .item-info h3 { color: var(--accent-solid); }

        .item-info p {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Quiz right side ── */
        .quiz-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            z-index: 1;
        }

        .question-count {
            background: rgba(10, 218, 241, 0.08);
            color: var(--accent-solid);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 50px;
            border: 1px solid rgba(10, 218, 241, 0.2);
            letter-spacing: 0.5px;
            white-space: nowrap;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .item-card:hover .question-count {
            background: rgba(10, 218, 241, 0.15);
            box-shadow: 0 0 12px rgba(10, 218, 241, 0.2);
        }

        /* Play button */
        .play-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(10, 218, 241, 0.08);
            border: 1px solid rgba(10, 218, 241, 0.25);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-solid);
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }

        .item-card:hover .play-btn {
            background: var(--accent-solid);
            color: #03050a;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(10, 218, 241, 0.4);
            transform: scale(1.1);
        }

        /* ── PDF right side ── */
        .pdf-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            z-index: 1;
        }

        .btn-view, .btn-download {
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .btn-view {
            background: rgba(10, 218, 241, 0.05);
            color: var(--accent-solid);
            border: 1px solid rgba(10, 218, 241, 0.3);
        }

        .btn-view:hover {
            background: rgba(10, 218, 241, 0.15);
            border-color: var(--accent-solid);
            box-shadow: 0 0 15px rgba(10, 218, 241, 0.2);
        }

        .btn-download {
            background: linear-gradient(135deg, rgba(10,218,241,0.9), rgba(58,123,213,0.9));
            color: #03050a;
            border: none;
        }

        .btn-download:hover {
            box-shadow: 0 6px 20px rgba(10, 218, 241, 0.4);
            transform: translateY(-2px);
            color: #000;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text-main); }
        .empty-state p  { font-size: 0.9rem; }

        /* ════════════════════════════════════════════════════════
           GAMES GRID
        ════════════════════════════════════════════════════════ */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 60px;
        }

        .game-card {
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            cursor: pointer;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid transparent;
            box-shadow: 
                0 0 0 1px rgba(10,218,241,0.15), 
                0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                        box-shadow 0.3s ease;
            will-change: transform;
        }

        .game-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
            pointer-events: none;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 0 0 1px rgba(10,218,241,0.4), 
                0 20px 45px rgba(0,0,0,0.6), 
                0 0 30px rgba(10,218,241,0.15);
        }

        .game-card:hover img {
            transform: scale(1.08);
        }

        .game-card:active {
            transform: translateY(-2px);
            transition-duration: 0.1s;
        }

        /* ── Mobile for Subject Content ── */
        @media (max-width: 600px) {
            html { background-color: var(--bg-dark) !important; }

            h1 { font-size: 1.8rem; }

            .icon-wrapper { width: 76px; height: 76px; }
            .subject-icon { font-size: 2.2rem; }

            header { margin: 20px 0 32px; }

            .item-card {
                padding: 16px;
                border-radius: 16px;
            }

            .item-card:hover { transform: translateY(-2px); }
            .item-card:active {
                transform: scale(0.98);
            }

            .item-card.pdf-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .pdf-actions { width: 100%; }

            .btn-view, .btn-download { flex: 1; justify-content: center; }

            .question-count { font-size: 0.72rem; padding: 4px 12px; }
            .play-btn { width: 36px; height: 36px; font-size: 0.85rem; }

            .games-grid { gap: 14px; }
            .game-card  { border-radius: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>

            paperCount++;
            const paper = document.createElement('div');
            paper.className = 'falling-paper';
            paper.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 8 + 8;
            paper.style.animationDuration = duration + 's';
            document.body.appendChild(paper);
            setTimeout(() => { paper.remove(); paperCount--; }, duration * 1000);

                    { id: "phy3", title: "Quiz III", desc: "", q: 59 },
                    { id: "phy4", title: "Quiz IV", desc: "", q: 59 },
                    { id: "phy5", title: "Quiz V", desc: "", q: 21 },
                    { id: "phy6", title: "Quiz VI", desc: "", q: 25 },
                ]
            },

            anatomy: {
                title: "Anatomy & Histology",
                subtitle: "",
                icon: "fas fa-dna",
                quizzes: [
                    { id: "his1", title: "Anatomy Q Bank", desc: "Very Important 🚨", q: 43 },
                    { id: "his2", title: "Histology Q Bank", desc: "Very Important 🚨", q: 61 },
                    { id: "his4", title: "Histo Lecs Qs", desc: "Very Important 🚨", q: 35 },
                    { id: "his3", title: "Quiz I", desc: "Out Of Q.Banks", q: 30 },
                    { id: "his5", title: "Quiz II", desc: "Important 🚨", q: 24 },
                ]
            },

            english: {
                title: "English II",
                subtitle: "",
                icon: "fas fa-spell-check",
                quizzes: [
                    { id: "eng1", title: "Quiz I", desc: "General Idioms", q: 50 },
                    { id: "eng2", title: "Quiz II", desc: "Prepositions & Phrasal Verbs", q: 40 },
                    { id: "eng3", title: "Quiz III", desc: "Phobias and Fear Vocabulary", q: 45 },
                    { id: "eng4", title: "Quiz IV", desc: "Stress & Problem Handling", q: 35 },
                    { id: "eng5", title: "Quiz V", desc: "Mood & Daily Idioms", q: 40 },
                    { id: "eng6", title: "Quiz VI", desc: "", q: 100 },
                    { id: "eng7", title: "Quiz VII", desc: "", q: 100 },
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const currentSubjectId = urlParams.get('id');

        const titleEl    = document.getElementById('subject-title');
        const subtitleEl = document.getElementById('subject-subtitle');
        const iconEl     = document.getElementById('subject-icon');
        const container  = document.getElementById('quiz-container');

        if (currentSubjectId && subjectsData[currentSubjectId]) {
            const subject = subjectsData[currentSubjectId];

            titleEl.textContent    = subject.title;
            subtitleEl.textContent = subject.subtitle || '';
            iconEl.className       = `subject-icon ${subject.icon}`;
            document.title         = `${subject.title} — Quizzes`;

            if (subject.isGamesMode) {
                container.className = 'games-grid';
                const label = document.createElement('div');
                label.className   = 'section-label';
                label.textContent = 'Games';
                container.parentNode.insertBefore(label, container);

                subject.games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', game.title);

                    const img = document.createElement('img');
                    img.src   = game.poster;
                    img.alt   = game.title;
                    img.loading = 'lazy'; 

                    card.appendChild(img);
                    card.addEventListener('click', () => {
                        location.href = game.url;
                    });
                    container.appendChild(card);
                });

            } else {
                const items = subject.isPdfMode ? subject.files : subject.quizzes;

                if (items && items.length > 0) {
                    const label = document.createElement('div');
                    label.className   = 'section-label';
                    label.textContent = subject.isPdfMode ? 'Summaries' : ' Quizzes';
                    container.appendChild(label);

                    items.forEach(item => {
                        if (subject.isPdfMode) {
                            const card = document.createElement('div');
                            card.className = 'item-card pdf-card';
                            card.innerHTML = `
                                <div class="item-info">
                                    <h3>${item.title}</h3>
                                    ${item.desc ? `<p>${item.desc}</p>` : ''}
                                </div>
                                <div class="pdf-actions">
                                    <a href="${item.url}" target="_blank" class="btn-view">
                                        <i class="fas fa-eye"></i> View
                                    </a>
                                    <a href="${item.url}" download class="btn-download">
                                        <i class="fas fa-download"></i> Download
                                    </a>
                                </div>
                            `;
                            container.appendChild(card);
                        } else {
                            const card = document.createElement('div');
                            card.className = 'item-card quiz-item';
                            card.innerHTML = `
                                <div class="item-info">
                                    <h3>${item.title}</h3>
                                    ${item.desc ? `<p>${item.desc}</p>` : ''}
                                </div>
                                <div class="quiz-meta">
                                    <span class="question-count">${item.q} Qs</span>
                                    <div class="play-btn">
                                        <i class="fas fa-play"></i>
                                    </div>
                                </div>
                            `;
                            card.addEventListener('click', () => {
                                location.href = `quiz-player.html?quiz=${item.id}`;
                            });
                            container.appendChild(card);
                        }
                    });
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>Coming Soon</h3>
                            <p>No Content Available Yet — Check Back Later.</p>
                        </div>`;
                }
            }

        } else {
            titleEl.textContent = "Not Found";
            iconEl.className    = "subject-icon fas fa-exclamation-triangle";
            container.innerHTML = `
                <div class="empty-state">
                    <p>Please select a valid subject from the home page.</p>
                </div>`;
        }
    </script>

</body>
</html>
