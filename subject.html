<style>
/* ── Header: centered, glowing icon ring (original look) ── */
.sub-head { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 0 30px; }
.icon-wrapper { position: relative; width: 92px; height: 92px; display: grid; place-items: center; margin-bottom: 18px; }
.icon-wrapper::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); animation: pulseGlow 3.2s ease-in-out infinite; }
.icon-wrapper::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 1px dashed var(--accent-line); animation: spin 14s linear infinite; }
@keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.14); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
.subject-icon { position: relative; z-index: 1; display: grid; place-items: center; line-height: 0; color: var(--accent); filter: drop-shadow(0 0 12px var(--glow)); }
.subject-icon .ic { width: 44px; height: 44px; stroke-width: 1.5; }
.sub-head h1 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 700; letter-spacing: .5px; }
.sub-head p { color: var(--muted); font-size: .95rem; margin-top: 4px; }
.panel { padding: 30px 0 72px; }

/* ── Quizzes (original item-card feel) ── */
.quiz-list { display: grid; gap: 14px; max-width: 820px; margin: 0 auto; }
.quiz-row { position: relative; display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 18px; overflow: hidden; text-decoration: none;
  background: linear-gradient(145deg, var(--surface), transparent); border: 1px solid var(--line); content-visibility: auto; contain-intrinsic-size: auto 84px;
  transition: transform .3s var(--ease), border-color .25s, background-color .25s, box-shadow .25s; }
.quiz-row::before { content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px; border-radius: 0 3px 3px 0; background: var(--grad);
  transform: scaleY(0); transition: transform .3s var(--ease); }
.quiz-row .go { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; flex: none; order: 3;
  background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); transition: background .25s, color .25s, transform .3s var(--ease); }
.quiz-row .go .ic { width: 15px; height: 15px; }
.quiz-body { flex: 1; min-width: 0; }
.quiz-body b { display: block; font-weight: 600; line-height: 1.35; }
.quiz-body span { display: block; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.question-count { flex: none; order: 2; padding: 3px 12px; border-radius: 50px; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent);
  font-size: .74rem; font-weight: 500; font-variant-numeric: tabular-nums; }
@media (hover: hover) {
  .quiz-row:hover { transform: translateY(-3px); border-color: var(--accent-line); background: var(--surface-2); box-shadow: 0 12px 30px -8px var(--glow); }
  .quiz-row:hover::before { transform: scaleY(1); }
  .quiz-row:hover .go { background: var(--grad); color: var(--accent-ink); transform: scale(1.08); }
}
.quiz-row:active { transform: scale(.985); }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 56px 20px; max-width: 560px; margin: 0 auto;
  border: 1px dashed var(--line-strong); border-radius: 20px; color: var(--muted); background: var(--surface); }
.empty .tile { margin-bottom: 8px; }
.empty b { font-size: 1.15rem; font-weight: 600; color: var(--text); }

/* ── Notes: plain points, one box each ── */
#panel-notes { max-width: 820px; margin: 0 auto; }
.note-list { list-style: none; display: grid; gap: 12px; }
.note { position: relative; display: flex; align-items: flex-start; gap: 14px; padding: 18px 22px; border-radius: 16px; overflow: hidden; line-height: 1.85; font-size: .98rem;
  background: linear-gradient(145deg, var(--surface), transparent); border: 1px solid var(--line); content-visibility: auto; contain-intrinsic-size: auto 64px;
  transition: border-color .25s, transform .3s var(--ease); }
.note::before { content: ''; flex: none; width: 8px; height: 8px; margin-top: .78em; border-radius: 50%; background: var(--grad); box-shadow: 0 0 10px var(--glow); }
.note span { flex: 1; min-width: 0; overflow-wrap: anywhere; text-align: start; }
@media (hover: hover) { .note:hover { border-color: var(--accent-line); transform: translateY(-2px); } }
.note.is-placeholder { background: transparent; border-style: dashed; border-color: var(--line-strong); color: var(--muted); }
.note.is-placeholder::before { background: var(--line-strong); box-shadow: none; }

@media (max-width: 640px) {
  .sub-head { padding: 8px 0 22px; }
  .icon-wrapper { width: 78px; height: 78px; }
  .subject-icon .ic { width: 36px; height: 36px; }
  .quiz-row { padding: 15px 16px; gap: 12px; }
  .note { padding: 15px 16px; }
  .tab { padding: 0 14px; }
}
</style>

<script>
// ══════════════════════════════════════════════════════════════
// ### QUIZZES + ### NOTES + subject names/ids/icons now all live in one
// place: ui.js → "### SUBJECTS". This page only reads them.
// ══════════════════════════════════════════════════════════════

// ============================================================
// ### NOTIFICATION — the message that pops up at the top of the page
//     Remove the // in front of the line below and write your message.
// ============================================================

// Q.notify("Write your notification here", 6);

// Old links keep working (ids that were renamed)
const LEGACY_SUBJECT_IDS = { biochem1: 'biochemistry1', writing: 'scientific-writing' };

let currentSubjectId = new URLSearchParams(location.search).get('id');
if (LEGACY_SUBJECT_IDS[currentSubjectId]) {
  currentSubjectId = LEGACY_SUBJECT_IDS[currentSubjectId];
  if (history.replaceState) history.replaceState(null, '', location.pathname + '?id=' + currentSubjectId + location.hash);
}
const subject = Q.subjects.find(s => s.id === currentSubjectId);
const $ = id => document.getElementById(id);

function renderHead() {
  if (!subject) {
    $('sub-head').innerHTML = '<h1>Subject not found</h1><p>Return to the subjects list and pick one.</p>';
    $('subject-tabs').hidden = true; $('panel-quizzes').hidden = true; return false;
  }
  document.title = subject.name + ' · Quizzes';
  $('sub-head').innerHTML =
    '<div class="icon-wrapper"><span class="subject-icon">' + Q.icon(subject.icon) + '</span></div>' +
    '<h1>' + subject.name + '</h1><p>' + (subject.subtitle ? Q.esc(subject.subtitle) : 'Quizzes &amp; study notes') + '</p>';
  return true;
}

function renderQuizzes() {
  const list = subject.quizzes;
  if (!list.length) {
    $('panel-quizzes').innerHTML =
      '<div class="empty"><span class="tile">' + Q.icon('help') + '</span><b>No quizzes yet</b>' +
      '<span>Quizzes for ' + subject.name + ' will appear here.</span></div>';
    return;
  }
  $('panel-quizzes').innerHTML = '<div class="quiz-list">' + list.map(item =>
    '<a class="quiz-row" href="quiz-player.html?quiz=' + encodeURIComponent(item.id) + '">' +
      '<span class="go">' + Q.icon('play', 'ic-fill') + '</span>' +
      '<span class="quiz-body"><b dir="auto">' + Q.esc(item.title) + '</b>' + (item.desc ? '<span dir="auto">' + Q.esc(item.desc) + '</span>' : '') + '</span>' +
      (item.q ? '<span class="question-count">' + item.q + ' Qs</span>' : '') +
    '</a>').join('') + '</div>';
}

function renderNotes() {
  const items = subject.notes || [];
  const box = $('panel-notes');
  box.innerHTML = '<ul class="note-list">' + (items.length
    ? items.map(n => '<li class="note"><span dir="auto">' + Q.esc(n) + '</span></li>').join('')
    : '<li class="note is-placeholder"><span>Notes for ' + Q.esc(subject.name) + ' will appear here — one point per box.</span></li>') + '</ul>';
  box.querySelectorAll('[dir="auto"]').forEach(el => Q.lang.mark(el));
}

if (renderHead()) {
  renderQuizzes(); renderNotes();
  $('panel-quizzes').querySelectorAll('[dir="auto"]').forEach(el => Q.lang.mark(el));

  const panels = ['quizzes', 'notes'];
  const tabs = Q.seg($('subject-tabs'), i => show(i));
  function show(i, fromHash) {
    panels.forEach((p, j) => { const el = $('panel-' + p); el.hidden = j !== i; if (j === i) { el.classList.remove('view-in'); void el.offsetWidth; el.classList.add('view-in'); } });
    if (history.replaceState) history.replaceState(null, '', location.pathname + location.search + (i ? '#notes' : ''));
  }
  const start = location.hash === '#notes' ? 1 : 0;
  tabs.select(start, false, true); show(start);
}
</script>
