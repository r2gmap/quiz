    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html {
            background-color: #0f101b !important; 
            scroll-behavior: smooth; 
        }
        /* ── Variables ── */
        :root {
            --bg-gradient-1: #050505;
            --bg-gradient-2: #17181a;
            --bg-gradient-3: #070818;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #b9bfc7;
            --accent-color: #0adaf1c7;
            --accent-solid: #0adaf1;
            --hover-bg: rgba(255, 255, 255, 0.04);
            --hover-border: rgba(0, 229, 255, 0.35);
            --hover-shadow: rgba(0, 229, 255, 0.12);
            --paper-color: rgba(255, 255, 255, 0.18);
        }

        .light-mode {
            --bg-gradient-1: #f4f6f9;
            --bg-gradient-2: #e9ecef;
            --bg-gradient-3: #f1f3f5;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.05);
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-color: #4299e1;
            --accent-solid: #4299e1;
            --hover-bg: rgba(255, 255, 255, 1);
            --hover-border: rgba(66, 153, 225, 0.4);
            --hover-shadow: rgba(66, 153, 225, 0.1);
            --paper-color: rgba(54, 52, 52, 0.35);
        }

        /* ── Reset ── */
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: #0f101b !important;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        ::-webkit-scrollbar { display: none; }

        /* ── Background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-size: 200% 200%;
            animation: gradientMove 20s ease infinite;
            z-index: -2;
            transition: background 0.5s ease;
        }

        body {
            color: var(--text-main);
            transition: color 0.4s ease;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 60px;
        }

        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── Falling paper ── */
        .falling-paper {
            position: fixed;
            width: 10px; height: 14px;
            background: var(--paper-color);
            z-index: 0;
            pointer-events: none;
            border-radius: 2px;
            animation: fall linear infinite;
            will-change: transform;
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(50px); opacity: 0; }
        }

        /* ── Layout ── */
        .main-container {
            width: 100%;
            max-width: 860px;
            padding: 0 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* ── Top Nav ── */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 16px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            padding: 9px 18px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            transition: color 0.25s ease, border-color 0.25s ease,
                        background 0.25s ease, box-shadow 0.25s ease;
            letter-spacing: 0.2px;
        }

        .back-btn i { font-size: 0.82rem; }

        .back-btn:hover {
            color: var(--accent-solid);
            border-color: var(--hover-border);
            background: rgba(10, 218, 241, 0.04);
            box-shadow: 0 0 14px var(--hover-shadow);
        }

        #theme-toggle {
            background: transparent;
            color: white;
            border: 1px solid var(--card-border);
            width: 42px; height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.25s ease, border-color 0.25s ease,
                        background 0.25s ease, box-shadow 0.25s ease;
        }

        #theme-toggle:hover {
            color: var(--accent-solid);
            border-color: var(--hover-border);
            background: var(--card-bg);
            box-shadow: 0 0 12px var(--hover-shadow);
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin: 28px 0 44px;
        }

        /* Icon ring glow */
        .icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px; height: 90px;
            margin-bottom: 20px;
        }

        .icon-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(10, 218, 241, 0.14) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            border: 1px solid rgba(10, 218, 241, 0.2);
            animation: rotateBorder 8s linear infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1);   opacity: 0.8; }
            50%       { transform: scale(1.12); opacity: 1;   }
        }

        @keyframes rotateBorder {
            to { transform: rotate(360deg); }
        }

        .subject-icon {
            font-size: 2.8rem;
            color: var(--accent-solid);
            filter: drop-shadow(0 0 12px rgba(10, 218, 241, 0.4));
            z-index: 1;
            position: relative;
        }

        .light-mode .subject-icon {
            filter: drop-shadow(0 0 8px rgba(66, 153, 225, 0.3));
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }

        .subject-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* ── Section label ── */
        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--card-border);
            border-radius: 2px;
        }

        /* ── Quiz / Item list ── */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 60px;
        }

        /* ── Base card ── */
        .item-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 18px 22px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.25s ease,
                        background 0.25s ease,
                        box-shadow 0.25s ease;
            overflow: hidden;
            will-change: transform;
        }

        /* Left accent stripe */
        .item-card::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 3px;
            height: 60%;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, var(--accent-solid), transparent);
            transition: transform 0.28s ease;
        }

        .item-card:hover::before,
        .item-card:focus-within::before {
            transform: translateY(-50%) scaleY(1);
        }

        .quiz-item { cursor: pointer; }

        .item-card:hover {
            transform: translateX(2px);
            background: var(--hover-bg);
            border-color: var(--hover-border);
            box-shadow: 0 8px 28px var(--hover-shadow),
                        inset 0 0 0 1px rgba(10, 218, 241, 0.04);
        }

        .quiz-item:active { transform: translateX(2px) scale(0.99); transition-duration: 0.1s; }

        /* ── Item info (left side) ── */
        .item-info { flex: 1; min-width: 0; }

        .item-info h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.25s ease;
        }

        .item-card:hover .item-info h3 { color: var(--accent-solid); }

        .item-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Quiz right side ── */
        .quiz-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .question-count {
            background: rgba(10, 218, 241, 0.08);
            color: var(--accent-solid);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 50px;
            border: 1px solid rgba(10, 218, 241, 0.18);
            letter-spacing: 0.3px;
            white-space: nowrap;
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        .item-card:hover .question-count {
            background: rgba(10, 218, 241, 0.14);
            box-shadow: 0 0 10px rgba(10, 218, 241, 0.12);
        }

        .light-mode .question-count {
            background: rgba(66, 153, 225, 0.08);
            color: var(--accent-solid);
            border-color: rgba(66, 153, 225, 0.2);
        }

        /* Play button */
        .play-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: rgba(10, 218, 241, 0.08);
            border: 1px solid rgba(10, 218, 241, 0.18);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-solid);
            font-size: 0.85rem;
            transition: background 0.25s ease, box-shadow 0.25s ease,
                        transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.25s ease;
            flex-shrink: 0;
        }

        .item-card:hover .play-btn {
            background: var(--accent-solid);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 18px rgba(10, 218, 241, 0.35);
            transform: scale(1.12);
        }

        .light-mode .play-btn {
            background: rgba(66, 153, 225, 0.08);
            border-color: rgba(66, 153, 225, 0.2);
            color: var(--accent-solid);
        }

        .light-mode .item-card:hover .play-btn {
            background: var(--accent-solid);
            color: #fff;
        }

        /* ── PDF right side ── */
        .pdf-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-view, .btn-download {
            padding: 7px 14px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .btn-view {
            background: transparent;
            color: var(--accent-solid);
            border: 1px solid rgba(10, 218, 241, 0.3);
        }

        .btn-view:hover {
            background: rgba(10, 218, 241, 0.1);
            border-color: var(--accent-solid);
            box-shadow: 0 0 10px var(--hover-shadow);
        }

        .btn-download {
            background: linear-gradient(135deg, rgba(10,218,241,0.85), rgba(58,123,213,0.85));
            color: #000;
            border: none;
            font-weight: 700;
        }

        .btn-download:hover {
            box-shadow: 0 4px 16px rgba(10, 218, 241, 0.35);
            transform: translateY(-1px);
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text-main); }
        .empty-state p  { font-size: 0.9rem; }

        /* ════════════════════════════════════════════════════════
           GAMES GRID — شبكة الألعاب، عمودين دايمًا في كل الشاشات
        ════════════════════════════════════════════════════════ */
        .games-grid {
            /* عمودين ثابتين بغض النظر عن حجم الشاشة */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 60px;
        }

        /* كارت اللعبة — بوستر فقط بدون أي نص */
        .game-card {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            /* لا aspect-ratio — الارتفاع يتحدد تلقائياً من الصورة */
            transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.25s ease,
                        box-shadow 0.25s ease;
            will-change: transform;
        }

        /* الصورة تملأ العرض كاملاً والارتفاع يتمدد بشكل طبيعي */
        .game-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.38s ease;
            pointer-events: none;
        }

        .game-card:hover {
            transform: translateY(-4px) scale(1.025);
            border-color: var(--hover-border);
            box-shadow: 0 16px 36px var(--hover-shadow),
                        0 0 0 1px var(--hover-border);
        }

        /* زووم خفيف على الصورة عند hover */
        .game-card:hover img {
            transform: scale(1.06);
        }

        .game-card:active {
            transform: scale(0.97);
            transition-duration: 0.1s;
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            html { background-color: #0f101b !important; }

            h1 { font-size: 1.8rem; }

            .icon-wrapper { width: 76px; height: 76px; }
            .subject-icon { font-size: 2.2rem; }

            header { margin: 20px 0 32px; }

            .item-card {
                padding: 16px 16px;
                border-radius: 16px;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            .item-card:hover { transform: none; }
            .item-card:active {
                transform: scale(0.98);
                background: var(--hover-bg);
                border-color: var(--hover-border);
            }

            /* PDF cards: stack on mobile */
            .item-card.pdf-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .pdf-actions {
                width: 100%;
            }

            .btn-view, .btn-download {
                flex: 1;
                justify-content: center;
            }

            .question-count { font-size: 0.7rem; padding: 3px 10px; }
            .play-btn { width: 34px; height: 34px; font-size: 0.8rem; }

            /* games-grid يبقى عمودين على الموبايل أيضًا لكن gap أصغر */
            .games-grid { gap: 12px; }
            .game-card  { border-radius: 14px; }
        }


        /* ── Chat Widget ── */
#chat-widget {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 11000; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; 
}


#chat-bubble {
  width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, #0adaf1cc, #3a7bd5);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; color: #fff;
  box-shadow: 0 6px 24px rgba(10,218,241,0.4), 0 2px 8px rgba(0,0,0,0.3);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
  will-change: transform;
}
#chat-bubble:hover { transform: scale(1.08); box-shadow: 0 8px 32px rgba(10,218,241,0.55), 0 2px 8px rgba(0,0,0,0.3); }
#chat-bubble:active { transform: scale(0.94); transition-duration: 0.1s; }

/* Pulse ring on bubble */
#chat-bubble::after {
  content: '';
  position: absolute;
  width: 56px; height: 56px; border-radius: 50%;
  border: 2px solid rgba(10,218,241,0.2);
  animation: bubblePing 3.5s ease-out infinite;
  pointer-events: none;
}
@keyframes bubblePing {
  0%   { transform: scale(1); opacity: 0.35; }
  100% { transform: scale(1.55); opacity: 0; }
}

#chat-panel {
  width: 320px;
  background: #0e0f1c;
  border: 1px solid rgba(10,218,241,0.15); border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(10,218,241,0.05);
  display: none; flex-direction: column; overflow: hidden;
  transform-origin: bottom right;
  transform: scale(0.82) translateY(12px);
  opacity: 0; pointer-events: none;
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
  will-change: transform, opacity;
}
#chat-panel.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all;display: flex; }

#chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(10,218,241,0.1), rgba(58,123,213,0.08));
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
#chat-header-info { display: flex; align-items: center; gap: 10px; }
#chat-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, #0adaf1cc, #3a7bd5);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; color: #fff; flex-shrink: 0;
}
#chat-name { font-size: 0.92rem; font-weight: 600; color: #f8fafc; line-height: 1.2; }
#chat-status { font-size: 0.72rem; color: #94a3b8; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
#chat-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #10b981; display: inline-block;
  animation: chatPulse 2s ease-in-out infinite;
}
@keyframes chatPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.8); } }

#chat-close-x {
  background: transparent; border: none; color: #94a3b8;
  font-size: 0.95rem; cursor: pointer; padding: 6px; border-radius: 6px;
  transition: color 0.2s, background 0.2s; flex-shrink: 0;
}
#chat-close-x:hover { color: #f8fafc; background: rgba(255,255,255,0.06); }

#chat-messages {
  padding: 16px 14px 10px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 120px; max-height: 230px; overflow-y: auto; scrollbar-width: none;
}
#chat-messages::-webkit-scrollbar { display: none; }

.chat-msg { display: flex; animation: msgIn 0.3s ease; }
@keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.chat-msg.bot  { justify-content: flex-start; }
.chat-msg.user { justify-content: flex-end; }

.chat-bubble-msg {
  max-width: 84%; padding: 10px 14px; font-size: 0.83rem; line-height: 1.55; word-break: break-word;
}
.chat-msg.bot  .chat-bubble-msg {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07);
  color: #e2e8f0; border-radius: 4px 16px 16px 16px;
}
.chat-msg.user .chat-bubble-msg {
  background: linear-gradient(135deg, rgba(10,218,241,0.18), rgba(58,123,213,0.18));
  border: 1px solid rgba(10,218,241,0.22);
  color: #f8fafc; border-radius: 16px 4px 16px 16px;
}

.typing-dots { display: flex; gap: 4px; align-items: center; padding: 2px 0; }
.typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; animation: typingBounce 1.2s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-5px); } }

#chat-input-row {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px 14px;
  border-top: 1px solid rgba(255,255,255,0.05);
}
#chat-input {
  flex: 1; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  padding: 10px 12px; font-family: 'Poppins', sans-serif;
  font-size: 0.83rem; color: #f8fafc; resize: none; outline: none;
  line-height: 1.5; max-height: 90px; overflow-y: auto; scrollbar-width: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
#chat-input::-webkit-scrollbar { display: none; }
#chat-input::placeholder { color: #3d4f62; }
#chat-input:focus { border-color: rgba(10,218,241,0.3); box-shadow: 0 0 0 3px rgba(10,218,241,0.06); }

#chat-send-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, #0adaf1cc, #3a7bd5);
  border: none; color: #fff; font-size: 0.85rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}
#chat-send-btn:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(10,218,241,0.4); }
#chat-send-btn:active { transform: scale(0.92); }
#chat-send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

/* light-mode chat */
.light-mode #chat-panel { background: #fff; border-color: rgba(66,153,225,0.2); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.light-mode #chat-header { background: linear-gradient(135deg,rgba(66,153,225,0.08),rgba(58,123,213,0.06)); border-bottom-color: rgba(0,0,0,0.06); }
.light-mode #chat-name { color: #2d3748; }
.light-mode #chat-status { color: #718096; }
.light-mode #chat-close-x { color: #718096; }
.light-mode #chat-close-x:hover { color: #2d3748; background: rgba(0,0,0,0.05); }
.light-mode .chat-msg.bot .chat-bubble-msg { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.07); color: #2d3748; }
.light-mode .chat-msg.user .chat-bubble-msg { background: rgba(66,153,225,0.12); border-color: rgba(66,153,225,0.22); color: #2d3748; }
.light-mode #chat-input { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.09); color: #2d3748; }
.light-mode #chat-input::placeholder { color: #a0aec0; }

/* ── Mobile ── */
@media (max-width: 650px) {
  h1 { font-size: 2.8rem; }
  header { margin: 20px 0 30px 0; }

  .card-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 4px; }
  .card { width: 100%; padding: 24px 14px 20px; border-radius: 18px; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .card::before, .card::after { display: none; }

}

@media (prefers-reduced-motion: reduce) {

    <script>
        // 1. Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeToggle.querySelector('i').className =
                document.body.classList.contains('light-mode') ? 'fas fa-moon' : 'fas fa-sun';
        });

        // 2. Falling papers (all devices — throttled)
        const isMobile = window.innerWidth <= 600;
        const maxPapers = isMobile ? 8 : 15;
        const paperInterval = isMobile ? 900 : 600;
        let paperCount = 0;
        function createPaper() {
            if (paperCount >= maxPapers) return;
            paperCount++;
            const paper = document.createElement('div');
            paper.className = 'falling-paper';
            paper.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 8 + 8;
            paper.style.animationDuration = duration + 's';
            document.body.appendChild(paper);
            setTimeout(() => { paper.remove(); paperCount--; }, duration * 1000);
        }
        setInterval(createPaper, paperInterval);

        // 3. Data & render
        const subjectsData = {

            // ══════════════════════════════════════════════════════════════
            // GAMES — كل لعبة بتاخد: title (للـ alt), poster (مسار الصورة),
            //         url (ملف HTML الخاص باللعبة)
            // لإضافة لعبة جديدة: زيد object جديد في مصفوفة games
            // ══════════════════════════════════════════════════════════════
            sums: {
                title: "Games",
                subtitle: "",
                icon: "fas fa-gamepad",
                isGamesMode: true,

                    { id: "org4", title: "Quiz IV", desc: "Aromatic Carboxylic Acids, Sulfa Drugs & Saccharin", q: 12 },
                    { id: "org5", title: "Quiz V", desc: "Aldehydes & Ketones", q: 30 },

            },
            analytical: {

                quizzes: [

                    { id: "ana00", title: "Compilation Quiz 2", desc: "", q: 20 },
                    { id: "ana0", title: "True & False", desc: "All Important True/False Questions", q: 29 },
                    { id: "ana1", title: "Scientific Terms", desc: "", q: 17 },
                    { id: "ana2", title: "Main Topics", desc: "", q: 20 },
                    { id: "ana3", title: "Biphasic T : Indirect T", desc: "", q:39 },
                    { id: "ana4", title: "Intro : Indicator", desc: "", q: 29 },
                    { id: "ana5", title: "Indicator & Titration Curve", desc: "", q: 15 },
                    { id: "ana6", title: "Buffer Solution", desc: "", q: 12 },
                    { id: "ana7", title: "Theories & PH", desc: "", q: 12 },
                    { id: "ana8", title: "Types Of Anlaysis", desc: "", q: 15 },
                ]
            },
            pharmacognosy: {
                title: "Pharmacognosy",
                subtitle: "",
                icon: "fas fa-leaf",
                quizzes: [
                    { id: "pha1", title: "Quiz I", desc: "V.O Subterranean GP", q: 32 },
                    { id: "pha2", title: "Quiz II", desc: "Glycoside Subterranean GP", q: 32 },

                    { id: "pha5", title: "Quiz V", desc: "Rest Of Subterranean GPs", q: 29 },

                ]
            },

                    { id: "it1", title: "Q.Bank I", desc: "Question Bank 1", q: 62 },
                ]
            },
            physical: {
                title: "Physical Pharmacy",
                subtitle: "",

                quizzes: [
                ]
            },
            anatomy: {
                title: "Anatomy & Histology",
                subtitle: "",
                icon: "fas fa-dna",
                quizzes: [
                    { id: "his1", title: "Anatomy Q Bank", desc: "Very Important 🚨", q: 43 },
                ]
            },
            english: {
                title: "English II",
                subtitle: "",
                icon: "fas fa-spell-check",
                quizzes: [
                    { id: "eng1", title: "Quiz I", desc: "General Idioms", q: 50 },
                    { id: "eng2", title: "Quiz II", desc: "Prepositions & Phrasal Verbs", q: 40 },
                    { id: "eng3", title: "Quiz III", desc: "Phobias and Fear Vocabulary", q: 45 },
                    { id: "eng4", title: "Quiz IV", desc: "Stress & Problem Handling", q: 35 },
                    { id: "eng5", title: "Quiz V", desc: "Mood & Daily Idioms", q: 40 },
                    { id: "eng6", title: "Quiz VI", desc: "", q: 100 },
                    { id: "eng7", title: "Quiz VII", desc: "", q: 100 },
                ]
            }
        };

        // Extract ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentSubjectId = urlParams.get('id');

        const titleEl    = document.getElementById('subject-title');
        const subtitleEl = document.getElementById('subject-subtitle');
        const iconEl     = document.getElementById('subject-icon');
        const container  = document.getElementById('quiz-container');

        if (currentSubjectId && subjectsData[currentSubjectId]) {
            const subject = subjectsData[currentSubjectId];

            titleEl.textContent    = subject.title;
            subtitleEl.textContent = subject.subtitle || '';
            iconEl.className       = `subject-icon ${subject.icon}`;
            document.title         = `${subject.title} — Quizzes`;

            // ── GAMES MODE ──────────────────────────────────────────────
            // لما يكون isGamesMode: true يرسم شبكة بوسترات بدون أي نص
            if (subject.isGamesMode) {

                // غيّر class الـ container لشبكة الألعاب
                container.className = 'games-grid';

                const label = document.createElement('div');
                label.className   = 'section-label';
                label.textContent = 'Games';
                // نضع الـ label قبل الـ container في DOM
                container.parentNode.insertBefore(label, container);

                subject.games.forEach(game => {
                    // كارت اللعبة — صورة فقط، الضغط يفتح ملف HTML اللعبة
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', game.title);

                    const img = document.createElement('img');
                    img.src   = game.poster;
                    img.alt   = game.title;
                    img.loading = 'lazy'; // تحميل كسول لتحسين الأداء

                    card.appendChild(img);
                    card.addEventListener('click', () => {
                        location.href = game.url;
                    });

                    container.appendChild(card);
                });

            // ── PDF / QUIZ MODE (الكود الأصلي بدون تعديل) ──────────────
            } else {
                const items = subject.isPdfMode ? subject.files : subject.quizzes;

                if (items && items.length > 0) {
                    const label = document.createElement('div');
                    label.className   = 'section-label';
                    label.textContent = subject.isPdfMode ? 'Summaries' : ' Quizzes';
                    container.appendChild(label);

                    items.forEach(item => {
                        if (subject.isPdfMode) {
                            const card = document.createElement('div');
                            card.className = 'item-card pdf-card';
                            card.innerHTML = `
                                <div class="item-info">
                                    <h3>${item.title}</h3>
                                    ${item.desc ? `<p>${item.desc}</p>` : ''}
                                </div>
                                <div class="pdf-actions">
                                    <a href="${item.url}" target="_blank" class="btn-view">
                                        <i class="fas fa-eye"></i> View
                                    </a>
                                    <a href="${item.url}" download class="btn-download">
                                        <i class="fas fa-download"></i> Download
                                    </a>
                                </div>
                            `;
                            container.appendChild(card);
                        } else {
                            const card = document.createElement('div');
                            card.className = 'item-card quiz-item';
                            card.innerHTML = `
                                <div class="item-info">
                                    <h3>${item.title}</h3>
                                    ${item.desc ? `<p>${item.desc}</p>` : ''}
                                </div>
                                <div class="quiz-meta">
                                    <span class="question-count">${item.q} Qs</span>
                                    <div class="play-btn">
                                        <i class="fas fa-play"></i>
                                    </div>
                                </div>
                            `;
                            card.addEventListener('click', () => {
                                location.href = `quiz-player.html?quiz=${item.id}`;
                            });
                            container.appendChild(card);
                        }
                    });
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>Coming Soon</h3>
                            <p>No content available yet — check back later.</p>
                        </div>`;
                }
            }

        } else {
            titleEl.textContent = "Not Found";
            iconEl.className    = "subject-icon fas fa-exclamation-triangle";
            container.innerHTML = `
                <div class="empty-state">
                    <p>Please select a valid subject from the home page.</p>
                </div>`;
        }

        // ── Chat Widget ──
(function () {
  const BOT_TOKEN = '8553775824:AAF3GClTP9ldHvdf5Pvx1ozRAdbOQXpir9w';
  const CHAT_ID   = '8408968285';
  const API_URL   = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';

  const bubble   = document.getElementById('chat-bubble');
  const panel    = document.getElementById('chat-panel');
  const closeX   = document.getElementById('chat-close-x');
  const input    = document.getElementById('chat-input');
  const sendBtn  = document.getElementById('chat-send-btn');
  const messages = document.getElementById('chat-messages');
  let isOpen = false;

  function togglePanel() {
    isOpen = !isOpen;
    panel.classList.toggle('open', isOpen);
    if (isOpen) setTimeout(() => input.focus(), 350);
  }

  bubble.addEventListener('click', togglePanel);
  closeX.addEventListener('click', () => { isOpen = false; panel.classList.remove('open'); });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 90) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  sendBtn.addEventListener('click', sendMsg);

  function addMsg(text, type) {
    const row = document.createElement('div');
    row.className = 'chat-msg ' + type;
    const bub = document.createElement('div');
    bub.className = 'chat-bubble-msg';
    bub.textContent = text;
    row.appendChild(bub);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'chat-msg bot';
    row.innerHTML = '<div class="chat-bubble-msg"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function sendMsg() {
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    const typing = addTyping();
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: '💬 Quizzes Website Message:\n\n' + text })
    })
    .then(() => {
      typing.remove();
      addMsg("Got It! We'll Look On Your Message ASAP ⌛", 'bot');
    })
    .catch(() => {
      typing.remove();
      addMsg("Couldn't send — please try again.", 'bot');
    })
    .finally(() => { sendBtn.disabled = false; });
  }
})();

    </script>
