<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Quizzes </title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient-1: #050505;
            --bg-gradient-2: #17181a;
            --bg-gradient-3: #070818;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #0adaf1c7;
            --hover-bg: rgba(255, 255, 255, 0.04);
            --hover-border: rgba(0, 229, 255, 0.4);
            --hover-shadow: rgba(0, 229, 255, 0.15);
            --paper-color: rgba(255, 255, 255, 0.192);
        }

        .light-mode {
            --bg-gradient-1: #f4f6f9;
            --bg-gradient-2: #e9ecef;
            --bg-gradient-3: #f1f3f5;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.05);
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-color: #4299e1;
            --hover-bg: rgba(255, 255, 255, 1);
            --hover-border: rgba(66, 153, 225, 0.4);
            --hover-shadow: rgba(66, 153, 225, 0.1);
            --paper-color: rgba(54, 52, 52, 0.452);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(180deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-size: 200% 200%;
            animation: gradientMove 20s ease infinite;
            z-index: -2;
            transition: background 0.5s ease;
        }
           html {
            background-color: #0f101b !important; /* لون أسود صريح للمتصفح نفسه */
            scroll-behavior: smooth; 
        }

        body {
            scroll-behavior: smooth; 
            color: var(--text-main);
            transition: color 0.5s ease;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent; 
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .falling-paper {
            position: fixed;
            width: 10px;
            height: 14px;
            background: var(--paper-color);
            z-index: 0;
            pointer-events: none;
            border-radius: 2px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(50px); opacity: 0; }
        }

        .main-container {
            width: 100%;
            max-width: 900px; 
            padding: 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            background: var(--card-bg);
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            touch-action: manipulation;
        }

        .back-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--hover-shadow);
        }

        #theme-toggle {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            touch-action: manipulation;
            color: white;
        }

        #theme-toggle:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
            background: var(--card-bg);
            box-shadow: 0 0 10px var(--hover-shadow);
        }

        header {
            text-align: center;
            margin: 20px 0 40px 0;
        }

        .subject-icon {
            font-size: 3.5rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--hover-shadow);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        /* تنسيق قائمة الكويزات والملفات */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 60px;
        }

        .item-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            padding: 20px 25px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            touch-action: manipulation;
        }

        .quiz-item { cursor: pointer; }
        .quiz-item:active { transform: scale(0.98); }
        .item-card:hover {
            transform: translateZ(10px); 
            background: var(--hover-bg);
            border-color: var(--hover-border);
            box-shadow: 0 8px 20px var(--hover-shadow);
        }

        .item-info h3 {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .item-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .quiz-meta {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .question-count {
            background: rgba(10, 218, 241, 0.1);
            color: var(--accent-color);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
        }

        .play-icon {
            font-size: 1.5rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .quiz-item:hover .play-icon {
            color: var(--accent-color);
            transform: scale(1.2);
        }

        /* تنسيقات أزرار الـ PDF (View / Download) */
        .pdf-actions {
            display: flex;
            gap: 10px;
        }

        .btn-view, .btn-download {
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .btn-view {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-view:hover {
            background: rgba(10, 218, 241, 0.1);
        }

        .btn-download {
            background: var(--accent-color);
            color: #000;
            border: 1px solid var(--accent-color);
        }

        .btn-download:hover {
            box-shadow: 0 0 12px var(--accent-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
        html {
            background-color: #0f101b !important; 
            scroll-behavior: smooth; 
        }
            h1 { font-size: 2rem; }
            .subject-icon { font-size: 2.5rem; }
            .item-card { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 15px; 
                backdrop-filter: none; 
                -webkit-backdrop-filter: none;
                background: var(--bg-gradient-2);
            }
            .quiz-meta, .pdf-actions { 
                width: 100%; 
                justify-content: space-between; 
            }
            .btn-view, .btn-download {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <nav class="top-nav">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <button id="theme-toggle" title="Switch Theme"><i class="fas fa-sun"></i></button>
        </nav>

        <header>
            <i class="subject-icon fas fa-book" id="subject-icon"></i>
            <h1 id="subject-title">Loading...</h1>
        </header>

        <main class="quiz-list" id="quiz-container">
            </main>
    </div>

    <script>
        // 1. نظام تبديل الوضع (ليلي / فاتح)
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const icon = themeToggle.querySelector('i');
            icon.className = document.body.classList.contains('light-mode') ? 'fas fa-moon' : 'fas fa-sun';
        });

        // 2. نظام أنميشن الأوراق
        function createPaper() {
            const paper = document.createElement('div');
            paper.className = 'falling-paper';
            paper.style.left = Math.random() * 100 + 'vw';
            const duration = (Math.random() * 8 + 8); 
            paper.style.animationDuration = duration + 's';
            document.body.appendChild(paper);
            setTimeout(() => { paper.remove(); }, duration * 1000);
        }
        setInterval(createPaper, 500);

        // ==========================================
        // 3. المحرك الذكي للصفحة (The Logic)
        // ==========================================

        const subjectsData = {
            // === قسم التلخيصات والملفات (ميزة الـ PDF) ===
            sums: {
                title: "Sums & Notes",
                icon: "fa-regular fa-note-sticky",
                isPdfMode: true, // هذه الخاصية تحدد أن هذا القسم للملفات وليس الكويزات
                files: [
                    // { 
                    //     title: "Organic II - Collection", 
                    //     desc: "The Revision Record", 
                    //     url: "collection.pdf" 
                    // },
                    
                    // { 
                    //     title: "Organic II - Flash", 
                    //     desc: "Important Equations & Fast Notes", 
                    //     url: "flashcards.pdf" 
                    // },
                    // { 
                    //     title: "Organic II - All", 
                    //     desc: "Important & Fast", 
                    //     url: "summary.pdf" 
                    // },
                    
                    // { 
                    //     title: "Organic II", 
                    //     desc: "Summarize Part 1", 
                    //     url: "Aromaticity_Blueprints.pdf" 
                    // },
                    // {
                    //     title: "Organic II", 
                    //     desc: "Summarize Part 2", 
                    //     url: "Aromatic_Substitution_Decoded.pdf" 
                    // },
                  
                    // { 
                    //     title: "IT", 
                    //     desc: "Summary Of All Midterm Content", 
                    //     url: "it-sum.pdf" 
                    // },
                    
                    { 
                        title: "Analytical II - PH", 
                        desc: "Summary And Collection Of PH Laws", 
                        url: "ph-laws.pdf" 
                    },
                    
                    { 
                        title: "Pharmacogonsy - Mind-map", 
                        desc: "", 
                        url: "mind-map.pdf" 
                    },
                    
                    { 
                        title: "Histology", 
                        desc: "Epithelium And Connective Tissue Summarize", 
                        url: "Epithelium_and_Connective_Tissue.pdf" 
                    },
                    
                    { 
                        title: "pharmacognosy", 
                        desc: "", 
                        url: "cogno.pdf" 
                    },

                    
                    { 
                        title: "Histology-Remastered", 
                        desc: "", 
                        url: "Tissues.pdf" 
                    },
                    
                    
                    
                    { 
                        title: "Histology", 
                        desc: "Revision-Midterm Content", 
                        url: "Pharm_Revision_Skin_GIT_Muscle.pdf" 
                    },
                    
                    // { 
                    //     title: "Analytical II - Titration Laws", 
                    //     desc: "All formulas and buffer capacity notes.", 
                    //     url: "assets/pdfs/analytical_rules.pdf" 
                    // },
                ]
            },

            // === باقي أقسام المواد (الكويزات العادية) ===
            organic: {
                title: "Organic II",
                icon: "fas fa-flask",
                quizzes: [
                    // { id: "org0", title: "Remastered Quiz", desc: "Collection Of All Ideas In 1st 5 Lecs", q: 17 },
                    // { id: "org1", title: "Quiz I", desc: "Level: Easy", q: 10 },
                    // { id: "org2", title: "Quiz II", desc: "Level: Easy", q: 15 },
                    // { id: "org3", title: "Quiz III", desc: "Level: Slightly Hard", q: 15 },
                    // { id: "org4", title: "Quiz IV", desc: "Level: Hard", q: 10 },
                ]
            },
            analytical: {
                title: "Analytical II",
                icon: "fas fa-microscope",
                quizzes: [
                    { id: "ana0", title: "Analytical - Important", desc: "Collection Of Examples Of The PDF", q: 15 },
                    { id: "ana1", title: "Analytical Online Quiz 1", desc: "Quiz 1 Online", q: 10 },
                    { id: "ana2", title: "Analytical Online Quiz 2", desc: "Quiz 2 Online", q: 10 },
                    { id: "ana3", title: "Quiz I", desc: "Level : Normal", q: 10 },
                    { id: "ana4", title: "Quiz II", desc: "Level : Normal", q: 10 },
                    { id: "ana5", title: "Quiz III", desc: "Level : Normal", q: 20 },
                ]
            },
            pharmacognosy: {
                title: "Pharmacognosy",
                icon: "fas fa-leaf",
                quizzes: [
                    { id: "pha1", title: "Quiz I", desc: "Active Constituents", q: 10 },
                    { id: "pha2", title: "Quiz II", desc: "Action & Uses", q: 10 },

                ]
            },
            it:{
                title:"IT",
                icon:"fas fa-desktop",
                quizzes: [

            },
            physical: {

                    {id: "phy1", title:"Quiz I", desc:"Level: Easy", q:15},
                    {id: "phy2", title:"Quiz II", desc:"Level: Easy", q:10},
                    {id: "phy3", title:"Quiz III", desc:"Level: Normal", q:10},

                    {id: "phy5", title:"Quiz V", desc:" Hard", q:10},
                ]
            },
            anatomy:{
                title:"Anatomy & Histology",
                icon:"fas fa-dna",
                quizzes:[
                    {id:"his1", title:"Quiz I", desc:"Level: Easy", q:10},
                    {id:"his2", title:"Quiz II", desc:"Level: Easy", q:10},
                    {id:"his3", title:"Quiz III", desc:"Level: Normal", q:15},

                    {id:"his5", title:"Quiz V", desc:"Level: Hard", q:10},
                ]
            }
        };

        // استخراج الـ ID
        const urlParams = new URLSearchParams(window.location.search);
        const currentSubjectId = urlParams.get('id');

        const titleElement = document.getElementById('subject-title');
        const iconElement = document.getElementById('subject-icon');
        const containerElement = document.getElementById('quiz-container');

        if (currentSubjectId && subjectsData[currentSubjectId]) {
            const subject = subjectsData[currentSubjectId];
            
            titleElement.textContent = subject.title;
            iconElement.className = `subject-icon ${subject.icon}`;
            document.title = `${subject.title} - Space`;

            // نحدد الداتا اللي هنعرضها (سواء مصفوفة files أو quizzes)
            const itemsList = subject.isPdfMode ? subject.files : subject.quizzes;

            if (itemsList && itemsList.length > 0) {
                itemsList.forEach(item => {
                    
                    // لو القسم عبارة عن ملفات (PDFs)
                    if (subject.isPdfMode) {
                        const pdfHTML = `
                            <div class="item-card">
                                <div class="item-info">
                                    <h3>${item.title}</h3>
                                    <p>${item.desc}</p>
                                </div>
                                <div class="pdf-actions">
                                    <a href="${item.url}" target="_blank" class="btn-view"><i class="fas fa-eye"></i> View</a>
                                    <a href="${item.url}" download class="btn-download"><i class="fas fa-download"></i> Download</a>
                                </div>
                            </div>
                        `;
                        containerElement.innerHTML += pdfHTML;
                    } 
                    // لو القسم عبارة عن كويزات (Quizzes)
                    else {
                        const quizHTML = `
                            <div class="item-card quiz-item" onclick="location.href='quiz-player.html?quiz=${item.id}'">
                                <div class="item-info">
                                    <h3>${item.title}</h3>
                                    <p>${item.desc}</p>
                                </div>
                                <div class="quiz-meta">
                                    <span class="question-count">${item.q} Qs</span>
                                    <i class="fas fa-play-circle play-icon"></i>
                                </div>
                            </div>
                        `;
                        containerElement.innerHTML += quizHTML;
                    }
                });
            } else {
                containerElement.innerHTML = `<div class="empty-state"><h3>Removed</h3><p>Go Back And Select A Valid Subject</p></div>`;
            }

        } else {
            // لو الرابط غلط
            titleElement.textContent = "Not Found";
            iconElement.className = "subject-icon fas fa-exclamation-triangle";
            containerElement.innerHTML = `<div class="empty-state"><p>Please select a valid subject from the home page.</p></div>`;
        }
    </script>
</body>
</html>
