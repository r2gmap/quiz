<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J25KFB0WDE"></script>

      function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quizzes</title>
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── Font Smoothing (To Fix Blurry Text) ── */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            background-color: #0f101b !important; 
            scroll-behavior: smooth; 
        }
        /* ── Variables ── */
        :root {
            --bg-gradient-1: #050505;
            --bg-gradient-2: #17181a;
            --bg-gradient-3: #070818;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #b9bfc7;
            --accent-color: #0adaf1c7;
            --accent-solid: #0adaf1;
            --hover-bg: rgba(255, 255, 255, 0.04);
            --hover-border: rgba(0, 229, 255, 0.35);
            --hover-shadow: rgba(0, 229, 255, 0.12);
            --paper-color: rgba(255, 255, 255, 0.18);
        }

        .light-mode {
            --bg-gradient-1: #f4f6f9;
            --bg-gradient-2: #e9ecef;
            --bg-gradient-3: #f1f3f5;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.05);
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-color: #4299e1;
            --accent-solid: #4299e1;
            --hover-bg: rgba(255, 255, 255, 1);
            --hover-border: rgba(66, 153, 225, 0.4);
            --hover-shadow: rgba(66, 153, 225, 0.1);
            --paper-color: rgba(54, 52, 52, 0.35);
        }

        /* ── Reset ── */
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: #0f101b !important;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        ::-webkit-scrollbar { display: none; }

        /* ── Background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-size: 200% 200%;
            animation: gradientMove 20s ease infinite;
            z-index: -2;
            transition: background 0.5s ease;
        }

        body {
            color: var(--text-main);
            transition: color 0.4s ease;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 60px;
        }

        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── Falling paper ── */
        .falling-paper {
            position: fixed;
            width: 10px; height: 14px;
            background: var(--paper-color);
            z-index: 0;
            pointer-events: none;
            border-radius: 2px;
            animation: fall linear infinite;
            will-change: transform;
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(50px); opacity: 0; }
        }

        /* ── Layout ── */
        .main-container {
            width: 100%;
            max-width: 860px;
            padding: 0 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* ── Top Nav ── */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 16px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            padding: 9px 18px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            transition: color 0.25s ease, border-color 0.25s ease,
                        background 0.25s ease, box-shadow 0.25s ease;
            letter-spacing: 0.2px;
        }

        .back-btn i { font-size: 0.82rem; }

        .back-btn:hover {
            color: var(--accent-solid);
            border-color: var(--hover-border);
            background: rgba(10, 218, 241, 0.04);
            box-shadow: 0 0 14px var(--hover-shadow);
        }

        #theme-toggle {
            background: transparent;
            color: white;
            border: 1px solid var(--card-border);
            width: 42px; height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.25s ease, border-color 0.25s ease,
                        background 0.25s ease, box-shadow 0.25s ease;
        }

        #theme-toggle:hover {
            color: var(--accent-solid);
            border-color: var(--hover-border);
            background: var(--card-bg);
            box-shadow: 0 0 12px var(--hover-shadow);
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin: 28px 0 44px;
        }

        /* Icon ring glow */
        .icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px; height: 90px;
            margin-bottom: 20px;
        }

        .icon-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(10, 218, 241, 0.14) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            border: 1px solid rgba(10, 218, 241, 0.2);
            animation: rotateBorder 8s linear infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1);   opacity: 0.8; }
            50%       { transform: scale(1.12); opacity: 1;   }
        }

        @keyframes rotateBorder {
            to { transform: rotate(360deg); }
        }

        .subject-icon {
            font-size: 2.8rem;
            color: var(--accent-solid);
            filter: drop-shadow(0 0 12px rgba(10, 218, 241, 0.4));
            z-index: 1;
            position: relative;
        }

        .light-mode .subject-icon {
            filter: drop-shadow(0 0 8px rgba(66, 153, 225, 0.3));
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }

        .subject-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* ── Section label ── */
        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--card-border);
            border-radius: 2px;
        }

        /* ── Quiz / Item list ── */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 60px;
        }

        /* ── Base card ── */
        .item-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 18px 22px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.25s ease,
                        background 0.25s ease,
                        box-shadow 0.25s ease;
            overflow: hidden;
            will-change: transform;
        }

        /* Left accent stripe */
        .item-card::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 3px;
            height: 60%;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, var(--accent-solid), transparent);
            transition: transform 0.28s ease;
        }

        .item-card:hover::before,
        .item-card:focus-within::before {
            transform: translateY(-50%) scaleY(1);
        }

        .quiz-item { cursor: pointer; }

        .item-card:hover {
            transform: translateX(2px);
            background: var(--hover-bg);
            border-color: var(--hover-border);
            box-shadow: 0 8px 28px var(--hover-shadow),
                        inset 0 0 0 1px rgba(10, 218, 241, 0.04);
        }

        .quiz-item:active { transform: translateX(2px) scale(0.99); transition-duration: 0.1s; }

        /* ── Item info (left side) ── */
        .item-info { flex: 1; min-width: 0; }

        .item-info h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.25s ease;
        }

        .item-card:hover .item-info h3 { color: var(--accent-solid); }

        .item-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Quiz right side ── */
        .quiz-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .question-count {
            background: rgba(10, 218, 241, 0.08);
            color: var(--accent-solid);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 50px;
            border: 1px solid rgba(10, 218, 241, 0.18);
            letter-spacing: 0.3px;
            white-space: nowrap;
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        .item-card:hover .question-count {
            background: rgba(10, 218, 241, 0.14);
            box-shadow: 0 0 10px rgba(10, 218, 241, 0.12);
        }

        .light-mode .question-count {
            background: rgba(66, 153, 225, 0.08);
            color: var(--accent-solid);
            border-color: rgba(66, 153, 225, 0.2);
        }

        /* Play button */
        .play-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: rgba(10, 218, 241, 0.08);
            border: 1px solid rgba(10, 218, 241, 0.18);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-solid);
            font-size: 0.85rem;
            transition: background 0.25s ease, box-shadow 0.25s ease,
                        transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.25s ease;
            flex-shrink: 0;
        }

        .item-card:hover .play-btn {
            background: var(--accent-solid);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 18px rgba(10, 218, 241, 0.35);
            transform: scale(1.12);
        }

        .light-mode .play-btn {
            background: rgba(66, 153, 225, 0.08);
            border-color: rgba(66, 153, 225, 0.2);
            color: var(--accent-solid);
        }

        .light-mode .item-card:hover .play-btn {
            background: var(--accent-solid);
            color: #fff;
        }

        /* ── PDF right side ── */
        .pdf-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-view, .btn-download {
            padding: 7px 14px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .btn-view {
            background: transparent;
            color: var(--accent-solid);
            border: 1px solid rgba(10, 218, 241, 0.3);
        }

        .btn-view:hover {
            background: rgba(10, 218, 241, 0.1);
            border-color: var(--accent-solid);
            box-shadow: 0 0 10px var(--hover-shadow);
        }

        .btn-download {
            background: linear-gradient(135deg, rgba(10,218,241,0.85), rgba(58,123,213,0.85));
            color: #000;
            border: none;
            font-weight: 700;
        }

        .btn-download:hover {
            box-shadow: 0 4px 16px rgba(10, 218, 241, 0.35);
            transform: translateY(-1px);
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text-main); }
        .empty-state p  { font-size: 0.9rem; }

        /* ════════════════════════════════════════════════════════
           GAMES GRID
        ════════════════════════════════════════════════════════ */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 60px;
        }

        .game-card {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.25s ease,
                        box-shadow 0.25s ease;
            will-change: transform;
        }

        .game-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.38s ease;
            pointer-events: none;
        }

        .game-card:hover {
            transform: translateY(-4px) scale(1.025);
            border-color: var(--hover-border);
            box-shadow: 0 16px 36px var(--hover-shadow),
                        0 0 0 1px var(--hover-border);
        }

        .game-card:hover img {
            transform: scale(1.06);
        }

        .game-card:active {
            transform: scale(0.97);
            transition-duration: 0.1s;
        }

        /* ── Mobile for Subject Content ── */
        @media (max-width: 600px) {
            html { background-color: #0f101b !important; }

            h1 { font-size: 1.8rem; }

            .icon-wrapper { width: 76px; height: 76px; }
            .subject-icon { font-size: 2.2rem; }

            header { margin: 20px 0 32px; }

            .item-card {
                padding: 16px 16px;
                border-radius: 16px;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }

            .item-card:hover { transform: none; }
            .item-card:active {
                transform: scale(0.98);
                background: var(--hover-bg);
                border-color: var(--hover-border);
            }

            .item-card.pdf-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .pdf-actions { width: 100%; }

            .btn-view, .btn-download { flex: 1; justify-content: center; }

            .question-count { font-size: 0.7rem; padding: 3px 10px; }
            .play-btn { width: 34px; height: 34px; font-size: 0.8rem; }

            .games-grid { gap: 12px; }
            .game-card  { border-radius: 14px; }
        }

        /* ═══════════════════════════════════════════════════════════
           CHAT WIDGET & FLOATING MENU
        ═══════════════════════════════════════════════════════════ */
        #chat-widget {
          position: fixed; bottom: 24px; right: 24px; z-index: 11000;
          display: flex; flex-direction: column; align-items: flex-end; gap: 16px; 
        }

        .chat-tooltip {
          background: linear-gradient(135deg, #8e2de2, #4a00e0);
          color: #fff; padding: 8px 14px; border-radius: 12px;
          font-size: 0.85rem; font-weight: 600;
          box-shadow: 0 4px 12px rgba(142, 45, 226, 0.3);
          opacity: 0; transform: translateY(10px);
          transition: all 0.3s ease; pointer-events: none; margin-bottom: 4px; position: relative;
        }
        .chat-tooltip.show { opacity: 1; transform: translateY(0); }
        .chat-tooltip::after {
          content: ''; position: absolute; bottom: -5px; right: 18px;
          border-width: 6px 6px 0; border-style: solid; border-color: #4a00e0 transparent transparent transparent;
        }

        #chat-bubble {
          width: 54px; height: 54px; border-radius: 50%;
          background: linear-gradient(135deg, #0adaf1, #3a7bd5);
          border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
          font-size: 1.4rem; color: #fff;
          box-shadow: 0 6px 24px rgba(10,218,241,0.4), 0 2px 8px rgba(0,0,0,0.3);
          transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        #chat-bubble:hover { transform: scale(1.08); box-shadow: 0 8px 32px rgba(10,218,241,0.55); }
        #chat-bubble:active { transform: scale(0.94); }

        #floating-nav {
          position: absolute; bottom: 70px; right: 0;
          background: rgba(15, 16, 27, 0.95); backdrop-filter: blur(10px);
          border: 1px solid rgba(10, 218, 241, 0.2); border-radius: 16px;
          padding: 8px; display: flex; flex-direction: column; gap: 4px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          opacity: 0; transform: translateY(10px); pointer-events: none;
          transform-origin: bottom right; transition: all 0.3s ease;
        }
        #floating-nav.show { opacity: 1; transform: translateY(0); pointer-events: all; }

        .nav-item {
          display: flex; align-items: center; gap: 12px; padding: 12px 16px;
          color: #f8fafc; font-size: 0.95rem; font-weight: 500;
          border-radius: 10px; cursor: pointer; transition: background 0.2s ease, color 0.2s ease;
          white-space: nowrap;
        }
        .nav-item i { font-size: 1.1rem; color: #0adaf1; width: 20px; text-align: center; }
        #nav-ai i { color: #b366ff; }
        .nav-item:hover { background: rgba(10, 218, 241, 0.1); color: #0adaf1; }
        #nav-ai:hover { background: rgba(142, 45, 226, 0.1); color: #b366ff; }
        .beta-tag { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; margin-left: auto; letter-spacing: 0.5px; }

        /* ── Generic Chat Panel Styles ── */
        .chat-window {
          background: #0e0f1c;
          border: 1px solid rgba(10,218,241,0.15); border-radius: 20px;
          box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(10,218,241,0.05);
          display: none; flex-direction: column; overflow: hidden;
          transform-origin: bottom right;
          opacity: 0; pointer-events: none;
          transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
          will-change: transform, opacity;
        }
        .chat-window.open { opacity: 1; pointer-events: all; display: flex; }

        #support-panel {
          position: absolute; bottom: 70px; right: 0;
          width: 380px; 
          transform: translateY(20px);
        }
        #support-panel.open { transform: translateY(0); }

        #ai-panel { 
          position: fixed; 
          top: 50%; left: 50%;
          width: 90vw; max-width: 800px;
          height: 85vh; max-height: 800px;
          border-color: rgba(142, 45, 226, 0.3); 
          transform: translate(-50%, -45%);
          z-index: 10500;
        }
        #ai-panel.open { transform: translate(-50%, -50%); }

        .chat-header {
          display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
          background: linear-gradient(135deg, rgba(10,218,241,0.1), rgba(58,123,213,0.08));
          border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        #ai-panel .chat-header { background: linear-gradient(135deg, rgba(142,45,226,0.15), rgba(74,0,224,0.08)); }

        .chat-header-info { display: flex; align-items: center; gap: 10px; }
        .chat-avatar {
          width: 38px; height: 38px; border-radius: 50%;
          background: linear-gradient(135deg, #0adaf1cc, #3a7bd5);
          display: flex; align-items: center; justify-content: center;
          font-size: 0.9rem; color: #fff; flex-shrink: 0;
        }
        #ai-panel .chat-avatar { background: linear-gradient(135deg, #8e2de2, #4a00e0); }

        .chat-name { font-size: 0.92rem; font-weight: 600; color: #f8fafc; line-height: 1.2; }
        .chat-status { font-size: 0.72rem; color: #c9d0db; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .chat-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; display: inline-block; animation: chatPulse 2s ease-in-out infinite; }

        .chat-close-x {
          background: transparent; border: none; color: #94a3b8;
          font-size: 1rem; cursor: pointer; padding: 6px; border-radius: 6px;
          transition: color 0.2s, background 0.2s; flex-shrink: 0;
        }
        .chat-close-x:hover { color: #f8fafc; background: rgba(255,255,255,0.06); }

        /* Chat Messages */
        .chat-messages {
          padding: 16px 14px 10px; display: flex; flex-direction: column; gap: 10px;
          overflow-y: auto;
          scrollbar-width: thin; 
          scrollbar-color: rgba(142,45,226,0.5) transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(142,45,226,0.5); border-radius: 10px; }

        #support-panel .chat-messages { min-height: 150px; max-height: 350px; }
        #ai-panel .chat-messages { flex: 1; max-height: none; } 

        .chat-msg { display: flex; animation: msgIn 0.3s ease; }
        @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        .chat-msg.bot  { justify-content: flex-start; }
        .chat-msg.user { justify-content: flex-end; }

// ── Chat Widget ──
(function () {
  const bubble = document.getElementById('chat-bubble');
  const floatingNav = document.getElementById('floating-nav');
  const supportPanel = document.getElementById('support-panel');
  const aiPanel = document.getElementById('ai-panel');
  const tooltip = document.getElementById('chat-tooltip');
  
  let menuOpen = false;
  
  bubble.addEventListener('click', () => {
    if(tooltip) tooltip.classList.remove('show');
    
    if (supportPanel.classList.contains('open') || aiPanel.classList.contains('open')) {
      closeAllPanels();
    } else {
      menuOpen = !menuOpen;
      floatingNav.classList.toggle('show', menuOpen);
      bubble.innerHTML = menuOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
    }
  });

  document.getElementById('nav-support').addEventListener('click', () => openPanel('support'));
  document.getElementById('nav-ai').addEventListener('click', () => openPanel('ai'));

  document.querySelectorAll('.chat-close-x').forEach(btn => {
    btn.addEventListener('click', closeAllPanels);
  });

  function openPanel(type) {
    menuOpen = false;
    floatingNav.classList.remove('show');
    bubble.innerHTML = '<i class="fas fa-bars"></i>'; 
    
    if (type === 'support') {
      aiPanel.classList.remove('open');
      supportPanel.classList.add('open');
      setTimeout(() => document.getElementById('support-input').focus(), 300);
    } else {
      supportPanel.classList.remove('open');
      aiPanel.classList.add('open');
      setTimeout(() => document.getElementById('ai-input').focus(), 300);
    }
  }

  function closeAllPanels() {
    supportPanel.classList.remove('open');
    aiPanel.classList.remove('open');
    bubble.innerHTML = '<i class="fas fa-bars"></i>';
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 90) + 'px';
  }

  function addMsg(container, text, type) {
    const row = document.createElement('div');
    row.className = 'chat-msg ' + type;
    let htmlText = text.replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>');
    row.innerHTML = `<div class="chat-bubble-msg" dir="auto">${htmlText}</div>`;
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
    return row;
  }

  function addTyping(container) {
    const row = document.createElement('div');
    row.className = 'chat-msg bot';
    row.innerHTML = '<div class="chat-bubble-msg" dir="auto"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
    return row;
  }

  // --- Support Chat Logic ---
  const BOT_TOKEN = '8553775824:AAF3GClTP9ldHvdf5Pvx1ozRAdbOQXpir9w';
  const CHAT_ID   = '8408968285';
  const TG_API_URL = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
  const supportInput = document.getElementById('support-input');
  const supportSendBtn = document.getElementById('support-send-btn');
  const supportMsgs = document.getElementById('support-messages');

  supportInput.addEventListener('input', () => autoResize(supportInput));
  supportInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendSupportMsg(); } });
  supportSendBtn.addEventListener('click', sendSupportMsg);

  function sendSupportMsg() {
    const text = supportInput.value.trim();
    if (!text) return;
    addMsg(supportMsgs, text, 'user');
    supportInput.value = ''; autoResize(supportInput);
    supportSendBtn.disabled = true;
    const typing = addTyping(supportMsgs);
    
    fetch(TG_API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: '💬 Quizzes Support:\n\n' + text })
    }).then(() => {
      typing.remove(); addMsg(supportMsgs, "Got It! We'll Look On Your Message ASAP ⌛", 'bot');
    }).catch(() => {
      typing.remove(); addMsg(supportMsgs, "Connection Error. Please Try Again Later.", 'bot');
    }).finally(() => { supportSendBtn.disabled = false; });
  }

  // --- Quizzes AI Chat Logic ---
  const AI_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzB-v7wRbq5DGiLYs4RpxetBNMuMp0QK3-0HLCoMyU5niGTRuNTdD498vdyBCY8tOSu/exec'; 
  const aiInput = document.getElementById('ai-input');
  const aiSendBtn = document.getElementById('ai-send-btn');
  const aiMsgs = document.getElementById('ai-messages');

  function typeText(element, text, speed = 15) {
    element.innerHTML = '';
    let processedText = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    let i = 0;
    function type() {
      if (i < processedText.length) {
        if (processedText.charAt(i) === '\n') {
          element.innerHTML += '<br>';
        } else if (processedText.charAt(i) === '<') {
          let tag = "";
          while(processedText.charAt(i) !== '>' && i < processedText.length) { tag += processedText.charAt(i); i++; }
          tag += '>';
          element.innerHTML += tag;
        } else {
          element.innerHTML += processedText.charAt(i);
        }
        i++;
        aiMsgs.scrollTop = aiMsgs.scrollHeight;
        setTimeout(type, speed);
      }
    }
    type();
  }

  aiInput.addEventListener('input', () => autoResize(aiInput));
  aiInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAIMsg(); } });
  aiSendBtn.addEventListener('click', sendAIMsg);

  function sendAIMsg() {
    const text = aiInput.value.trim();
    if (!text) return;
    
    const welcomeNode = document.querySelector('.welcome-msg');
    if(welcomeNode) welcomeNode.remove();

    addMsg(aiMsgs, text, 'user');
    aiInput.value = ''; 
    autoResize(aiInput);
    aiSendBtn.disabled = true;
    
    const typing = addTyping(aiMsgs);
    
    fetch(AI_SCRIPT_URL + '?message=' + encodeURIComponent(text), {
      method: 'GET',
      headers: { 'Accept': 'application/json' }
    })
    .then(res => res.text())
    .then(rawText => {
      typing.remove();
      let replyText = "";
      try {
        const data = JSON.parse(rawText);
        replyText = data.reply || data.error || rawText;
      } catch (e) {
        replyText = rawText; 
      }
      const botRow = addMsg(aiMsgs, "", 'bot');
      const bubble = botRow.querySelector('.chat-bubble-msg');
      typeText(bubble, replyText || "Error Processing Request. Please Clarify.", 15);
    })
    .catch((err) => {
      typing.remove();
      addMsg(aiMsgs, "Connection Error. Please Try Again Later.", 'bot');
    })
    .finally(() => { aiSendBtn.disabled = false; });
  }
})();
    </script>
