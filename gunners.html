<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>GUNNER</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080c;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}

/* Scrollable overlay for menus */
#menuOverlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(5,5,15,0.97);z-index:10;overflow-y:auto;
  font-family:'Orbitron',sans-serif;color:#fff;
}
#menuOverlay.active{display:block}
.menu-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px;gap:12px}
.menu-title{font-size:clamp(28px,6vw,58px);font-weight:900;color:#00ffd5;text-shadow:0 0 24px #00ffd5;text-align:center;margin-bottom:8px}
.menu-sub{font-family:'Share Tech Mono',monospace;font-size:clamp(11px,2vw,16px);color:#ff8844;text-align:center;margin-bottom:16px}
.menu-btn{
  width:min(280px,90vw);padding:14px 0;border:2px solid rgba(0,255,213,0.25);
  background:rgba(255,255,255,0.04);color:#bbb;font-family:'Orbitron',sans-serif;
  font-size:clamp(13px,2.5vw,18px);font-weight:700;cursor:pointer;letter-spacing:2px;
  transition:all 0.15s;border-radius:2px;
}
.menu-btn:hover,.menu-btn:active{background:rgba(0,255,213,0.12);border-color:#00ffd5;color:#00ffd5}
.menu-btn.gold{border-color:rgba(255,204,0,0.3);color:#ffcc00}
.menu-btn.gold:hover{background:rgba(255,204,0,0.12);border-color:#ffcc00}
.coins-badge{font-family:'Share Tech Mono',monospace;font-size:clamp(12px,2vw,15px);color:#ffcc00;
  background:rgba(255,204,0,0.08);border:1px solid rgba(255,204,0,0.2);padding:6px 18px;border-radius:2px}

/* Store */
.store-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:700px}
.tab-btn{flex:1;min-width:100px;padding:10px 8px;border:2px solid rgba(0,255,213,0.18);background:rgba(255,255,255,0.03);

.tab-btn.active{background:rgba(0,255,213,0.1);border-color:#00ffd5;color:#00ffd5}
.tab-btn.active.gold{background:rgba(255,204,0,0.1);border-color:#ffcc00;color:#ffcc00}
.card-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%;max-width:900px}
.card{
  width:min(200px,42vw);background:rgba(255,255,255,0.04);border:2px solid rgba(0,255,213,0.12);
  border-radius:4px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:6px
}
.card.equipped,.card.sel{border-color:#00ffd5;background:rgba(0,255,213,0.07)}
.card canvas{border-radius:4px}
.card-name{font-size:clamp(12px,2.5vw,16px);font-weight:700;color:#fff;text-align:center}
.card-desc{font-family:'Share Tech Mono',monospace;font-size:clamp(9px,1.5vw,11px);color:#888;text-align:center}
.card-stats{width:100%;font-family:'Share Tech Mono',monospace;font-size:clamp(9px,1.5vw,11px);color:#4f8;display:flex;flex-direction:column;gap:2px}
.stat-bar-wrap{width:100%;display:flex;flex-direction:column;gap:4px}
.stat-row{display:flex;align-items:center;gap:5px;font-family:'Share Tech Mono',monospace;font-size:10px}
.stat-label{color:#666;width:22px;flex-shrink:0}
.stat-bar{height:6px;flex:1;background:rgba(255,255,255,0.06);border-radius:1px;overflow:hidden}
.stat-fill{height:100%;border-radius:1px}
.card-action{margin-top:4px;width:100%;padding:9px 0;border:2px solid rgba(0,255,213,0.3);background:transparent;
  color:#00ffd5;font-family:'Orbitron',sans-serif;font-size:clamp(10px,2vw,13px);font-weight:700;
  cursor:pointer;border-radius:2px;transition:all 0.15s}
.card-action:hover{background:rgba(0,255,213,0.12)}
.card-action.gold-btn{border-color:rgba(255,204,0,0.4);color:#ffcc00}
.card-action.gold-btn:hover{background:rgba(255,204,0,0.1)}
.card-action.disabled{border-color:rgba(255,255,255,0.08);color:#555;cursor:default}
.card-action.equipped-lbl{border-color:rgba(0,255,213,0.2);color:#00ffd5;opacity:0.6;cursor:default}
.upgrade-card{width:min(360px,92vw);background:rgba(255,255,255,0.04);border:2px solid rgba(0,255,213,0.12);
  border-radius:4px;padding:20px 18px;display:flex;flex-direction:column;gap:8px}
.upgrade-title{font-size:clamp(14px,3vw,20px);font-weight:700}
.upgrade-info{font-family:'Share Tech Mono',monospace;font-size:clamp(10px,2vw,13px);color:#bbb}
.upg-pips{display:flex;gap:5px;margin-top:4px}
.upg-pip{width:36px;height:14px;border-radius:2px;background:rgba(255,255,255,0.07)}
.upg-pip.filled{background:#44ff88}
.upg-pip.filled.blue{background:#44aaff}
.upg-pip.filled.purple{background:#bb44ff}
.upgrade-row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Howto */
.howto-list{width:100%;max-width:550px;display:flex;flex-direction:column;gap:0}
.howto-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.howto-key{font-size:clamp(10px,2vw,13px);font-weight:700;min-width:110px;flex-shrink:0}
.howto-val{font-family:'Share Tech Mono',monospace;font-size:clamp(10px,1.8vw,12px);color:#aaa}

/* Levels */
.levels-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:700px}
.lvl-btn{
  width:min(140px,40vw);height:80px;background:rgba(255,255,255,0.04);border:2px solid rgba(0,255,213,0.12);
  border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.15s;gap:4px;padding:8px

.lvl-btn.unlocked:hover{background:rgba(0,255,213,0.1);border-color:#00ffd5}
.lvl-btn.done{border-color:rgba(68,255,136,0.3)}
.lvl-btn.locked{opacity:0.4;cursor:default}
.lvl-num{font-size:clamp(18px,4vw,28px);font-weight:900;color:#00ffd5}
.lvl-name{font-family:'Share Tech Mono',monospace;font-size:clamp(8px,1.5vw,10px);color:#888;text-align:center}
.lvl-done-badge{font-family:'Share Tech Mono',monospace;font-size:9px;color:#44ff88}
.lvl-locked-lbl{font-size:clamp(10px,2vw,14px);font-weight:700;color:#444}

/* Pause overlay on canvas */
#pauseOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;

#pauseOverlay.active{display:flex}
.pause-title{font-family:'Orbitron',sans-serif;font-size:clamp(30px,6vw,52px);font-weight:900;

.pause-btn.gray{border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.03);color:#aaa}

sv.shotUpg={double:false,triple:false,rapid:false,power:false,spread:false};

// Shot config from upgrades
function getShotCfg(){
  var cnt=1,spread=0.04,rate=9,dmg=14,spd=11;
  if(sv.shotUpg.triple){cnt=3;spread=0.12}
  else if(sv.shotUpg.double){cnt=2;spread=0.07}
  if(sv.shotUpg.spread)spread*=1.8;
  if(sv.shotUpg.rapid)rate=5;
  if(sv.shotUpg.power)dmg=Math.round(dmg*1.5);
  return {cnt:cnt,spread:spread,rate:rate,dmg:dmg,spd:spd,sz:4,col:'#dde',tril:'#99a'};
}

var P,pB,eB,ens,pts,txts,wxPts;

function dSol(x,y,ang,c,r,gun,shield,hit,inv,bw,bh,ht,ft,ex){
    X.save();X.translate(x,y);X.rotate(ang);var s=S(r),w=bw||1,h=bh||1;

    X.fillStyle='rgba(0,0,0,0.35)';X.beginPath();X.ellipse(0,s*.18,s*.65*w,s*.2,0,0,Math.PI*2);X.fill();
    X.fillStyle=c.pants;X.fillRect(-s*.4*w,s*.08,s*.32*w,s*.58*h);X.fillRect(s*.08*w,s*.08,s*.32*w,s*.58*h);

    X.fillStyle='rgba(255,255,255,0.06)';X.fillRect(-s*.4*w,s*.55*h,s*.32*w,s*.04);X.fillRect(s*.08*w,s*.55*h,s*.32*w,s*.04);
    X.fillStyle=c.shirt;X.beginPath();X.ellipse(0,-s*.02,s*.5*w,s*.42*h,0,0,Math.PI*2);X.fill();
    X.fillStyle=c.vest;X.beginPath();X.ellipse(0,-s*.02,s*.44*w,s*.37*h,0,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(0,0,0,0.15)';X.lineWidth=S(1.2);X.beginPath();X.moveTo(0,-s*.38*h);X.lineTo(0,s*.32*h);X.stroke();X.beginPath();X.moveTo(-s*.38*w,s*.05);X.lineTo(s*.38*w,s*.05);X.stroke();

            iA();

            if(action==='select'){sv.char=id;svS();showStore(0)}

        }
    });
    // Shooting upgrade buttons
    o.querySelectorAll('.shot-action').forEach(function(b){
        b.onclick=function(){
            iA();
            var id=b.getAttribute('data-id'),cost=parseInt(b.getAttribute('data-cost'));
            if(sv.coins>=cost&&!sv.shotUpg[id]){sv.coins-=cost;sv.shotUpg[id]=true;svS();showStore(1)}

    });
    // Upgrade buttons
    var hpBtn=o.querySelector('#hp-buy');if(hpBtn)hpBtn.onclick=function(){iA();var c=HP_C[sv.hpLvl];if(sv.coins>=c&&sv.hpLvl<5){sv.coins-=c;sv.hpLvl++;svS();showStore(2)}};

// ========== GAME RENDERING ==========
var dMBg_pts=mP;
function dMBg(){for(var i=0;i<dMBg_pts.length;i++){var p=dMBg_pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;X.fillStyle='rgba(0,255,213,'+(0.03+p.a*.04)+')';X.beginPath();X.arc(p.x,p.y,p.r*sc,0,Math.PI*2);X.fill()}var t=Date.now()*.001,g=X.createRadialGradient(W/2+Math.sin(t)*80,H/2+Math.cos(t*.7)*50,0,W/2,H/2,H*.7);g.addColorStop(0,'rgba(0,60,50,0.05)');g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.fillRect(0,0,W,H)}

function rGame(){
    X.save();if(shake>.5)X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    bldBg(curLvl);drwWxPts();
    // Player trail
    for(var t=0;t<P.trail.length;t++){X.fillStyle='rgba(0,255,213,'+(t/P.trail.length)*.07+')';X.beginPath();X.arc(P.trail[t].x,P.trail[t].y,P.r*sc*.25,0,Math.PI*2);X.fill()}
    // Enemies
    for(var i=0;i<ens.length;i++){
        var e=ens[i];
        dSol(e.x,e.y,e.a,e.col,e.r,e.gun,e.hasSh,e.fl>0,false,e.bw,e.bh,'helmet','goggles','');
        if(e.hp<e.mhp){var bw=S(e.r)*2.2;X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(e.x-bw/2,e.y-S(e.r)*sc-S(16),bw,S(6));X.fillStyle='#ff4444';X.fillRect(e.x-bw/2,e.y-S(e.r)*sc-S(16),bw*(e.hp/e.mhp),S(6))}
    }
    // Player
    if(!(P.inv>0&&Math.floor(P.inv/3)%2)){
        if(P.sh>0){var shR=P.sh/P.msh;X.strokeStyle='rgba(68,170,255,'+(0.25+shR*.35)+')';X.lineWidth=S(2.5+shR*3);X.beginPath();X.arc(P.x,P.y,P.r*sc+S(8)+Math.sin(frame*.08)*S(2),0,Math.PI*2);X.stroke();X.fillStyle='rgba(68,170,255,'+(0.04+shR*.04)+')';X.beginPath();X.arc(P.x,P.y,P.r*sc+S(8),0,Math.PI*2);X.fill()}
        var pc=gCh();dSol(P.x,P.y,P.a,pc,P.r,'pistol',P.sh>0,false,P.inv>0,pc.bodyW,pc.bodyH,pc.helmType,pc.faceType,pc.extra)
    }
    // Player bullets
    for(var i=0;i<pB.length;i++){var b=pB[i];X.save();X.strokeStyle=b.tril;X.globalAlpha=.35;X.lineWidth=b.r*.7;X.beginPath();X.moveTo(b.px,b.py);X.lineTo(b.x,b.y);X.stroke();X.globalAlpha=1;X.shadowColor=b.col;X.shadowBlur=8;X.fillStyle=b.col;X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(b.x,b.y,b.r*.3,0,Math.PI*2);X.fill();X.shadowBlur=0;X.restore()}
    // Enemy bullets
    for(var i=0;i<eB.length;i++){var b=eB[i];X.fillStyle='#ff5533';X.shadowColor='#ff3300';X.shadowBlur=5;X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fill();X.fillStyle='#ffcc88';X.beginPath();X.arc(b.x,b.y,b.r*.25,0,Math.PI*2);X.fill();X.shadowBlur=0}
    // Particles
    for(var i=0;i<pts.length;i++){var p=pts[i];X.globalAlpha=Math.max(0,p.life/p.ml);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,Math.max(.5,p.sz*(p.life/p.ml)),0,Math.PI*2);X.fill()}X.globalAlpha=1;
    // Floating texts
    for(var i=0;i<txts.length;i++){var t=txts[i];X.globalAlpha=Math.max(0,t.life/50);X.fillStyle=t.c;X.font='bold '+(t.big?S(16):S(13))+'px "Orbitron"';X.textAlign='center';X.fillText(t.t,t.x,t.y)}X.globalAlpha=1;
    X.restore();
    // Screen flash
    if(flash>0){X.fillStyle='rgba(255,30,30,'+Math.min(.18,flash/50)+')';X.fillRect(0,0,W,H)}
    rHUD();
    // Touch weapon bar
    if(isTch){var by2=H-S(46),bh2=S(34),bw2=S(90);var sc2=getShotCfg();
        X.fillStyle='rgba(0,0,0,0.4)';X.fillRect(W/2-bw2/2,by2,bw2,bh2);
        X.strokeStyle='rgba(0,255,213,0.3)';X.strokeRect(W/2-bw2/2,by2,bw2,bh2);
        X.fillStyle='#00ffd5';X.font='bold '+S(9)+'px "Orbitron"';X.textAlign='center';
        var shotLabel=sc2.cnt===3?'TRIPLE':sc2.cnt===2?'DOUBLE':'SINGLE';
        X.fillText(shotLabel+(sv.shotUpg.rapid?' RAPID':''),W/2,by2+bh2/2+S(4));
    }
    // PAUSE button for touch
    if(isTch&&state==='play'){
        X.fillStyle='rgba(0,0,0,0.4)';X.fillRect(W-S(55),S(10),S(45),S(32));
        X.strokeStyle='rgba(255,255,255,0.2)';X.strokeRect(W-S(55),S(10),S(45),S(32));
        X.fillStyle='#888';X.font='bold '+S(12)+'px "Orbitron"';X.textAlign='center';X.fillText('II',W-S(32),S(31));
        // Simple touch detection for pause button
        if(!window._pauseBtnAdded){window._pauseBtnAdded=true;C.addEventListener('touchstart',function(ev){var t=ev.changedTouches[0];if(t.clientX>W-S(55)&&t.clientX<W&&t.clientY<S(42)){iA();togglePause()}},{passive:false})}
    }
    if(state==='over'){X.fillStyle='rgba(5,5,10,0.82)';X.fillRect(0,0,W,H);X.textAlign='center';X.fillStyle='#ff3333';X.font='900 '+S(46)+'px "Orbitron"';X.shadowColor='#ff0000';X.shadowBlur=20;X.fillText('YOU DIED',W/2,H/2-S(55));X.shadowBlur=0;X.fillStyle='#ccc';X.font=S(14)+'px "Share Tech Mono"';X.fillText('Score: '+score,W/2,H/2-S(15));
        // draw buttons manually for over state
        drawSimpleBtn(W/2-S(135),H/2+S(10),S(125),S(48),'RETRY','#00ffd5',function(){initLv(curLvl)});
        drawSimpleBtn(W/2+S(10),H/2+S(10),S(125),S(48),'MENU','#aaa',function(){state='menu';showMenu()});
    }
}

var _simpleBtns=[];
function drawSimpleBtn(x,y,w,h,txt,col,act){
    _simpleBtns.push({x:x,y:y,w:w,h:h,act:act});
    var hv=mx>=x&&mx<=x+w&&my>=y&&my<=y+h;
    X.fillStyle=hv?'rgba(0,255,213,0.12)':'rgba(255,255,255,0.04)';X.fillRect(x,y,w,h);
    X.strokeStyle=hv?'#00ffd5':'rgba(255,255,255,0.15)';X.lineWidth=hv?2:1;X.strokeRect(x,y,w,h);
    X.fillStyle=hv?'#00ffd5':col;X.font='bold '+S(16)+'px "Orbitron"';X.textAlign='center';X.textBaseline='middle';X.fillText(txt,x+w/2,y+h/2);X.textBaseline='alphabetic';
}
C.addEventListener('click',function(e){
    if(state==='over'){for(var i=0;i<_simpleBtns.length;i++){var b=_simpleBtns[i];if(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){iA();b.act();_simpleBtns=[];return}}}
    _simpleBtns=[];
});
C.addEventListener('touchstart',function(e){
    if(state==='over'){var t=e.changedTouches[0];for(var i=0;i<_simpleBtns.length;i++){var b=_simpleBtns[i];if(t.clientX>=b.x&&t.clientX<=b.x+b.w&&t.clientY>=b.y&&t.clientY<=b.y+b.h){iA();b.act();_simpleBtns=[];return}}}
},{passive:true});

function rHUD(){
    _simpleBtns=[];
    // Pause button (keyboard hint)
    if(!isTch){X.fillStyle='rgba(255,255,255,0.15)';X.font=S(9)+'px "Share Tech Mono"';X.textAlign='right';X.fillText('ESC = Pause',W-S(12),S(58))}

    // HP bar (no bg box — transparent HUD)
    var hx=S(12),hy=S(12),hw=S(190),hh=S(14);
    X.fillStyle='rgba(0,0,0,0.4)';X.fillRect(hx,hy,hw,hh);
    var hpR=Math.max(0,P.hp/P.mhp),hc;
    if(hpR>.5){hc=X.createLinearGradient(hx,hy,hx+hw*hpR,hy);hc.addColorStop(0,'#00ffd5');hc.addColorStop(1,'#00bb99')}
    else if(hpR>.25){hc=X.createLinearGradient(hx,hy,hx+hw*hpR,hy);hc.addColorStop(0,'#ffaa00');hc.addColorStop(1,'#cc7700')}
    else{hc=X.createLinearGradient(hx,hy,hx+hw*hpR,hy);hc.addColorStop(0,'#ff3333');hc.addColorStop(1,'#aa0000')}
    X.fillStyle=hc;X.fillRect(hx,hy,hw*hpR,hh);
    X.strokeStyle='rgba(255,255,255,0.1)';X.lineWidth=1;X.strokeRect(hx,hy,hw,hh);
    X.fillStyle='rgba(255,255,255,0.8)';X.font='bold '+S(9)+'px "Share Tech Mono"';X.textAlign='left';X.fillText('HP '+Math.ceil(P.hp)+'/'+P.mhp,hx+S(3),hy+S(10));

    // Shield bar
    var sy=hy+S(18);
    X.fillStyle='rgba(0,0,0,0.4)';X.fillRect(hx,sy,hw,S(10));
    var shG=X.createLinearGradient(hx,sy,hx+hw*Math.max(0,P.sh/P.msh),sy);shG.addColorStop(0,'#44aaff');shG.addColorStop(1,'#2288dd');
    X.fillStyle=shG;X.fillRect(hx,sy,hw*Math.max(0,P.sh/P.msh),S(10));
    X.strokeStyle='rgba(255,255,255,0.08)';X.strokeRect(hx,sy,hw,S(10));
    X.fillStyle='rgba(200,220,255,0.7)';X.font=S(8)+'px "Share Tech Mono"';X.fillText('SH '+Math.ceil(P.sh)+'/'+P.msh,hx+S(3),sy+S(8));

    // Shot mode indicator
    var cfg=getShotCfg();var shotName=cfg.cnt===3?'TRIPLE':cfg.cnt===2?'DOUBLE':'SINGLE';
    if(cfg.cnt>1){X.fillStyle='rgba(255,136,68,0.8)';X.font='bold '+S(9)+'px "Orbitron"';X.fillText(shotName+(sv.shotUpg.rapid?' RAPID':''),hx,sy+S(22))}

    // Score (top right, no box)
    X.shadowColor='#00ffd5';X.shadowBlur=6;X.fillStyle='#00ffd5';X.font='bold '+S(20)+'px "Orbitron"';X.textAlign='right';X.fillText((''+score).padStart(5,'0'),W-S(12),S(26));X.shadowBlur=0;

    // Level/Wave (top center, no box)
    X.fillStyle='rgba(200,200,200,0.7)';X.font=S(12)+'px "Share Tech Mono"';X.textAlign='center';X.fillText('Lvl '+curLvl+' · Wave '+curWv+'/3',W/2,S(20));

    // Combo
    if(combo>2){X.fillStyle='#ffdd00';X.shadowColor='#ffdd00';X.shadowBlur=6;X.font='bold '+S(14)+'px "Orbitron"';X.fillText('x'+Math.min(combo,10)+' COMBO',W/2,S(38));X.shadowBlur=0}

    // Boss bar
    if(bossMHp>0&&bossHp>0){
        var bw=Math.min(S(300),W*.8),bx=W/2-bw/2,by=H-S(40);
        X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(bx,by,bw,S(14));
        var bG=X.createLinearGradient(bx,by,bx+bw*(bossHp/bossMHp),by);bG.addColorStop(0,'#ff3333');bG.addColorStop(1,'#aa0000');
        X.fillStyle=bG;X.fillRect(bx,by,bw*(bossHp/bossMHp),S(14));
        X.strokeStyle='rgba(255,100,100,0.2)';X.strokeRect(bx,by,bw,S(14));
        X.fillStyle='#fff';X.font='bold '+S(10)+'px "Orbitron"';X.textAlign='center';X.fillText('BOSS',W/2,by+S(10))
    }

    // Wave announcement
    if(wvAnn>0){X.globalAlpha=Math.min(1,wvAnn/25);X.shadowColor='#00ffd5';X.shadowBlur=15;X.fillStyle='#00ffd5';X.font='bold '+S(38)+'px "Orbitron"';X.textAlign='center';X.fillText('WAVE '+curWv,W/2,H/2);X.shadowBlur=0;X.globalAlpha=1}
}

function rLDone(){
    bldBg(curLvl);X.fillStyle='rgba(5,5,10,0.75)';X.fillRect(0,0,W,H);
    X.textAlign='center';X.shadowColor='#00ffd5';X.shadowBlur=15;X.fillStyle='#00ffd5';X.font='900 '+S(42)+'px "Orbitron"';X.fillText('LEVEL CLEAR',W/2,H/2-S(80));X.shadowBlur=0;
    X.fillStyle='#ffcc00';X.font='bold '+S(22)+'px "Orbitron"';X.fillText('+'+LVLS[curLvl-1].coins+' Coins',W/2,H/2-S(30));
    X.fillStyle='#ccc';X.font=S(14)+'px "Share Tech Mono"';X.fillText('Score: '+score,W/2,H/2+S(8));
    X.fillStyle='#999';X.fillText('Total Coins: '+sv.coins,W/2,H/2+S(28));
    if(curLvl>=10){drawSimpleBtn(W/2-S(110),H/2+S(55),S(220),S(50),'YOU WIN! 🏆','#ffcc00',function(){state='win'})}
    else{drawSimpleBtn(W/2-S(135),H/2+S(55),S(125),S(50),'NEXT','#00ffd5',function(){initLv(curLvl+1)});drawSimpleBtn(W/2+S(10),H/2+S(55),S(125),S(50),'MENU','#aaa',function(){state='menu';showMenu()})}
}

function rWin(){
    dMBg();X.textAlign='center';X.shadowColor='#ffcc00';X.shadowBlur=20;X.fillStyle='#ffcc00';X.font='900 '+S(52)+'px "Orbitron"';X.fillText('YOU WIN!',W/2,H/2-S(80));X.shadowBlur=0;
    X.fillStyle='#00ffd5';X.font=S(18)+'px "Share Tech Mono"';X.fillText('All 10 levels conquered!',W/2,H/2-S(35));
    X.fillStyle='#ffcc00';X.font=S(14)+'px "Share Tech Mono"';X.fillText('Coins: '+sv.coins,W/2,H/2);
    drawSimpleBtn(W/2-S(100),H/2+S(40),S(200),S(50),'MAIN MENU','#00ffd5',function(){state='menu';showMenu()});
} 

function loop(){update();render();requestAnimationFrame(loop)}

// Start
showMenu();
loop();
</script>
