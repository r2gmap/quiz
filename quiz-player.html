<style>
body { align-items: center; }
.qp-nav { width: 100%; max-width: 760px; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; flex: none; }
.qp-nav .actions { display: flex; gap: 4px; }
.quiz-container { width: 100%; max-width: 760px; padding: 8px 16px 48px; }
.q-card { padding: 30px; border-radius: 22px; background: linear-gradient(145deg, var(--surface), transparent); border: 1px solid var(--line); box-shadow: var(--shadow); }
.q-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
#quiz-title { color: var(--accent); font-weight: 600; font-size: .92rem; }
.q-count { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.progress-bar-wrap { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-bottom: 26px; }
.progress-bar-fill { height: 100%; width: 100%; border-radius: 4px; background: var(--grad); box-shadow: 0 0 12px var(--glow); transform-origin: left; transform: scaleX(0); transition: transform .4s var(--ease); }
#question-text { margin-bottom: 22px; font: 600 1.2rem/1.65 var(--font); letter-spacing: 0; text-align: start; outline: 0; }
#options-list { display: grid; gap: 10px; }
.option-btn { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px; text-align: start;
  background: var(--field); border: 1px solid var(--line-strong); font-size: .96rem; line-height: 1.55;
  transition: transform .4s var(--ease), border-color .3s, background-color .3s, box-shadow .4s; }
#question-text.ar { font-family: var(--font-ar); line-height: 1.9; }
.option-btn.ar { line-height: 1.85; }
.opt-letter { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line-strong);
  color: var(--muted); font-size: .8rem; font-weight: 600; transition: background-color .15s, color .15s, border-color .15s; }
@media (hover: hover) { .option-btn:not(:disabled):hover { border-color: var(--accent-line); background: var(--accent-soft); transform: scale(1.012); box-shadow: 0 0 18px -4px var(--glow); } }
.option-btn:not(:disabled):active { transform: scale(.99); transition-duration: .12s; }
.option-btn:disabled { cursor: default; }
.option-btn.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.option-btn.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
.option-btn.correct .opt-letter { background: var(--ok); border-color: var(--ok); color: #fff; }
.option-btn.wrong .opt-letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.q-actions { display: flex; gap: 10px; margin-top: 20px; }
.q-actions .btn { flex: 1; animation: rise .22s var(--ease) both; }

/* Question image (optional) — sits between the question and the answers */
.q-figure { position: relative; display: block; width: 100%; max-width: 620px; margin: -4px auto 22px; padding: 10px; border-radius: 14px; cursor: zoom-in;
  background: #fff; border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
.q-figure img { display: block; width: auto; height: auto; max-width: 100%; max-height: min(420px, 55vh); margin: 0 auto; border-radius: 6px; transition: opacity .25s; }
.q-figure.loading { min-height: 140px; }
.q-figure.loading img { opacity: 0; }
.q-zoom { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  background: rgba(10, 14, 24, .62); color: #fff; opacity: .85; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
.q-zoom .ic { width: 16px; height: 16px; }
@media (hover: hover) { .q-figure:hover .q-zoom { opacity: 1; transform: scale(1.08); } }
.modal-overlay.lightbox { z-index: 90; background: rgba(5, 7, 12, .88); cursor: zoom-out; }
#lightbox-img { display: block; width: auto; height: auto; max-width: min(96vw, 1100px); max-height: 88vh; padding: 8px; border-radius: 12px; background: #fff;
  box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .7); transform: scale(.97); transition: transform .26s var(--ease); }
.lightbox.active #lightbox-img { transform: none; }
.lb-close { position: absolute; top: 14px; right: 14px; background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .25); }

/* Quizzes AI window (opens in place; the chat is index.html in embedded mode) */
.modal-overlay.ai-modal { z-index: 95; }
.ai-box { display: flex; flex-direction: column; width: min(760px, 100%); height: min(88vh, 800px); height: min(88dvh, 800px); overflow: hidden; border-radius: 22px;
  background: var(--panel); border: 1px solid var(--accent-line); box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .6), 0 0 40px -16px var(--glow);
  transform: translateY(14px) scale(.98); transition: transform .3s var(--ease); }
.ai-modal.active .ai-box { transform: none; }
.ai-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line); flex: none; }
.ai-head b { display: inline-flex; align-items: center; gap: 9px; font-size: 1rem; font-weight: 600; color: var(--accent); }
.ai-head .ic { width: 18px; height: 18px; }
#ai-frame { flex: 1; width: 100%; min-height: 0; border: 0; background: var(--panel); color-scheme: normal; }
@media (max-width: 640px) {
  .modal-overlay.ai-modal { padding: 0; }
  .ai-box { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; border: 0; }
}

/* Explain modal */
.modal-overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(8, 10, 14, .66);
  opacity: 0; visibility: hidden; transition: opacity .22s, visibility 0s .22s; }
.modal-overlay.active { opacity: 1; visibility: visible; transition-delay: 0s; }
.modal-content { width: min(520px, 100%); max-height: 86vh; overflow-y: auto; padding: 22px; border-radius: 22px; background: var(--panel);
  border: 1px solid var(--accent-line); box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .6); transform: translateY(12px) scale(.98); transition: transform .26s var(--ease); }
.modal-overlay.active .modal-content { transform: none; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.modal-title { display: flex; align-items: center; gap: 10px; font: 600 1.2rem var(--serif); color: var(--accent); }
#modal-text { color: var(--muted); font-size: .95rem; line-height: 1.75; text-align: start; }
.modal-sep { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.modal-sep .k { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: .76rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.modal-sep p { margin-top: 6px; font-size: .9rem; }

/* Results */
.result-layout { display: none; width: 100%; max-width: 860px; padding: 8px 16px 56px; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
.result-layout.show { display: grid; }
.score-side, .mistakes-side { padding: 28px; border-radius: 22px; background: linear-gradient(145deg, var(--surface), transparent); border: 1px solid var(--line); box-shadow: var(--shadow); }
.score-side { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.score-title { font-size: 1.3rem; }
.ring { position: relative; width: 156px; height: 156px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: url(#rg); stroke-linecap: round; stroke-dasharray: 339.3; stroke-dashoffset: 339.3; transition: stroke-dashoffset .9s var(--ease); }
#score-circle { position: absolute; inset: 0; display: grid; place-items: center; font: 700 2.2rem var(--font); font-variant-numeric: tabular-nums; }
.mistakes-side { opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .4s var(--ease); }
.result-layout.revealed .mistakes-side { opacity: 1; transform: none; }
.mistakes-side h3 { color: var(--bad); font-size: 1.25rem; }
.mistakes-side .count { color: var(--muted); font-size: .8rem; margin-top: 2px; }
.mistakes-list { display: grid; gap: 10px; margin-top: 16px; max-height: 60vh; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.mistake-item { padding: 14px 16px; border-radius: 14px; background: var(--field); border: 1px solid var(--line); content-visibility: auto; contain-intrinsic-size: auto 96px;
  animation: rise .3s var(--ease) both; animation-delay: var(--d, 0s); }
.mistake-item .mq { font-weight: 600; font-size: .92rem; margin-bottom: 6px; text-align: start; }
.mistake-item .mw { color: var(--bad); font-size: .84rem; }
.mistake-item .mc { color: var(--ok); font-size: .84rem; }
.perfect { min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.perfect .ic { width: 48px; height: 48px; color: #e0b34a; margin-bottom: 14px; }
.perfect h2 { color: var(--ok); margin-bottom: 8px; }
.perfect p { color: var(--muted); font-size: .88rem; }

.notfound { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 36px 8px; color: var(--muted); }
.notfound h2 { color: var(--text); }

@media (max-width: 700px) {
  .q-card { padding: 20px 16px; border-radius: 18px; }
  #question-text { font-size: 1.12rem; }
  .result-layout { grid-template-columns: 1fr; }
  .mistakes-list { max-height: none; }
}

let questions = [], currentIdx = 0, score = 0, answered = false, missed = [];
let currentQuiz = { id: '', title: '' };   // remembered so the finished quiz can be saved to the History
const $ = id => document.getElementById(id);
const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
let modalOpener = null;

// Exit: go back if there is history, otherwise to the subjects list
$('exit-btn').onclick = () => { history.length > 1 ? history.back() : (location.href = 'index.html'); };
$('next-btn').onclick = () => nextQuestion();
$('explain-btn').onclick = () => handleExplain();
$('close-modal-btn').onclick = () => closeModal();
$('restart-btn').onclick = () => location.reload();
$('explain-modal').addEventListener('click', e => { if (e.target.id === 'explain-modal') closeModal(); });

function init() {
  const quizId = new URLSearchParams(location.search).get('quiz') || '';
  const data = quizDatabase[quizId];

  if (!data || !data.questions || !data.questions.length) {
    $('quiz-screen').innerHTML =
      '<div class="notfound">' + Q.icon('help') + '<h2>Quiz not found</h2><p>This quiz isn’t available yet.</p>' +
      '<a class="btn" href="index.html">Back to subjects</a></div>';
    return;
  }

  currentQuiz = { id: quizId, title: data.title };
  $('quiz-title').textContent = data.title; Q.lang.mark($('quiz-title'));
  document.title = data.title + ' · Quizzes';
  questions = [...data.questions].sort(() => Math.random() - 0.5);
  $('total-q-num').textContent = questions.length;
  loadQ(true);
}

// ### IMAGE — optional image under the question (lazy-loaded, never stretched, click to enlarge)
function setQuestionImage(q) {
  const fig = $('question-image'), img = fig.querySelector('img');
  if (!q.image) { fig.hidden = true; img.removeAttribute('src'); return; }
  fig.hidden = false; fig.classList.add('loading');
  img.alt = q.imageAlt || 'Question image';
  img.onload = () => fig.classList.remove('loading');
  img.onerror = () => { fig.hidden = true; console.warn('Quiz image not found:', q.image); };
  img.src = q.image;
}
let lightboxOpener = null;
function openLightbox() {
  const img = $('question-image').querySelector('img');
  $('lightbox-img').src = img.currentSrc || img.src; $('lightbox-img').alt = img.alt;
  lightboxOpener = document.activeElement;
  $('image-modal').classList.add('active');
  $('close-image-btn').focus();
}
function closeLightbox() {
  $('image-modal').classList.remove('active');
  if (lightboxOpener && lightboxOpener.focus) lightboxOpener.focus();
}
$('question-image').onclick = openLightbox;
$('image-modal').addEventListener('click', closeLightbox);

function loadQ(first) {
  answered = false;
  const q = questions[currentIdx];
  $('q-actions').hidden = true; $('next-btn').hidden = true; $('explain-btn').hidden = true;
  $('current-q-num').textContent = currentIdx + 1;
  const qt = $('question-text'); qt.textContent = q.q; qt.classList.remove('ar'); Q.lang.mark(qt, q.q);
  setQuestionImage(q);
  $('progress-bar').style.transform = 'scaleX(' + (currentIdx / questions.length) + ')';

  const list = $('options-list');
  const frag = document.createDocumentFragment();
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'option-btn'; b.setAttribute('dir', 'auto');
    b.innerHTML = '<span class="opt-letter">' + letters[i] + '</span><span>' + opt + '</span>';
    Q.lang.mark(b, b.textContent);
    b.onclick = () => check(i, b);
    frag.appendChild(b);
  });
  list.replaceChildren(frag);
  if (!first) qt.focus({ preventScroll: true });
}

function check(idx, btn) {
  if (answered) return;
  answered = true;
  const q = questions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  if (idx === q.correct) {
    btn.classList.add('correct');
    score++;
  } else {
    btn.classList.add('wrong');
    btns[q.correct].classList.add('correct');
    missed.push({ q: q.q, user: q.options[idx], correct: q.options[q.correct], image: q.image || '' });
  }

  $('progress-bar').style.transform = 'scaleX(' + ((currentIdx + 1) / questions.length) + ')';
  const next = $('next-btn');
  $('q-actions').hidden = false;   // the row (and its space) only exists once an answer is picked
  next.hidden = false;
  next.firstChild.nodeValue = currentIdx + 1 < questions.length ? 'Next' : 'Results';
  if (q.explanation) $('explain-btn').hidden = false;   // Explain shows only when the question has an explanation
  next.focus({ preventScroll: true });
}

function handleExplain() {
  const q = questions[currentIdx];
  const explanation = q.explanation || 'No explanation available.';
  const source = q.source
    ? '<div class="modal-sep"><span class="k">' + Q.icon('book') + 'Source</span><p>' + q.source + '</p></div>' : '';
  $('modal-text').innerHTML = explanation + source + '<div class="modal-sep"><button class="btn" id="ask-ai-btn" type="button">' + Q.icon('sparkles') + 'Ask Quizzes AI</button></div>';
  Q.lang.mark($('modal-text'));
  // Opens Quizzes AI in a window right here, so the quiz is never left
  $('ask-ai-btn').onclick = () => openAi('Explain this: ' + String(q.q).replace(/\s+/g, ' '));
  modalOpener = document.activeElement;
  $('explain-modal').classList.add('active');
  setTimeout(() => $('close-modal-btn').focus(), 30);
}

function closeModal() {
  $('explain-modal').classList.remove('active');
  if (modalOpener && modalOpener.focus) modalOpener.focus();
}

// ── Quizzes AI window: the same chat as the AI tab (index.html in embedded mode), shown in place ──
let aiOpener = null;
function openAi(ask) {
  aiOpener = document.activeElement;
  $('ai-frame').src = 'index.html?embed=1&ask=' + encodeURIComponent(ask) + '#ai';
  $('ai-modal').classList.add('active');
  $('close-ai-btn').focus();
}
function closeAi() {
  $('ai-modal').classList.remove('active');
  setTimeout(() => { if (!$('ai-modal').classList.contains('active')) $('ai-frame').src = 'about:blank'; }, 300);   // stop the chat once the window is gone
  if (aiOpener && aiOpener.focus) aiOpener.focus();
}
$('close-ai-btn').onclick = closeAi;
$('ai-modal').addEventListener('click', e => { if (e.target.id === 'ai-modal') closeAi(); });
window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.type === 'q-ai-close') closeAi(); });   // Esc pressed inside the chat

function nextQuestion() {
  currentIdx++;
  if (currentIdx < questions.length) loadQ();
  else finish();
}

// ### HISTORY — every finished quiz is saved on this device and shown in the History tab of the home page
function saveToHistory() {
  const subj = Q.subjects.find(s => s.quizzes.some(z => z.id === currentQuiz.id));
  Q.history.add({ t: Date.now(), quiz: currentQuiz.id, title: currentQuiz.title, subject: subj ? subj.name : '', score: score, total: questions.length, missed: missed });
}

function finish() {
  saveToHistory();
  $('main-quiz-container').hidden = true;
  const res = $('result-screen'); res.classList.add('show');
  const target = Math.round((score / questions.length) * 100);
  const label = $('score-circle'), bar = $('score-bar');
  requestAnimationFrame(() => { bar.style.strokeDashoffset = 339.3 * (1 - target / 100); });

  const dur = 900, t0 = performance.now();
  (function tick(now) {
    const p = Math.min(1, (now - t0) / dur), eased = 1 - Math.pow(1 - p, 3);
    label.textContent = Math.round(target * eased) + '%';
    if (p < 1) requestAnimationFrame(tick); else setTimeout(revealDetails, 300);
  })(t0);
  window.scrollTo(0, 0);
}

function revealDetails() {
  const mSide = $('mistakes-side');
  if (missed.length === 0) {
    mSide.innerHTML =
      '<div class="perfect">' + Q.icon('trophy') + '<h2>Perfect Score!</h2><p>Original Gangsta 🐱‍👤</p></div>';
  } else {
    mSide.innerHTML =
      '<h3>Your Wrong Answers</h3><p class="count">' + missed.length + ' question' + (missed.length !== 1 ? 's' : '') + ' to review</p>' +
      '<div class="mistakes-list">' + missed.map((m, i) =>
        '<div class="mistake-item" dir="auto" style="--d:' + (Math.min(i, 10) * 0.05) + 's">' +
          '<p class="mq">' + Q.esc(m.q) + '</p>' +
          '<p class="mw">✘ ' + m.user + '</p><p class="mc">✔ ' + m.correct + '</p></div>').join('') + '</div>';
    mSide.querySelectorAll('.mistake-item').forEach(el => Q.lang.mark(el));
  }
  $('result-screen').classList.add('revealed');
}

// Keyboard: A–F or 1–6 picks an answer, Esc closes the explanation
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('ai-modal').classList.contains('active')) return closeAi();
  if (e.key === 'Escape' && $('image-modal').classList.contains('active')) return closeLightbox();
  if (e.key === 'Escape' && $('explain-modal').classList.contains('active')) return closeModal();
  if (answered || $('ai-modal').classList.contains('active') || $('image-modal').classList.contains('active') || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const i = letters.indexOf(e.key.toUpperCase());
  const n = i > -1 ? i : (/^[1-6]$/.test(e.key) ? +e.key - 1 : -1);
  const btn = document.querySelectorAll('.option-btn')[n];
  if (btn && !$('main-quiz-container').hidden) btn.click();
});

init();
</script>
