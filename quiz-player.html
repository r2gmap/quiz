<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Player</title>
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            background-color: #0f101b !important; 
            scroll-behavior: smooth; 
        }
        :root {
            --bg-gradient-1: #050505; --bg-gradient-2: #17181a; --bg-gradient-3: #070818;
            --card-bg: rgba(255, 255, 255, 0.02); --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc; --text-muted: #94a3b8; --accent-color: #0adaf1c7;
            --correct-color: #10b981; --wrong-color: #ef4444;
            --bezier: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .light-mode {
            --bg-gradient-1: #f4f6f9; --bg-gradient-2: #e9ecef; --bg-gradient-3: #f1f3f5;
            --card-bg: rgba(255, 255, 255, 0.7); --card-border: rgba(0, 0, 0, 0.05);
            --text-main: #2d3748; --text-muted: #718096; --accent-color: #4299e1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body::-webkit-scrollbar {
            display: none;
            -ms-overflow-style: none;  /* IE و Edge القديم */
            scrollbar-width: none;  /* Firefox */
        }

        body {
            background: linear-gradient(180deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* ── Quiz Container: no fixed height, grows with content ── */
        .quiz-container {
            width: 100%; max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* ── Result Layout: static container, NO animation on this element ── */
        .result-layout {
            width: 100%; max-width: 800px;
            height: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: none;
        }

        /* ── Score Side: the only thing that moves ── */
        .score-side {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            z-index: 5;
            transition: left 0.85s var(--bezier), top 0.85s var(--bezier), transform 0.85s var(--bezier);
        }

        .score-circle {
            width: 220px; height: 220px; border-radius: 50%;
            background: linear-gradient(135deg, #4796E3, #9177C7, #CA6673);
            display: flex; justify-content: center; align-items: center;
            font-size: 3.6rem; font-weight: 800; color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: width 0.85s var(--bezier), height 0.85s var(--bezier), font-size 0.85s var(--bezier);
        }

        .score-title {
            font-size: 1.3rem; font-weight: 600; margin-bottom: 14px;
            white-space: nowrap;
            opacity: 0; transform: translateY(-8px);
            transition: opacity 0.5s ease 0.55s, transform 0.5s ease 0.55s;
        }

        .restart-btn {
            margin-top: 18px; background: none; border: none;
            color: var(--text-muted); cursor: pointer;
            font-size: 0.88rem; font-family: 'Poppins', sans-serif;
            opacity: 0;
            transition: opacity 0.5s ease 0.65s;
        }
        .restart-btn:hover { color: var(--text-main); }

        /* ── Mistakes Side: hidden, slides in from right ── */
        .mistakes-side {
            position: absolute;
            right: 0; top: 0;
            width: 56%; height: 100%;
            padding: 36px 36px 36px 28px;
            border-left: 1px solid var(--card-border);
            display: flex; flex-direction: column;
            opacity: 0;
            transform: translateX(28px);
            pointer-events: none;
            transition: opacity 0.6s ease 0.7s, transform 0.6s ease 0.7s;
        }

        /* ── Revealed: circle moves left, mistakes fade in ── */
        .result-layout.revealed .score-side {
            left: 22%; top: 50%;
            transform: translate(-50%, -50%);
        }
        .result-layout.revealed .score-circle {
            width: 160px; height: 160px; font-size: 2.5rem;
        }
        .result-layout.revealed .score-title { opacity: 1; transform: translateY(0); }
        .result-layout.revealed .restart-btn { opacity: 1; }
        .result-layout.revealed .mistakes-side {
            opacity: 1; transform: translateX(0); pointer-events: all;
        }

        /* ── Mobile result screen: normal page flow, fully scrollable ── */
        @media (max-width: 640px) {
            .quiz-container { padding: 24px; }

            /* Card becomes a normal flex-column container — no clipping, no fixed height */
            .result-layout {
                height: auto;
                overflow: visible;
                flex-direction: column;  /* used when JS sets display:flex */
                align-items: center;
                padding: 36px 20px 28px;
            }

            /* Score stays in normal flow — no absolute positioning on mobile */
            .score-side {
                position: static;
                left: auto; top: auto;
                transform: none;
                /* keep flex + align so contents center */
                margin-bottom: 24px;
            }

            /* Override the desktop "revealed" position — keep it static on mobile */
            .result-layout.revealed .score-side {
                position: static;
                left: auto; top: auto;
                transform: none;
            }

            .result-layout.revealed .score-circle {
                width: 130px; height: 130px; font-size: 2rem;
            }

            /*
             * Mistakes panel: collapsed (zero height, invisible) before reveal
             * then expands naturally downward — page scrolls as it grows
             */
            .mistakes-side {
                position: static;
                right: auto; top: auto;
                width: 100%;
                height: 0;
                overflow: hidden;
                padding: 0 15px;
                border-left: none;
                border-top: none;
                opacity: 0;
                transform: none;
                pointer-events: none;
                /* transition uses max-height trick for smooth expand */
                transition: opacity 0.5s ease 0.6s, height 0s ease 0.6s, padding 0s ease 0.6s;
            }

            .result-layout.revealed .mistakes-side {
                height: auto;
                overflow: visible;
                opacity: 1;
                pointer-events: all;
                padding: 20px 15px;
                border-top: 1px solid var(--card-border);
                transform: none;
            }

            /* inner list: let page scroll, no inner scrollbar */
            .mistakes-list {
                overflow-y: visible !important;
                height: auto !important;
            }
        }

        /* ── Progress bar ── */
        .progress-bar-wrap {
            height: 3px; background: rgba(255,255,255,0.06);
            border-radius: 10px; margin-bottom: 24px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; border-radius: 10px;
            background: var(--accent-color);
            transition: width 0.4s ease;
        }

        /* ── Option buttons: modern with letter badge ── */
        #options-list { display: flex; flex-direction: column; gap: 11px; }

        .option-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            display: flex; align-items: center; gap: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.93rem; line-height: 1.55;
            transition: transform 0.25s var(--bezier), border-color 0.25s ease,
                        background 0.25s ease, box-shadow 0.25s ease;
            width: 100%;
        }

        .opt-letter {
            min-width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; font-weight: 600; flex-shrink: 0;
            transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateZ(5px);
            border-color: var(--accent-color);
            background: rgba(10, 218, 241, 0.04);
            box-shadow: 0 4px 18px rgba(10, 218, 241, 0.07);
        }
        .option-btn:hover:not(:disabled) .opt-letter {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* ── Modal Popup Styles ── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 1000; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex; opacity: 1;
        }
        .modal-content {
            background: rgba(22, 23, 24, 0.521);
            border: 1px solid var(--card-border);
            border-radius: 24px; padding: 30px;
            width: 90%; max-width: 500px;
            transform: scale(0.9); transition: transform 0.3s var(--bezier);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            color: var(--text-main);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; color: var(--accent-color); }
        .close-modal-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer; transition: color 0.2s;
        }
        .close-modal-btn:hover { color: var(--wrong-color); }

        /* ── Mistakes list — invisible scrollbar on desktop ── */
        .mistakes-list {
            overflow-y: auto; flex-grow: 1;
            padding-right: 6px; margin-top: 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .mistakes-list::-webkit-scrollbar { display: none; }

        .mistake-item {
            background: rgba(255,255,255,0.03); padding: 14px;
            border-radius: 14px; margin-bottom: 11px;
            border-left: 4px solid var(--wrong-color);
            animation: slideIn 0.45s ease forwards;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(10,218,241,0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav style="width:100%; max-width:800px; display:flex; justify-content:space-between; padding:20px 10px; flex-shrink:0;">
        <button onclick="javascript:history.back()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-family:'Poppins',sans-serif;">
            <i class="fa-solid fa-circle-left"></i> Exit Quiz
        </button>

        <button id="theme-toggle" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
            <i class="fas fa-sun"></i>
        </button> 
    </nav>

    <div class="quiz-container" id="main-quiz-container">
        <div id="quiz-screen">

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span id="quiz-title" style="color:var(--accent-color); font-weight:700; font-size:0.95rem;">Quiz</span>
                <span style="color:var(--text-muted); font-size:0.88rem;">
                    <span id="current-q-num">1</span> / <span id="total-q-num">?</span>
                </span>
            </div>

            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
            </div>

            <h2 id="question-text" style="margin-bottom:22px; font-size:1.2rem; line-height:1.65; font-weight:600;">Loading...</h2>

            <div id="options-list"></div>

            <!--
                min-height reserves the button row's height at all times so the
                page height never changes when Next / Explain appear → no scrollbar pop
            -->
            <div style="margin-top:18px; display:flex; gap:10px; min-height:5px;">
                <button id="explain-btn" onclick="handleExplain()" style="display:none; flex:1; padding:13px; border-radius:12px; background:none; border:1px solid var(--accent-color); color:var(--accent-color); cursor:pointer; font-family:'Poppins',sans-serif; font-size:0.88rem;">
                    <i class="fas fa-lightbulb" style="margin-right:6px;"></i>Explain
                </button>
                <button id="next-btn" onclick="nextQuestion()" style="display:none; flex:2; padding:13px; border-radius:12px; background:var(--accent-color); color:#000; font-weight:700; border:none; cursor:pointer; font-family:'Poppins',sans-serif; font-size:0.92rem;">
                    Next Question →
                </button>
            </div>

        </div>
    </div>

    <div class="result-layout" id="result-screen">

        <div class="score-side" id="score-side">
            <h3 class="score-title">Your Score</h3>
            <div class="score-circle" id="score-circle">0%</div>
            <button onclick="location.reload()" class="restart-btn">
                <i class="fas fa-redo"></i> Restart
            </button>
        </div>

        <div class="mistakes-side" id="mistakes-side"></div>

    </div>

    <div class="modal-overlay" id="explain-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-lightbulb" style="margin-right:8px;"></i>Explain</div>
                <button class="close-modal-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-text" style="font-size:0.93rem; color:var(--text-muted); line-height:1.65;"></div>
        </div>
    </div>

    <script>

        // =============================================

      
  

const quizDatabase = {


  
  "org1": {
    title: "Quiz I",
    questions: [
      {
        q: "Arrange the following compounds in order of DECREASING reactivity towards Electrophilic Aromatic Substitution (EAS): Benzene, Phenol, Nitrobenzene, Chlorobenzene.",
        options: [
          "Phenol > Benzene > Chlorobenzene > Nitrobenzene",
          "Nitrobenzene > Chlorobenzene > Benzene > Phenol",
          "Phenol > Chlorobenzene > Benzene > Nitrobenzene",
          "Benzene > Phenol > Nitrobenzene > Chlorobenzene"
        ],
        correct: 0,
        explanation: "Phenol is the most reactive due to the strongly activating -OH group (+M effect). Benzene is neutral. Chlorobenzene is weakly deactivating because its electron-withdrawing inductive effect (-I) is stronger than its resonance effect. Nitrobenzene is the least reactive due to powerful -I and -M deactivating effects[cite: 188, 189, 190].",
        source: "organic lec 2.m4a [cite: 188, 189]"
      },
      {
        q: "What is the fundamental reason why 'Cyclooctatetraene' is classified as non-aromatic despite having alternating double and single bonds?",
        options: [
          "It has exactly 6 pi electrons.",
          "It adopts a non-planar 'tub' shape to avoid the highly unstable anti-aromatic state.",

          "It is not a cyclic compound."

        correct: 1,
        explanation: "Cyclooctatetraene has 8 pi electrons, which fits the anti-aromatic (4n) rule. To escape this severe instability, the molecule distorts itself out of a flat plane into a 'tub' shape. Since it is no longer planar, it fails the basic requirements for aromaticity[cite: 441].",
        source: "Organic_1.m4a [cite: 441]"
      },
      {
        q: "How does the presence of multiple strongly electron-withdrawing groups (e.g., -NO2) at ortho and para positions affect the Nucleophilic Aromatic Substitution (NAS) of chlorobenzene?",
        options: [
          "It makes the reaction completely impossible due to severe steric hindrance.",
          "It forces the incoming nucleophile to attack the meta position.",
          "It changes the mechanism exclusively to an Elimination-Addition (Benzyne) pathway.",
          "It drastically lowers the required reaction temperature by highly stabilizing the intermediate Meisenheimer complex."
        ],
        correct: 3,
        explanation: "Electron-withdrawing groups at ortho and para positions stabilize the negatively charged intermediate (Meisenheimer complex) via resonance. This highly activates the ring for NAS, drastically dropping the required temperature (e.g., from 350°C for unactivated rings to room temperature for 2,4,6-trinitrochlorobenzene)[cite: 506, 507, 593].",
        source: "organic_5 (1).m4a & lectures_3,4.pdf [cite: 506, 593]"
      },
      {
        q: "Why does Aniline [Ph-NH2] completely fail to undergo Friedel-Crafts alkylation or acylation?",
        options: [
          "The amino group directs the electrophile exclusively to the meta position.",
          "The Lewis acid catalyst (e.g., AlCl3) complexes with the nitrogen's lone pair, converting it into a powerful electron-withdrawing (deactivating) group.",
          "The strong activating amino group causes the benzene ring to break apart.",
          "Aniline is completely insoluble in the non-polar reaction solvent."
        ],
        correct: 1,
        explanation: "Friedel-Crafts reactions do not occur on rings with strong activating groups having lone pairs (like -NH2 or -OH) because these lone pairs immediately coordinate with the Lewis acid catalyst. This places a positive charge on the heteroatom, transforming it into a powerful deactivating group that halts the reaction[cite: 228, 557].",
        source: "organic lec 3.m4a & lectures_1,2.pdf [cite: 228, 557]"
      },
      {
        q: "Which specific catalyst is uniquely utilized in the Sandmeyer Reaction to successfully replace a diazonium group [-N2+] with a halide or cyanide?",
        options: [
          "Zinc amalgam (Zn/Hg)",
          "Iron(III) salts (e.g., FeCl3)",
          "Cuprous salts (e.g., CuCl, CuBr, CuCN)",
          "Aluminum chloride (AlCl3)"
        ],
        correct: 2,
        explanation: "The Sandmeyer reaction specifically requires Copper(I) (Cuprous) salts to catalyze the replacement of the diazonium group with nucleophiles like Cl, Br, or CN[cite: 461, 664].",
        source: "organic_5 (1).m4a & lectures_3,4.pdf [cite: 461, 664]"
      },
      {
        q: "What is the final product class obtained when a Grignard reagent [RMgX] reacts with a Ketone (e.g., Acetone) followed by acidic hydrolysis?",
        options: [
          "A secondary alcohol",
          "A primary alcohol",
          "A carboxylic acid",
          "A tertiary alcohol"
        ],
        correct: 3,
        explanation: "Ketones inherently have two alkyl/aryl groups attached to the carbonyl carbon. The nucleophilic addition of a Grignard reagent adds a third alkyl group. After protonation (hydrolysis), this structure yields a tertiary alcohol[cite: 471, 712].",
        source: "lectures_5,6.pdf & organic_5 (1).m4a [cite: 471, 712]"
      },
      {
        q: "What is the essential structural requirement for an aldehyde or ketone to initiate an Aldol Condensation?",

          "It must be completely water-soluble."
        ],
        correct: 1,
        explanation: "The very first step of an Aldol Condensation is the removal of an acidic alpha-hydrogen (a hydrogen on the carbon adjacent to the carbonyl) by a base. This generates the necessary nucleophilic enolate anion. Molecules lacking alpha-hydrogens (like Benzaldehyde) cannot form enolates[cite: 719].",
        source: "lectures_5,6.pdf [cite: 719]"
      },
      {
        q: "Which named reaction specifically reduces aromatic ketones directly into straight-chain alkylbenzenes (converting the C=O group to a CH2 group) using Amalgamated Zinc (Zn/Hg) and aqueous HCl?",
        options: [
          "Clemmensen Reduction",
          "Kolbe Reaction",
          "Sandmeyer Reaction",
          "Reimer-Tiemann Reaction"
        ],
        correct: 0,
        explanation: "The Clemmensen Reduction uses Zn/Hg and aqueous HCl to completely reduce the carbonyl group of ketones to a methylene (-CH2-) group. Chemists use this after Friedel-Crafts acylation to obtain straight-chain alkylbenzenes without the rearrangement issues seen in alkylation[cite: 322, 560].",
        source: "organic lec 3.m4a & lectures_1,2.pdf [cite: 322, 560]"
      },
      {
        q: "Why is 2,6-dimethylbenzoic acid a significantly stronger acid (lower pKa) than unsubstituted benzoic acid?",
        options: [
          "The methyl groups strongly withdraw electrons via the -I effect.",
          "It forms a highly stable Meisenheimer complex.",
          "The bulky ortho methyl groups cause 'Steric inhibition of resonance', twisting the carboxyl group out of plane and preventing resonance destabilization of the anion.",
          "The methyl groups undergo strong intramolecular hydrogen bonding with the carboxyl group."
        ],
        correct: 2,
        explanation: "Bulky substituents at the ortho positions physically force the carboxyl group out of the plane of the benzene ring. This 'Steric inhibition of resonance' prevents the electron-donating resonance from the ring, making proton release much easier and consequently the acid stronger[cite: 632, 633].",
        source: "lectures_3,4.pdf [cite: 632]"
      },
      {
        q: "In the industrial synthesis of phenols (e.g., Kolbe reaction for Salicylic acid), Sodium phenoxide is reacted with a weak electrophile (CO2). Why is phenoxide reactive enough for this?",

          "Because CO2 is actually a very powerful electrophile.",
          "Because the reaction occurs at absolute zero.",
          "Because the oxygen atom exerts a strong -I effect that pulls electrons out of the ring."
        ],
        correct: 0,
        explanation: "The phenoxide anion (-O-) is one of the most powerful activating groups. It strongly donates its negative charge into the aromatic ring via resonance, increasing electron density immensely at the ortho and para positions, allowing even weak electrophiles like CO2 to attack[cite: 604, 608].",
        source: "lectures_3,4.pdf [cite: 604, 608]"
      }
    ]
  },



  
  "org2": {

      {

        };

        // =============================================


        let questions = [], currentIdx = 0, score = 0, answered = false, missed = [];

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const quizId = urlParams.get('quiz') || '';

            const data = quizDatabase[quizId];

            if (!data) {
                document.getElementById('question-text').textContent = "Quiz not found!";
                return;
            }

            document.getElementById('quiz-title').textContent = data.title;
            questions = [...data.questions].sort(() => Math.random() - 0.5);
            document.getElementById('total-q-num').textContent = questions.length;
            loadQ();
        }

        function loadQ() {
            answered = false;
            const q = questions[currentIdx];
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('explain-btn').style.display = 'none';
            document.getElementById('current-q-num').textContent = currentIdx + 1;
            document.getElementById('question-text').textContent = q.q;
            document.getElementById('progress-bar').style.width = ((currentIdx / questions.length) * 100) + '%';

            const list = document.getElementById('options-list');
            list.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            q.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'option-btn';
                b.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
                b.onclick = () => check(i, b);
                list.appendChild(b);
            });
        }

        function check(idx, btn) {
            if (answered) return;
            answered = true;
            const q = questions[currentIdx];
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);

            function markBtn(b, type) {
                const color = type === 'correct' ? 'var(--correct-color)' : 'var(--wrong-color)';
                const bg    = type === 'correct' ? 'rgba(16,185,129,0.13)' : 'rgba(239,68,68,0.13)';
                b.style.background  = bg;
                b.style.borderColor = color;
                const ltr = b.querySelector('.opt-letter');
                ltr.style.background  = color;
                ltr.style.borderColor = color;
                ltr.style.color       = '#fff';
            }

            if (idx === q.correct) {
                markBtn(btn, 'correct');
                score++;
            } else {
                markBtn(btn, 'wrong');
                markBtn(btns[q.correct], 'correct');
                missed.push({ q: q.q, user: q.options[idx], correct: q.options[q.correct] });
            }

            document.getElementById('next-btn').style.display = 'block';
            if (q.explanation) document.getElementById('explain-btn').style.display = 'block';
        }

        function handleExplain() {
            const q = questions[currentIdx];
            const modal = document.getElementById('explain-modal');
            const explanation = q.explanation || 'No explanation available.';
            const sourceHTML = q.source
                ? `<div style="margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.07);">
                       <span style="font-size:0.78rem; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--accent-color);">
                           <i class="fas fa-book-open" style="margin-right:5px;"></i>Source
                       </span>
                       <p style="margin-top:6px; font-size:0.88rem; color:var(--text-muted);">${q.source}</p>
                   </div>`
                : '';
            document.getElementById('modal-text').innerHTML = explanation + sourceHTML;
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('explain-modal');
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) loadQ();
            else finish();
        }

        function finish() {
            document.getElementById('main-quiz-container').style.display = 'none';
            const resScreen = document.getElementById('result-screen');
            // On mobile use flex so the column layout (score → mistakes) works correctly
            resScreen.style.display = window.innerWidth <= 640 ? 'flex' : 'block';

            const target = Math.round((score / questions.length) * 100);
            let current = 0;
            const timer = setInterval(() => {
                if (current >= target) {
                    clearInterval(timer);
                    setTimeout(revealDetails, 650);
                } else {
                    current++;
                    document.getElementById('score-circle').textContent = current + '%';
                }
            }, 20);
        }

        function revealDetails() {
            const mSide = document.getElementById('mistakes-side');

            if (missed.length === 0) {
                mSide.innerHTML = `
                    <div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:0;">
                        <i class="fas fa-trophy" style="font-size:3rem;color:#fbbf24;margin-bottom:14px;"></i>
                        <h2 style="color:var(--correct-color);margin-bottom:8px;">Perfect Score!</h2>
                        <p style="color:var(--text-muted);font-size:0.87rem;max-width:210px;line-height:1.65;">
                             Original Gangsta 🐱‍👤
                        </p>
                    </div>`;
            } else {
                mSide.innerHTML = `
                    <h3 style="color:var(--wrong-color);flex-shrink:0;">Your Wrong Answers</h3>
                    <p style="color:var(--text-muted);font-size:0.78rem;margin-top:4px;flex-shrink:0;">${missed.length} question${missed.length !== 1 ? 's' : ''} to review</p>
                    <div class="mistakes-list">
                        ${missed.map((m, i) => `
                            <div class="mistake-item" style="animation-delay:${i * 0.08}s">
                                <p style="font-weight:600;font-size:0.9rem;margin-bottom:6px;">${m.q}</p>
                                <p style="color:var(--wrong-color);font-size:0.82rem;">✘ ${m.user}</p>
                                <p style="color:var(--correct-color);font-size:0.82rem;">✔ ${m.correct}</p>
                            </div>`).join('')}
                    </div>`;
            }

            document.getElementById('result-screen').classList.add('revealed');
        }

        document.getElementById('theme-toggle').onclick = () => {
            document.body.classList.toggle('light-mode');
            document.querySelector('#theme-toggle i').className =
                document.body.classList.contains('light-mode') ? 'fas fa-moon' : 'fas fa-sun';
        };

        window.onload = init;
    </script>
