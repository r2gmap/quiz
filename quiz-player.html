<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Player</title>
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            background-color: #0f101b !important; 
            scroll-behavior: smooth; 
        }
        :root {
            --bg-gradient-1: #050505; --bg-gradient-2: #17181a; --bg-gradient-3: #070818;
            --card-bg: rgba(255, 255, 255, 0.02); --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc; --text-muted: #94a3b8; --accent-color: #0adaf1c7;
            --correct-color: #10b981; --wrong-color: #ef4444;
            --bezier: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .light-mode {
            --bg-gradient-1: #f4f6f9; --bg-gradient-2: #e9ecef; --bg-gradient-3: #f1f3f5;
            --card-bg: rgba(255, 255, 255, 0.7); --card-border: rgba(0, 0, 0, 0.05);
            --text-main: #2d3748; --text-muted: #718096; --accent-color: #4299e1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body::-webkit-scrollbar {
            display: none;
            -ms-overflow-style: none;  /* IE و Edge القديم */
            scrollbar-width: none;  /* Firefox */
        }

        body {
            background: linear-gradient(180deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* ── Quiz Container: no fixed height, grows with content ── */
        .quiz-container {
            width: 100%; max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* ── Result Layout: static container, NO animation on this element ── */
        .result-layout {
            width: 100%; max-width: 800px;
            height: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: none;
        }

        /* ── Score Side: the only thing that moves ── */
        .score-side {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            z-index: 5;
            transition: left 0.85s var(--bezier), top 0.85s var(--bezier), transform 0.85s var(--bezier);
        }

        .score-circle {
            width: 220px; height: 220px; border-radius: 50%;
            background: linear-gradient(135deg, #4796E3, #9177C7, #CA6673);
            display: flex; justify-content: center; align-items: center;
            font-size: 3.6rem; font-weight: 800; color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: width 0.85s var(--bezier), height 0.85s var(--bezier), font-size 0.85s var(--bezier);
        }

        .score-title {
            font-size: 1.3rem; font-weight: 600; margin-bottom: 14px;
            white-space: nowrap;
            opacity: 0; transform: translateY(-8px);
            transition: opacity 0.5s ease 0.55s, transform 0.5s ease 0.55s;
        }

        .restart-btn {
            margin-top: 18px; background: none; border: none;
            color: var(--text-muted); cursor: pointer;
            font-size: 0.88rem; font-family: 'Poppins', sans-serif;
            opacity: 0;
            transition: opacity 0.5s ease 0.65s;
        }
        .restart-btn:hover { color: var(--text-main); }

        /* ── Mistakes Side: hidden, slides in from right ── */
        .mistakes-side {
            position: absolute;
            right: 0; top: 0;
            width: 56%; height: 100%;
            padding: 36px 36px 36px 28px;
            border-left: 1px solid var(--card-border);
            display: flex; flex-direction: column;
            opacity: 0;
            transform: translateX(28px);
            pointer-events: none;
            transition: opacity 0.6s ease 0.7s, transform 0.6s ease 0.7s;
        }

        /* ── Revealed: circle moves left, mistakes fade in ── */
        .result-layout.revealed .score-side {
            left: 22%; top: 50%;
            transform: translate(-50%, -50%);
        }
        .result-layout.revealed .score-circle {
            width: 160px; height: 160px; font-size: 2.5rem;
        }
        .result-layout.revealed .score-title { opacity: 1; transform: translateY(0); }
        .result-layout.revealed .restart-btn { opacity: 1; }
        .result-layout.revealed .mistakes-side {
            opacity: 1; transform: translateX(0); pointer-events: all;
        }

        /* ── Mobile result screen: normal page flow, fully scrollable ── */
        @media (max-width: 640px) {
            .quiz-container { padding: 24px; }

            /* Card becomes a normal flex-column container — no clipping, no fixed height */
            .result-layout {
                height: auto;
                overflow: visible;
                flex-direction: column;  /* used when JS sets display:flex */
                align-items: center;
                padding: 36px 20px 28px;
            }

            /* Score stays in normal flow — no absolute positioning on mobile */
            .score-side {
                position: static;
                left: auto; top: auto;
                transform: none;
                /* keep flex + align so contents center */
                margin-bottom: 24px;
            }

            /* Override the desktop "revealed" position — keep it static on mobile */
            .result-layout.revealed .score-side {
                position: static;
                left: auto; top: auto;
                transform: none;
            }

            .result-layout.revealed .score-circle {
                width: 130px; height: 130px; font-size: 2rem;
            }

            /*
             * Mistakes panel: collapsed (zero height, invisible) before reveal
             * then expands naturally downward — page scrolls as it grows
             */
            .mistakes-side {
                position: static;
                right: auto; top: auto;
                width: 100%;
                height: 0;
                overflow: hidden;
                padding: 0 15px;
                border-left: none;
                border-top: none;
                opacity: 0;
                transform: none;
                pointer-events: none;
                /* transition uses max-height trick for smooth expand */
                transition: opacity 0.5s ease 0.6s, height 0s ease 0.6s, padding 0s ease 0.6s;
            }

            .result-layout.revealed .mistakes-side {
                height: auto;
                overflow: visible;
                opacity: 1;
                pointer-events: all;
                padding: 20px 15px;
                border-top: 1px solid var(--card-border);
                transform: none;
            }

            /* inner list: let page scroll, no inner scrollbar */
            .mistakes-list {
                overflow-y: visible !important;
                height: auto !important;
            }
        }

        /* ── Progress bar ── */
        .progress-bar-wrap {
            height: 3px; background: rgba(255,255,255,0.06);
            border-radius: 10px; margin-bottom: 24px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; border-radius: 10px;
            background: var(--accent-color);
            transition: width 0.4s ease;
        }

        /* ── Option buttons: modern with letter badge ── */
        #options-list { display: flex; flex-direction: column; gap: 11px; }

        .option-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            display: flex; align-items: center; gap: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.93rem; line-height: 1.55;
            transition: transform 0.25s var(--bezier), border-color 0.25s ease,
                        background 0.25s ease, box-shadow 0.25s ease;
            width: 100%;
        }

        .opt-letter {
            min-width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; font-weight: 600; flex-shrink: 0;
            transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateZ(5px);
            border-color: var(--accent-color);
            background: rgba(10, 218, 241, 0.04);
            box-shadow: 0 4px 18px rgba(10, 218, 241, 0.07);
        }
        .option-btn:hover:not(:disabled) .opt-letter {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* ── Modal Popup Styles ── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 1000; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex; opacity: 1;
        }
        .modal-content {
            background: rgba(22, 23, 24, 0.521);
            border: 1px solid var(--card-border);
            border-radius: 24px; padding: 30px;
            width: 90%; max-width: 500px;
            transform: scale(0.9); transition: transform 0.3s var(--bezier);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            color: var(--text-main);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; color: var(--accent-color); }
        .close-modal-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer; transition: color 0.2s;
        }
        .close-modal-btn:hover { color: var(--wrong-color); }

        /* ── Mistakes list — invisible scrollbar on desktop ── */
        .mistakes-list {
            overflow-y: auto; flex-grow: 1;
            padding-right: 6px; margin-top: 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .mistakes-list::-webkit-scrollbar { display: none; }

        .mistake-item {
            background: rgba(255,255,255,0.03); padding: 14px;
            border-radius: 14px; margin-bottom: 11px;
            border-left: 4px solid var(--wrong-color);
            animation: slideIn 0.45s ease forwards;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(10,218,241,0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav style="width:100%; max-width:800px; display:flex; justify-content:space-between; padding:20px 10px; flex-shrink:0;">
        <button onclick="javascript:history.back()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-family:'Poppins',sans-serif;">
            <i class="fa-solid fa-circle-left"></i> Exit Quiz
        </button>

        <button id="theme-toggle" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
            <i class="fas fa-sun"></i>
        </button> 
    </nav>

    <div class="quiz-container" id="main-quiz-container">
        <div id="quiz-screen">

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span id="quiz-title" style="color:var(--accent-color); font-weight:700; font-size:0.95rem;">Quiz</span>
                <span style="color:var(--text-muted); font-size:0.88rem;">
                    <span id="current-q-num">1</span> / <span id="total-q-num">?</span>
                </span>
            </div>

            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
            </div>

            <h2 id="question-text" style="margin-bottom:22px; font-size:1.2rem; line-height:1.65; font-weight:600;">Loading...</h2>

            <div id="options-list"></div>

            <!--
                min-height reserves the button row's height at all times so the
                page height never changes when Next / Explain appear → no scrollbar pop
            -->
            <div style="margin-top:18px; display:flex; gap:10px; min-height:5px;">
                <button id="explain-btn" onclick="handleExplain()" style="display:none; flex:1; padding:13px; border-radius:12px; background:none; border:1px solid var(--accent-color); color:var(--accent-color); cursor:pointer; font-family:'Poppins',sans-serif; font-size:0.88rem;">
                    <i class="fas fa-lightbulb" style="margin-right:6px;"></i>Explain
                </button>
                <button id="next-btn" onclick="nextQuestion()" style="display:none; flex:2; padding:13px; border-radius:12px; background:var(--accent-color); color:#000; font-weight:700; border:none; cursor:pointer; font-family:'Poppins',sans-serif; font-size:0.92rem;">
                    Next Question →
                </button>
            </div>

        </div>
    </div>

    <div class="result-layout" id="result-screen">

        <div class="score-side" id="score-side">
            <h3 class="score-title">Your Score</h3>
            <div class="score-circle" id="score-circle">0%</div>
            <button onclick="location.reload()" class="restart-btn">
                <i class="fas fa-redo"></i> Restart
            </button>
        </div>

        <div class="mistakes-side" id="mistakes-side"></div>

    </div>

    <div class="modal-overlay" id="explain-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-lightbulb" style="margin-right:8px;"></i>Explain</div>
                <button class="close-modal-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-text" style="font-size:0.93rem; color:var(--text-muted); line-height:1.65;"></div>
        </div>
    </div>

    <script>

        // =============================================

        const quizDatabase = {
            
  org0: {
    title: "Quiz I",
    questions: [
      {
        q: "According to Huckel's Rule, a planar, cyclic, completely conjugated system is aromatic if it has how many pi (π) electrons?",
        options: [
          "4n",
          "4n + 2",
          "2n",
          "2n + 2"
        ],
        correct: 1,
        explanation: "Huckel's rule states that aromatic compounds must have (4n + 2) pi electrons, where n is an integer (0, 1, 2, ...).",
        source: "lectures_1,2.pdf - Aromaticity (Page 2) & Organic_1.m4a"
      },
      {
        q: "What is the common IUPAC accepted name for a benzene ring directly attached to a methyl group [-CH3]?",
        options: [
          "Aniline",
          "Phenol",
          "Toluene",
          "Anisole"
        ],
        correct: 2,
        explanation: "Toluene is the common name for methylbenzene. Aniline has an -NH2 group, Phenol has an -OH group, and Anisole has an -OCH3 group.",
        source: "lectures_1,2.pdf - Monosubstituted benzene (Page 11)"
      },
      {
        q: "Which of the following IUPAC names corresponds to the structure of 'o-Xylene'?",
        options: [
          "1,2-dimethylbenzene",
          "1,3-dimethylbenzene",
          "1,4-dimethylbenzene",
          "1-ethyl-2-methylbenzene"
        ],
        correct: 0,
        explanation: "The ortho (o-) position refers to adjacent carbons on the benzene ring (positions 1 and 2). Therefore, o-Xylene is 1,2-dimethylbenzene.",
        source: "lectures_1,2.pdf - Disubstituted benzene (Page 12)"
      },
      {
        q: "Benzene typically resists addition reactions to preserve its aromaticity. Instead, it characteristically undergoes which type of reaction?",
        options: [
          "Nucleophilic Aliphatic Substitution",
          "Electrophilic Addition",
          "Free Radical Substitution",
          "Electrophilic Aromatic Substitution (EAS)"
        ],
        correct: 3,
        explanation: "Due to its electron-rich pi cloud, benzene acts as a nucleophile and undergoes Electrophilic Aromatic Substitution (EAS) with an electrophile (E+).",
        source: "lectures_1,2.pdf - Benzene reactions (Page 17) & organic lec 2.m4a"
      },
      {
        q: "In the general mechanism of Electrophilic Aromatic Substitution (EAS), what is the intermediate formed immediately after the attack of the electrophile?",
        options: [
          "A carbanion intermediate",
          "A radical intermediate",
          "A resonance-stabilized carbocation (σ-complex)",
          "A benzyne intermediate"
        ],
        correct: 2,
        explanation: "The addition of an electrophile (E+) breaks the aromaticity temporarily, forming a resonance-stabilized carbocation known as a sigma-complex (σ-complex).",
        source: "lectures_1,2.pdf - General mechanism of SE (Page 17)"
      },
      {
        q: "Consider a benzene ring with an -OH group at C1, a -Cl group at C2, and an -NO2 group at C4. What is the correct name?",
        options: [
          "2-Chloro-4-nitrophenol",
          "1-Chloro-3-nitro-4-phenol",
          "3-Chloro-1-nitrophenol",
          "4-Nitro-2-chlorophenol"
        ],
        correct: 0,
        explanation: "The -OH group has the highest priority (-OH > -NO2 > -X) and assigns the parent name 'phenol' at position 1. Substituents are numbered to give the lowest locants, yielding 2-Chloro-4-nitrophenol.",
        source: "lectures_1,2.pdf - Polysubstituted benzene (Page 14)"
      },
      {
        q: "Which of the following is NOT a fundamental requirement for a compound to be considered aromatic?",
        options: [
          "It must be cyclic.",
          "It must be planar.",
          "It must possess sp3 hybridized carbons in the ring.",
          "It must have a fully conjugated pi system."
        ],
        correct: 2,
        explanation: "Aromatic rings require sp2 hybridized carbons to allow continuous overlap of p-orbitals. An sp3 carbon disrupts the conjugation and makes it non-aromatic.",
        source: "lectures_1,2.pdf - Molecular orbital theory (Page 2) & Organic_1.m4a"
      },
      {
        q: "Identify the aromatic compound consisting of a benzene ring directly attached to a methoxy group [-OCH3].",
        options: [
          "Anisole",
          "Benzoic acid",
          "Styrene",
          "Benzaldehyde"
        ],
        correct: 0,
        explanation: "Anisole is the common name for methoxybenzene. Benzoic acid has a -COOH group, Styrene has a -CH=CH2 group, and Benzaldehyde has a -CHO group.",
        source: "lectures_1,2.pdf - Nomenclature (Page 11)"
      },
      {
        q: "In a benzene molecule (C6H6), what is the specific hybridization state of each of the six carbon atoms?",
        options: [
          "sp3",
          "sp2",
          "sp",
          "sp3d"
        ],
        correct: 1,
        explanation: "Each carbon in benzene is sp2 hybridized, leaving one unhybridized p-orbital perpendicular to the ring to form the delocalized pi electron cloud.",
        source: "lectures_1,2.pdf - Molecular orbital theory (Page 2)"
      },
      {
        q: "What is the correct structure and name for a benzene ring substituted with a formyl group [-CHO]?",
        options: [
          "Acetophenone",
          "Benzophenone",
          "Benzaldehyde",
          "Benzonitrile"
        ],
        correct: 2,
        explanation: "A benzene ring bonded directly to a formyl group (-CHO) is named Benzaldehyde. Acetophenone has a -COCH3 group.",
        source: "lectures_1,2.pdf - Nomenclature (Page 11)"
      }
    ]

  },

        
  org1: {
    title: "Quiz II",
    questions: [
      {
        q: "Which of the following groups is strongly activating and directs the incoming electrophile to ortho and para positions?",
        options: [
          "-NO2 (Nitro)",
          "-OH (Hydroxyl)",
          "-CN (Cyano)",
          "-COOH (Carboxylic acid)"
        ],
        correct: 1,
        explanation: "Groups with lone pairs like -OH and -NH2 donate electron density via resonance (+M effect), making the ring highly reactive and directing to ortho/para positions.",
        source: "organic lec 2.m4a & lectures_1,2.pdf (Activating groups)"
      },
      {
        q: "Halogens (e.g., -Cl, -Br) are unique because they are deactivating groups overall, yet they direct electrophiles to which positions?",
        options: [
          "Meta only",
          "Ortho and Para",
          "Para only",
          "They do not direct, no reaction occurs"
        ],
        correct: 1,
        explanation: "Halogens deactivate the ring via a strong inductive effect (-I), but their lone pairs donate electron density via resonance (+M) to stabilize the ortho and para sigma complexes.",
        source: "organic lec 2.m4a & lectures_1,2.pdf (Halogens)"
      },
      {
        q: "When reacting benzene with n-propyl chloride [CH3-CH2-CH2-Cl] and AlCl3, what is the major product formed due to carbocation rearrangement?",
        options: [
          "n-Propylbenzene",
          "Isopropylbenzene (Cumene)",
          "Ethylbenzene",
          "No reaction"
        ],
        correct: 1,
        explanation: "The primary carbocation [CH3-CH2-CH2+] rearranges via a hydride shift to form a more stable secondary carbocation [CH3-CH(+)-CH3], leading to Isopropylbenzene as the major product.",
        source: "organic lec 3.m4a (Disadvantages of Friedel-Crafts)"
      },
      {
        q: "Will Friedel-Crafts alkylation or acylation occur on a benzene ring that already has a strong deactivating group like -NO2?",
        options: [
          "Yes, but it will be slow",
          "Yes, and it directs to ortho/para",
          "No, the reaction will not proceed (No reaction)",
          "Yes, but only with heating"
        ],
        correct: 2,
        explanation: "Friedel-Crafts reactions do not occur on rings with strong electron-withdrawing groups (like -NO2, -SO3H, -COOH) because the ring becomes too electron-deficient to react.",
        source: "organic lec 3.m4a & organic lec 2.m4a"
      },
      {
        q: "In the sulfonation of benzene using fuming H2SO4, what is the actual electrophile that attacks the benzene ring?",
        options: [
          "HSO4-",
          "SO3 or +SO3H",
          "H2O",
          "SO2"
        ],
        correct: 1,
        explanation: "The electrophile in sulfonation is either neutral sulfur trioxide (SO3) or the protonated form (+SO3H) generated in the acidic medium.",
        source: "lectures_1,2.pdf (Mechanism for sulfonation)"
      },
      {
        q: "Arrange the following compounds in order of DECREASING reactivity towards Electrophilic Aromatic Substitution: [A] Phenol (Ph-OH), [B] Benzene (Ph-H), [C] Nitrobenzene (Ph-NO2).",
        options: [
          "A > B > C",
          "C > B > A",
          "B > A > C",
          "A > C > B"
        ],
        correct: 0,
        explanation: "Phenol has a strongly activating -OH group (most reactive), Benzene is neutral, and Nitrobenzene has a strongly deactivating -NO2 group (least reactive).",
        source: "organic lec 2.m4a (Reactivity Order)"
      },
      {
        q: "If you start with Benzene, perform Nitration (HNO3/H2SO4), and then perform Chlorination (Cl2/AlCl3), what is the final major product?",
        options: [
          "o-Chloronitrobenzene",
          "p-Chloronitrobenzene",
          "m-Chloronitrobenzene",
          "2,4-Dichloronitrobenzene"
        ],
        correct: 2,
        explanation: "Nitration adds an -NO2 group first. Since -NO2 is a meta-director, the subsequent chlorination will place the Cl atom at the meta position.",
        source: "organic lec 2.m4a (Reactions on substituted benzene)"
      },
      {
        q: "What is the product of reacting benzene with acetyl chloride [CH3-C(=O)-Cl] in the presence of AlCl3?",
        options: [
          "Toluene",
          "Acetophenone [Ph-C(=O)-CH3]",
          "Benzaldehyde",
          "Chlorobenzene"
        ],
        correct: 1,
        explanation: "This is a Friedel-Crafts acylation. The acylium ion [CH3-C(=O)+] acts as the electrophile, attaching to the ring to form Acetophenone.",
        source: "organic lec 3.m4a (Acylation)"
      },
      {
        q: "For Nucleophilic Aromatic Substitution (Addition-Elimination) to occur effectively on a halobenzene (like chlorobenzene), what must be present on the ring?",
        options: [
          "Strong electron-donating groups in meta positions",
          "Strong electron-withdrawing groups (like -NO2) in ortho and/or para positions",
          "An extra methyl group",
          "A bulky Lewis acid"
        ],
        correct: 1,
        explanation: "Electron-withdrawing groups at ortho/para positions stabilize the negatively charged intermediate (Meisenheimer complex), facilitating the nucleophilic attack.",
        source: "organic_5 (1).m4a & lectures_3,4.pdf"
      },
      {
        q: "When treating chlorobenzene with a very strong base (NaNH2 in NH3) without any activating groups, the reaction proceeds via an Elimination-Addition mechanism. What is the highly reactive intermediate?",
        options: [
          "A carbocation (sigma complex)",
          "A carbanion",
          "Benzyne (an intermediate with a triple-bond-like structure)",
          "A radical species"
        ],
        correct: 2,
        explanation: "The strong base removes an ortho-proton and expels the chloride ion to form a highly unstable Benzyne intermediate, which then undergoes addition.",
        source: "مراجعه اورجانيك.m4a & organic_5 (1).m4a"
      }
    ]
  },
        

        };

        // =============================================


        let questions = [], currentIdx = 0, score = 0, answered = false, missed = [];

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const quizId = urlParams.get('quiz') || '';

            const data = quizDatabase[quizId];

            if (!data) {
                document.getElementById('question-text').textContent = "Quiz not found!";
                return;
            }

            document.getElementById('quiz-title').textContent = data.title;
            questions = [...data.questions].sort(() => Math.random() - 0.5);
            document.getElementById('total-q-num').textContent = questions.length;
            loadQ();
        }

        function loadQ() {
            answered = false;
            const q = questions[currentIdx];
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('explain-btn').style.display = 'none';
            document.getElementById('current-q-num').textContent = currentIdx + 1;
            document.getElementById('question-text').textContent = q.q;
            document.getElementById('progress-bar').style.width = ((currentIdx / questions.length) * 100) + '%';

            const list = document.getElementById('options-list');
            list.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            q.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'option-btn';
                b.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
                b.onclick = () => check(i, b);
                list.appendChild(b);
            });
        }

        function check(idx, btn) {
            if (answered) return;
            answered = true;
            const q = questions[currentIdx];
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);

            function markBtn(b, type) {
                const color = type === 'correct' ? 'var(--correct-color)' : 'var(--wrong-color)';
                const bg    = type === 'correct' ? 'rgba(16,185,129,0.13)' : 'rgba(239,68,68,0.13)';
                b.style.background  = bg;
                b.style.borderColor = color;
                const ltr = b.querySelector('.opt-letter');
                ltr.style.background  = color;
                ltr.style.borderColor = color;
                ltr.style.color       = '#fff';
            }

            if (idx === q.correct) {
                markBtn(btn, 'correct');
                score++;
            } else {
                markBtn(btn, 'wrong');
                markBtn(btns[q.correct], 'correct');
                missed.push({ q: q.q, user: q.options[idx], correct: q.options[q.correct] });
            }

            document.getElementById('next-btn').style.display = 'block';
            if (q.explanation) document.getElementById('explain-btn').style.display = 'block';
        }

        function handleExplain() {
            const q = questions[currentIdx];
            const modal = document.getElementById('explain-modal');
            const explanation = q.explanation || 'No explanation available.';
            const sourceHTML = q.source
                ? `<div style="margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.07);">
                       <span style="font-size:0.78rem; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--accent-color);">
                           <i class="fas fa-book-open" style="margin-right:5px;"></i>Source
                       </span>
                       <p style="margin-top:6px; font-size:0.88rem; color:var(--text-muted);">${q.source}</p>
                   </div>`
                : '';
            document.getElementById('modal-text').innerHTML = explanation + sourceHTML;
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('explain-modal');
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) loadQ();
            else finish();
        }

        function finish() {
            document.getElementById('main-quiz-container').style.display = 'none';
            const resScreen = document.getElementById('result-screen');
            // On mobile use flex so the column layout (score → mistakes) works correctly
            resScreen.style.display = window.innerWidth <= 640 ? 'flex' : 'block';

            const target = Math.round((score / questions.length) * 100);
            let current = 0;
            const timer = setInterval(() => {
                if (current >= target) {
                    clearInterval(timer);
                    setTimeout(revealDetails, 650);
                } else {
                    current++;
                    document.getElementById('score-circle').textContent = current + '%';
                }
            }, 20);
        }

        function revealDetails() {
            const mSide = document.getElementById('mistakes-side');

            if (missed.length === 0) {
                mSide.innerHTML = `
                    <div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:0;">
                        <i class="fas fa-trophy" style="font-size:3rem;color:#fbbf24;margin-bottom:14px;"></i>
                        <h2 style="color:var(--correct-color);margin-bottom:8px;">Perfect Score!</h2>
                        <p style="color:var(--text-muted);font-size:0.87rem;max-width:210px;line-height:1.65;">
                             Ma OG , Keep It Homie 😎
                        </p>
                    </div>`;
            } else {
                mSide.innerHTML = `
                    <h3 style="color:var(--wrong-color);flex-shrink:0;">Your Wrong Answers</h3>
                    <p style="color:var(--text-muted);font-size:0.78rem;margin-top:4px;flex-shrink:0;">${missed.length} question${missed.length !== 1 ? 's' : ''} to review</p>
                    <div class="mistakes-list">
                        ${missed.map((m, i) => `
                            <div class="mistake-item" style="animation-delay:${i * 0.08}s">
                                <p style="font-weight:600;font-size:0.9rem;margin-bottom:6px;">${m.q}</p>
                                <p style="color:var(--wrong-color);font-size:0.82rem;">✘ ${m.user}</p>
                                <p style="color:var(--correct-color);font-size:0.82rem;">✔ ${m.correct}</p>
                            </div>`).join('')}
                    </div>`;
            }

            document.getElementById('result-screen').classList.add('revealed');
        }

        document.getElementById('theme-toggle').onclick = () => {
            document.body.classList.toggle('light-mode');
            document.querySelector('#theme-toggle i').className =
                document.body.classList.contains('light-mode') ? 'fas fa-moon' : 'fas fa-sun';
        };

        window.onload = init;
    </script>
</body>
</html>
